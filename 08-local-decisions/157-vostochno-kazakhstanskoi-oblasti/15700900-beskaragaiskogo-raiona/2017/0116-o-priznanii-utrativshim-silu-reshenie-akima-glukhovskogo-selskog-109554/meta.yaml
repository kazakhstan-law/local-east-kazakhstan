title:
  rus: О признании утратившим силу решение акима Глуховского сельского округа от 17 ноября 2016 года № 1 «Об установлении карантина в крестьянских хозяйствах «Дархан» и «Саят» Глуховского сельского округа Бескарагайского района»
  kaz: «Бесқарағай ауданы Глуховка ауылдық округінің «Дархан» және «Саят» шаруа қожалықтарындағы карантинді белгілеу туралу» Глуховка ауылдық округі әкімінің 2016 жылғы 17 қарашадағы № 1
