requisite: Решение акима Глуховского сельского округа Бескарагайского района Восточно-Казахстанской области от 14 ноября 2017 года № 7. Зарегистрировано Департаментом юстиции Восточно-Казахстанской области 30 ноября 2017 года № 5306
title:
  rus: О признании утратившим силу решение акима Глуховского сельского округа от 15 августа 2017 года № 6 «Об установлении карантина в селе Жыланды на участке «Дальняя дойка»  Глуховского сельского округа Бескарагайского района»
  kaz: «Бесқарағай ауданы Глуховка ауылдық округінің Жыланды ауылында «Дальняя дойка» учаскесінде карантин белгілеу туралы» Глуховка ауылдық округі әкімінің 2017 жылғы 15 тамыздағы № 6 шешімінің күшін жою туралы
