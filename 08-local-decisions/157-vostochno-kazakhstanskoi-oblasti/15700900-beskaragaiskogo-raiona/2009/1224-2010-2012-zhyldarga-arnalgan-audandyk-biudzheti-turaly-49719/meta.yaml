requisite: Шығыс Қазақстан облысы Бесқарағай аудандық мәслихатының 2009 жылғы 24 желтоқсандағы № 20/2-IV шешімі. Шығыс Қазақстан облысы Әділет департаментінің Бесқарағай ауданындағы Әділет басқармасында 2010 жылғы 11 қаңтарда № 5-7-74 тіркелді. Күші жойылды - Шығыс Қазақстан облысы Бесқарағай аудандық мәслихатының 2010 жылғы 28 желтоқсандағы № 27/9-IV шешімімен
