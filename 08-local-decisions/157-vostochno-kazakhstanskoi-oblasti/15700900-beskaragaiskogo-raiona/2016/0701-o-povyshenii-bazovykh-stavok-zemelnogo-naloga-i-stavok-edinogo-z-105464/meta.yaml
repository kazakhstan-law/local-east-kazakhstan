requisite: Решение Бескарагайского районного маслихата Восточно-Казахстанской области от 1 июля 2016 года № 4/9-VI. Зарегистрировано Департаментом юстиции Восточно-Казахстанской области 9 августа 2016 года № 4636. Утратило силу - решением Бескарагайского районного маслихата Восточно-Казахстанской области от 5 апреля 2018 года № 22/7-VI
title:
  rus: О повышении базовых ставок земельного налога и ставок единого земельного налога на не используемые в соответствии с земельным законодательством Республики Казахстан земли сельскохозяйственного назначения Бескарагайского района
  kaz: Қазақстан Республикасының жер заңнамасына сәйкес пайдаланылмайтын Бесқарағай ауданының ауыл шаруашылығы мақсатындағы жерлерге жер салығының базалық мөлшерлемелерін және бірыңғай жер салығының мөлшерлемелерін жоғарылату туралы
