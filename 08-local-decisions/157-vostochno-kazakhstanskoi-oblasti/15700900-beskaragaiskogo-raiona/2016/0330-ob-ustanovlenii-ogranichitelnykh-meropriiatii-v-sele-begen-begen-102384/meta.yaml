  title:
    rus: О внесении изменений в решение акима Бегенского сельского округа от 30 марта 2016 года № 1 «Об установлении ограничительных мероприятий в селе Бегень и в крестьянском хозяйстве «Ерганат» на животноводческой летней точке Бегенского сельского округа Бескарагайского района»
    kaz: «Бесқарағай ауданы Беген ауылдық округінің Беген ауылында және «Ерганат» жазғы мал жайылымындағы шаруа қожалығында шектеу іс-шараларын белгілеу туралы» Беген ауылдық округі әкімінің 2016 жылғы 30 наурыздағы № 1 шешіміне өзгерістер енгізу туралы
