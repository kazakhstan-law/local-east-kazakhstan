act_code: '57232'
requisite: Шығыс Қазақстан облысы Бесқарағай аудандық мәслихатының 2010 жылғы 28 желтоқсандағы № 27/4-IV шешімі. Шығыс Қазақстан облысы Әділет департаментінің Бесқарағай ауданындағы Әділет басқармасында 2011 жылғы 9 ақпанда № 5-7-89 тіркелді. Күші жойылды - Шығыс Қазақстан облысы Бесқарағай аудандық мәслихатының 2012 жылғы 6 маусымдағы № 4/1-V шешімімен
