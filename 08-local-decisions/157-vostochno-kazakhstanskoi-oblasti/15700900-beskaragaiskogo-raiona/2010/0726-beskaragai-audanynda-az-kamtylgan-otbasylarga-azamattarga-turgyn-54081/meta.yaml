act_code: '54081'
requisite: Шығыс Қазақстан облысы Бесқарағай аудандық мәслихатының 2010 жылғы 26 шілдедегі № 24/8-IV шешімі. Шығыс Қазақстан облысы Әділет департаментінің Бесқарағай ауданындағы Әділет басқармасында 2010 жылғы 19 тамызда № 5-7-83 тіркелді. Күші жойылды - Шығыс Қазақстан облысы Бесқарағай аудандық мәслихатының 2012 жылғы 6 сәуірдегі № 2/5-V шешімімен
title:
