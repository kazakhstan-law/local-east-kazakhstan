act_code: '50665'
requisite: Шығыс Қазақстан облысы Бесқарағай ауданының әкімінің 2010 жылғы 19 қаңтардағы № 31-1 шешімі. Шығыс Қазақстан облысы Әділет департаментінің Бесқарағай ауданындағы Әділет басқармасында 2010 жылғы 11 ақпанда № 5-7-75 тіркелді. Шешімнің қабылдау мерзімінің өтуіне байланысты қолдану тоқтатылды - Шығыс Қазақстан облысы Бесқарағай аудандық әкімдігінің 2010 жылғы 21 сәуірдегі № 1319 хатымен
