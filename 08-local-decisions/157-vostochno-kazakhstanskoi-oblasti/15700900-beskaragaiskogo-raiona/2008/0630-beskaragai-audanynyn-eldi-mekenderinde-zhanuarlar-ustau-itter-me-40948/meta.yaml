act_code: '40948'
requisite: Шығыс Қазақстан облысы Бесқарағай аудандық мәслихатының 2008 жылғы 30 маусымдағы № 8/3-IV шешімі. Шығыс Қазақстан облысы Әділет департаментінің Бесқарағай ауданындағы Әділет басқармасында 2008 жылғы 4 шілдеде № 5-7-57 тіркелді. Күші жойылды - Шығыс Қазақстан облысы Бесқарағай аудандық мәслихатының 2010 жылғы 28 желтоқсандағы № 27/4-IV шешімімен
title:
  rus: Бесқарағай ауданының елді мекендерінде жануарлар ұстау, иттер мен мысықтарды серуендету ережелері туралы
