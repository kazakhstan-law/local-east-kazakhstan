act_code: '43117'
requisite: Шығыс Қазақстан облысы Бесқарағай аудандық мәслихатының 2008 жылғы 24 желтоқсандағы № 12/2-IV шешімі. Шығыс Қазақстан облысы Әділет департаментінің Бесқарағай ауданындағы Әділет басқармасында 2008 жылғы 30 желтоқсанда № 5-7-60 тіркелді. Күші жойылды - Шығыс Қазақстан облысы Бесқарағай аудандық мәслихатының 2009 жылғы 24 желтоқсандағы № 20/6-IV шешімімен
