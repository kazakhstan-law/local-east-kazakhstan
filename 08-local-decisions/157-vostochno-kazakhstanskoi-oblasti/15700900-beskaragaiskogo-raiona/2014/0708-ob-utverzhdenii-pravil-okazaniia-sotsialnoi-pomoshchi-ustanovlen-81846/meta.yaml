act_code: '81846'
requisite: Решение Бескарагайского районного маслихата Восточно-Казахстанской области от 8 июля 2014 года № 23/6-V. Зарегистрировано Департаментом юстиции Восточно-Казахстанской области 5 августа 2014 года № 3442. Утратило силу решением Бескарагайского районного маслихата Восточно-Казахстанской области от 16 апреля 2020 года № 51/2-VI (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Правил оказания социальной помощи, установления размеров и определения перечня отдельных категорий нуждающихся граждан в Бескарагайском районе
  kaz: Бесқарағай ауданында әлеуметтік көмек көрсетудің, оның мөлшерлерін белгілеудің және мұқтаж азаматтардың жекелеген санаттарының тізбесін айқындаудың қағидаларын бекіту туралы
