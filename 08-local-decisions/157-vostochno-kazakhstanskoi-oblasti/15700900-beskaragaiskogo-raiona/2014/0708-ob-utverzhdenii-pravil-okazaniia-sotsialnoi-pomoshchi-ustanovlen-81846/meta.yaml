  title:
    rus: О внесении изменений в решение Бескарагайского районного маслихата от 8 июля 2014 года № 23/6-V «Об утверждении Правил оказания социальной помощи, установления размеров и определения перечня отдельных категорий нуждающихся граждан в Бескарагайском районе»
    kaz: Бесқарағай аудандық мәслихатының 2014 жылғы 8 шілдедегі № 23/6-V «Бесқарағай ауданында әлеуметтік көмек көрсетудің, оның мөлшерлерін белгілеудің және мұқтаж азаматтардың жекелеген санаттарының тізбесін айқындаудың қағидаларын бекіту туралы» шешіміне өзгерістер енгізу туралы
