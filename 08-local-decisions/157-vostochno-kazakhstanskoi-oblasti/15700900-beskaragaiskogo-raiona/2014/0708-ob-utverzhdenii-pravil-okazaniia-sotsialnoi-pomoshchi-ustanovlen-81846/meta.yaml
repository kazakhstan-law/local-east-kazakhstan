  title:
    rus: О внесении изменений и дополнений в решение Бескарагайского районного маслихата от 8 июля 2014 года № 23/6-V «Об утверждении Правил оказания социальной помощи, установления размеров и определения перечня отдельных категорий нуждающихся граждан в Бескарагайском районе»
    kaz: «Бесқарағай ауданында әлеуметтік көмек көрсетудің, оның мөлшерлерін белгілеудің және мұқтаж азаматтардың жекелеген санаттарының тізбесін айқындаудың қағидаларын бекіту туралы» Бесқарағай аудандық мәслихатының 2014 жылғы 8 шілдедегі № 23/6-V шешіміне өзгерістер мен толықтырулар енгізу туралы
