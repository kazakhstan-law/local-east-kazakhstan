requisite: Решение Бескарагайского районного маслихата Восточно-Казахстанской области от 31 марта 2014 года № 20/9-V. Зарегистрировано Департаментом юстиции Восточно-Казахстанской области 12 мая 2014 года № 3310. Утратило силу решением Бескарагайского районного маслихата области Абай от 24 августа 2023 года № 6/12-VIII (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Правил проведения раздельных сходов местного сообщества и определения количества представителей жителей сел, улиц, многоквартирных жилых домов для участия в сходах местного сообщества на территории Бескарагайского района
  kaz: Бесқарағай ауданының аумағында жергілікті қоғамдастықтың бөлек жиындарын өткізудің қағидаларын бекіту және жергілікті қоғамдастық жиынына қатысу үшін ауылдар, көшелер, көппәтерлі тұрғын үйлер тұрғындары өкілдерінің санын айқындау туралы
