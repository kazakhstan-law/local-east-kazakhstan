  title:
    rus: О внесении изменений в решение Бескарагайского районного маслихата от 31 марта 2014 года № 20/9-V «Об утверждении Правил проведения раздельных сходов местного сообщества и определения количества представителей жителей сел, улиц, многоквартирных жилых домов для участия в сходах местного сообщества на территории Бескарагайского района»
    kaz: Бесқарағай аудандық мәслихатының 2014 жылғы 31 наурыздағы № 20/9-V «Бесқарағай ауданының аумағында бөлек жергілікті қоғамдастық жиындарын өткізу Қағидасын бекіту және жергілікті қоғамдастық жиынына қатысу үшін ауылдар, көшелер, көппәтерлі тұрғын үйлер тұрғындары өкілдерінің санын айқындау туралы» шешіміне өзгерістер енгізу туралы
