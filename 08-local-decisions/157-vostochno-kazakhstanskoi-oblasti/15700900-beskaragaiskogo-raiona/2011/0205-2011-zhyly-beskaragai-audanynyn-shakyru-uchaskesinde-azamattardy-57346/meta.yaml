act_code: '57346'
requisite: Шығыс Қазақстан облысы Бесқарағай ауданының әкімінің 2011 жылғы 5 ақпандағы № 37-1 шешімі. Шығыс Қазақстан облысы Әділет департаментінің Бесқарағай ауданындағы Әділет басқармасында 2011 жылғы 22 ақпанда № 5-7-90 тіркелді. Күші жойылды - Шығыс Қазақстан облысы Бесқарағай ауданының әкімінің 2011 жылғы 28 сәуірдегі № 39-1 шешімімен
