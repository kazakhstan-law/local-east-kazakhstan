act_code: '36332'
requisite: Шығыс Қазақстан облысы Бесқарағай аудандық мәслихатының 2007 жылғы 19 желтоқсандағы № 3/2-IV шешімі. Шығыс Казақстан облысы Әділет департаментінің Бесқарағай ауданындағы Әділет басқармасында 2007 жылғы 27 желтоқсанда № 5-7-46 болып тіркелді. Күші жойылды - Шығыс Қазақстан облысы Бесқарағай аудандық мәслихатының 2009 жылғы 22 сәуірдегі № 14/11-IV шешімімен
