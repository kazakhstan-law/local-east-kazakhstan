  title:
    rus: О внесении изменения в решение Бескарагайского районного маслихата от 11 августа 2020 года № 55/8-VІ «Об утверждении Порядка и размера оказания социальной поддержки по оплате коммунальных услуг и приобретению топлива за счет бюджетных средств специалистам государственных организаций здравоохранения, социального обеспечения, образования, культуры, спорта и ветеринарии, проживающим и работающим в сельских населенных пунктах Бескарагайского района»
    kaz: Бесқарағай аудандық мәслихатының 2020 жылғы 11 тамыздағы № 55/8-VІ «Бесқарағай ауданының ауылдық елді мекендерінде тұратын және жұмыс істейтін мемлекеттік денсаулық сақтау, әлеуметтік қамсыздандыру, білім беру, мәдениет, спорт және ветеринария ұйымдарының мамандарына бюджет қаражаты есебінен коммуналдық көрсетілетін қызметтерге ақы төлеу және отын сатып алу бойынша әлеуметтік қолдау көрсету тәртібін және мөлшерін бекіту туралы» шешіміне өзгерістер енгізу туралы
