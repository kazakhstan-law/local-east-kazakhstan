act_code: '145720'
requisite: Решение Бескарагайского районного маслихата Восточно-Казахстанской области от 11 августа 2020 года № 55/8-VI. Зарегистрировано Департаментом юстиции Восточно-Казахстанской области 24 августа 2020 года № 7484
title:
  rus: Об утверждении Правил и размеров оказания социальной поддержки по оплате коммунальных услуг и приобретению топлива за счет бюджетных средств специалистам государственных организаций здравоохранения, социального обеспечения, образования, культуры, спорта и ветеринарии, проживающим и работающим в сельских населенных пунктах Бескарагайского района
  kaz: Бесқарағай ауданының ауылдық елді мекендерінде тұратын және жұмыс істейтін мемлекеттік денсаулық сақтау, әлеуметтік қамсыздандыру, білім беру, мәдениет, спорт және ветеринария ұйымдарының мамандарына бюджет қаражаты есебінен коммуналдық көрсетілетін қызметтерге ақы төлеу және отын сатып алу бойынша әлеуметтік қолдау көрсету Қағидалары мен мөлшерін бекіту туралы
