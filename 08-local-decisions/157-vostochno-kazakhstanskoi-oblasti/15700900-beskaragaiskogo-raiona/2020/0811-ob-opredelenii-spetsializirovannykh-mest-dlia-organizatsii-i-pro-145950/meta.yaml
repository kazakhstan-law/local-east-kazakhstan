  title:
    rus: О внесении изменения в решение Бескарагайского районного маслихата от 11 августа 2020 года № 55/9-VI «Об определении специализированных мест для организации и проведения мирных собраний, порядка их использования, норм их предельной заполняемости, требований к их материально-техническому и организационному обеспечению, границ прилегающих территорий, в которых запрещено проведение пикетирования по Бескарагайскому району»
    kaz: Бесқарағай аудандық маслихатының 2020 жылғы 11 тамыздағы № 55/9-VI «Бесқарағай ауданы бойынша бейбіт жиналыстарды ұйымдастыру және өткізу үшін арнайы орындарды, оларды пайдалану тәртібін, олардың шекті толу нормаларын, оларды материалдық-техникалық және ұйымдастырушылық қамтамасыз етуге қойылатын талаптарды, пикеттеуді өткізуге тыйым салынған іргелес аумақтардың шекараларын айқындау туралы» шешіміне өзгеріс енгізу туралы
