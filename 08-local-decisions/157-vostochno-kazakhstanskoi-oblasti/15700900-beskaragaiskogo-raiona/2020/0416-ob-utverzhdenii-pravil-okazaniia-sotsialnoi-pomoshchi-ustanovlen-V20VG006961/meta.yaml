  title:
    rus: О внесении изменения в решение Бескарагайского районного маслихата от 16 апреля 2020 года № 51/2–VI «Об утверждении Правил оказания социальной помощи, установления размеров и определения перечня отдельных категорий нуждающихся граждан в Бескарагайском районе»
    kaz: Бесқарағай аудандық мәслихатының 2020 жылғы 16 сәуірдігі № 51/2-VI «Бесқарағай ауданында әлеуметтік көмек көрсетудің, оның мөлшерлерін белгілеудің және мұқтаж азаматтардың жекелеген санаттарының тізбесін айқындаудың қағидаларын бекіту туралы» шешіміне өзгеріс енгізу туралы
