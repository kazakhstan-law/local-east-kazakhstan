requisite: Решение Бескарагайского районного маслихата Восточно-Казахстанской области от 16 апреля 2020 года № 51/2-VI. Зарегистрировано Департаментом юстиции Восточно-Казахстанской области 21 апреля 2020 года № 6961. Утратило силу решением Бескарагайского районного маслихата области Абай от 14 ноября 2023 года № 9/15-VIII (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
