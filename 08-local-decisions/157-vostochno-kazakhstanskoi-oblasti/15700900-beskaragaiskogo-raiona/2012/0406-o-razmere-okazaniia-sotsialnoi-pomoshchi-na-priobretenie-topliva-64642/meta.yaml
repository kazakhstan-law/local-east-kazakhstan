requisite: Решение Бескарагайского районного маслихата Восточно-Казахстанской области от 6 апреля 2012 года № 2/6-V. Зарегистрировано Управлением юстиции Бескарагайского района Департамента юстиции Восточно-Казахстанской области 12 апреля 2012 года за № 5-7-111. Утратило силу решением Бескарагайского районного маслихата Восточно-Казахстанской области от 11 июля 2012 года № 6/15-V
title:
  rus: О размере оказания социальной помощи на приобретение топлива специалистам государственных организаций здравоохранения, социального обеспечения, образования, культуры, спорта и ветеринарии проживающим и работающим в сельских населенных пунктах за счет местных бюджетных средств
  kaz: Ауылдық елді мекендерде тұратын және жұмыс істейтін мемлекеттік денсаулық сақтау, әлеуметтік қамсыздандыру, білім беру, мәдениет, спорт және ветеринария ұйымдарының мамандарына отын сатып алу үшін жергілікті бюджет қаражаты есебінен әлеуметтік көмек көрсету мөлшері туралы
