requisite: Решение Бескарагайского районного маслихата Восточно-Казахстанской области от 12 марта 2018 года № 21/4-VI. Зарегистрировано Департаментом юстиции Восточно-Казахстанской области 2 апреля 2018 года № 5586. Утратило силу решением Бескарагайского районного маслихата Восточно-Казахстанской области от 31 мая 2022 года № 20/2-VII (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении методики оценки деятельности административных государственных служащих корпуса «Б» государственного учреждения «Аппарат Бескарагайского районного маслихата»
