  title:
    rus: О внесении изменений в решение Бескарагайского районного маслихата от 12 марта 2018 года № 21/4-VI «Об утверждении методики оценки деятельности административных государственных служащих корпуса «Б» государственного учреждения «Аппарат Бескарагайского районного маслихата»»
    kaz: Бесқарағай аудандық мәслихатының 2018 жылғы 12 наурыздағы № 21/4-VІ ««Бесқарағай аудандық мәслихатының аппараты» мемлекеттік мекемесінің «Б» корпусы мемлекеттік әкімшілік қызметкерлерінің қызметін бағалаудың әдістемесін бекіту туралы» шешіміне өзгерістер енгізу туралы
