  title:
    rus: О приостановлении действия решения Бескарагайского районного маслихата от 17 октября 2018 года № 29/7-VI «Об оказании социальной поддержки специалистам государственных организаций, проживающим и работающим в сельских населенных пунктах Бескарагайского района»
    kaz: Бесқарағай аудандық мәслихатының 2018 жылғы 17 қазандағы № 29/7-VI «Бесқарағай ауданының ауылдық елді мекендерінде тұратын және жұмыс істейтін мемлекеттік ұйымдардың мамандарына әлеуметтік қолдау көрсету туралы» шешімінің қолданылуын тоқтата тұру  туралы
