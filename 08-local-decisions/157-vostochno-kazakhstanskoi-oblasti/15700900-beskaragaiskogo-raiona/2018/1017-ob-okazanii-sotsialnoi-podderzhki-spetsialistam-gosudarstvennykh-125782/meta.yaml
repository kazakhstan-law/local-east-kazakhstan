act_code: '125782'
requisite: Решение Бескарагайского районного маслихата Восточно-Казахстанской области от 17 октября 2018 года № 29/7-VI. Зарегистрировано Управлением юстиции Бескарагайского района Департамента юстиции Восточно-Казахстанской области 6 ноября 2018 года № 5-7-140. Действие решения приостановлено до 1 октября 2020 года решением Бескарагайского районного маслихата Восточно-Казахстанской области от 16 апреля 2020 года № 51/5-VI (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования). Утратило силу решением Бескарагайского районного маслихата Восточно-Казахстанской области от 11 августа 2020 года № 55/8-VI (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об оказании социальной поддержки специалистам государственных организаций, проживающим и работающим в сельских населенных пунктах Бескарагайского района
