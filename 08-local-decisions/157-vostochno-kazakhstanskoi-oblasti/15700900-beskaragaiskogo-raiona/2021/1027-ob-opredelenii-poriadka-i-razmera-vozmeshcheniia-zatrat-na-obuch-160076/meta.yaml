  title:
    rus: О внесении изменений в решение Бескарагайского районного маслихата  от 27 октября 2021 года № 10/6-VІI «Об определении порядка и размера возмещения затрат на обучение на дому детей с ограниченными возможностями из числа инвалидов по индивидуальному учебному плану в Бескарагайском районе»
    kaz: Бесқарағай аудандық мәслихатының 2021 жылғы 27 қазандағы № 10/6-VІI «Бесқарағай ауданында мүгедектер қатарындағы кемтар балаларды жеке оқыту жоспары бойынша үйде оқытуға жұмсаған шығындарын өндіріп алу тәртібі мен мөлшерін айқындау туралы» шешіміне өзгерістер енгізу туралы
