  title:
    rus: О внесении изменения в решение Бескарагайского районного маслихата от 27 октября 2021 года № 10/6-VІI «Об определении порядка и размера возмещения затрат на обучение на дому детей с ограниченными возможностями из числа детей с инвалидностью по индивидуальному учебному плану в Бескарагайском районе»
    kaz: Бесқарағай аудандық мәслихатының 2021 жылғы 27 қазандағы № 10/6-VІI «Бесқарағай ауданында мүгедектігі бар балалар қатарындағы кемтар балаларды жеке оқыту жоспары бойынша үйде оқытуға жұмсаған шығындарын өндіріп алу тәртібі мен мөлшерін айқындау туралы» шешіміне өзгеріс енгізу туралы
