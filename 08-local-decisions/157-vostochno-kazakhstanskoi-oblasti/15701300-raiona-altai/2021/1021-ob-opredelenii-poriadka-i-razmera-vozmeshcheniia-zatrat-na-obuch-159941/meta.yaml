  title:
    rus: О внесении изменений в решение маслихата района Алтай от 21 октября 2021 года № 8/3-VII «Об определении порядка и размера возмещения затрат на обучение на дому детей с ограниченными возможностями из числа инвалидов по индивидуальному учебному плану в районе Алтай»
    kaz: Алтай ауданының мәслихатының 2021 жылғы 21 қазандағы № 8/3-VII «Алтай ауданында мүгедектер қатарындағы кемтар балаларды жеке оқыту жоспары бойынша үйде оқытуға жұмсаған шығындарын өндіріп алу тәртібі мен мөлшерін айқындау туралы» шешіміне өзгерістер енгізу туралы
