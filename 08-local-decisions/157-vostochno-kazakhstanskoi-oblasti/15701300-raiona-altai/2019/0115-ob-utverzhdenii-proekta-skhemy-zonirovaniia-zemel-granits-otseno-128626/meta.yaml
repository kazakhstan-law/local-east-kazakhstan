title:
  rus: Об утверждении проекта (схемы) зонирования земель, границ оценочных зон и поправочных коэффициентов к базовым ставкам платы за земельные участки населенных пунктов Зыряновского района
  kaz: Зырян ауданының елді мекендерінің жерлерін аймақтарға бөлу жобасын (схемасын), бағалау аймақтарының шекараларын және жер учаскелері үшін төлемақының базалық мөлшерлемелеріне түзету коэффициенттерiн бекіту туралы
