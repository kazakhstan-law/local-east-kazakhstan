  title:
    rus: О внесении изменений и дополнения в решение маслихата Зыряновского района от 15 января 2019 года № 43/3-VI «Об утверждении проекта (схемы) зонирования земель, границ оценочных зон и поправочных коэффициентов к базовым ставкам платы за земельные участки населенных пунктов Зыряновского района»
    kaz: Зырян ауданы мәслихатының 2019 жылғы 15 қантардағы № 43/3-VI «Зырян ауданының елді мекендерінің жерлерін аймақтарға бөлу жобасын (схемасын), бағалау аймақтарының шекараларын және жер учаскелері үшін төлемақының базалық мөлшерлемелеріне түзету коэффициенттерiн бекіту туралы» шешіміне өзгерістер мен толықтыру енгізу туралы
