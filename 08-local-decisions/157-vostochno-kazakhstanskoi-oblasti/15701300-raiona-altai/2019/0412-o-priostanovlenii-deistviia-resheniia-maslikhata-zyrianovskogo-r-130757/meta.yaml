act_code: '130757'
requisite: Решение маслихата района Алтай Восточно-Казахстанской области от 12 апреля 2019 года № 47/13-VI. Зарегистрировано Департаментом юстиции Восточно-Казахстанской области 17 апреля 2019 года № 5862. Утратило силу решением маслихата района Алтай Восточно-Казахстанской области от 24 июня 2020 года № 68/2-VI (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: О приостановлении действия решения маслихата Зыряновского района от 26 июня 2017 года № 19/8-VI «Об утверждении норм образования и накопления коммунальных отходов, тарифов на захоронение твердых бытовых отходов по Зыряновскому району»
  kaz: Зырян ауданының мәслихатының 2017 жылғы 26 маусымдағы № 19/8-VI «Зырян ауданы бойынша коммуналдық қалдықтардың түзілу және жинақталу нормаларын, тұрмыстық қатты қалдықтарын көму тарифтерін бекіту туралы» шешімінің қолданылуын тоқтата тұру туралы
