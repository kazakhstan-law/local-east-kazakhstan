requisite: Решение маслихата района Алтай Восточно-Казахстанской области от 2 июля 2020 года № 69/18-VI. Зарегистрировано Департаментом юстиции Восточно-Казахстанской области 17 июля 2020 года № 7374. Утратило силу решением маслихата района Алтай Восточно-Казахстанской области от 12 апреля 2024 года № 13/17-VIII (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об определении специализированных мест для организации и проведения мирных собраний, порядка их использования, нормах их предельной заполняемости, требованиях к их материально-техническому и организационному обеспечению, границах прилегающих территорий, в которых запрещено проведение пикетирования в районе Алтай
  kaz: Алтай ауданында бейбіт жиналыстарды ұйымдастыру және өткізу үшін арнайы орындарды, оларды пайдалану тәртібін, олардың шекті толу нормаларын, олардың материалдық-техникалық және ұйымдастырушылық қамтамасыз етуге қойылатын талаптарды, пикеттеуді өткізуге тыйым салынған іргелес аумақтардың шекараларын айқындау туралы
