act_code: '143890'
requisite: Решение маслихата района Алтай Восточно-Казахстанской области от 11 июня 2020 года № 67/3-VI. Зарегистрировано Департаментом юстиции Восточно-Казахстанской области 17 июня 2020 года № 7194. Утратило силу решением маслихата района Алтай Восточно-Казахстанской области от 20 июня 2023 года № 4/8-VIII (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об оказании социальной поддержки по оплате коммунальных услуг и приобретению топлива за счет бюджетных средств специалистам государственных организаций здравоохранения, социального обеспечения, образования, культуры, спорта и ветеринарии, проживающим и работающим в сельских населенных пунктах района Алтай
  kaz: Алтай ауданының ауылдық елді мекендерінде тұратын және жұмыс істейтін мемлекеттік денсаулық сақтау, әлеуметтік қамсыздандыру, білім беру, мәдениет, спорт және ветеринария ұйымдарының мамандарына бюджет қаражаты есебiнен көрсетілетін коммуналдық қызметтерге ақы төлеу және отын сатып алу бойынша әлеуметтік қолдау көрсету туралы
