    kaz: Алтай ауданының мәслихатының 2014 жылғы 17 сәуірдегі № 30/5–V «Әлеуметтік көмек көрсетудің, оның мөлшерлерін белгілеудің және мұқтаж азаматтардың жекелеген санаттарының тізбесін айқындаудың қағидаларын бекіту туралы» шешіміне өзгеріс енгізу туралы
