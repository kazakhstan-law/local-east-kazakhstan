requisite: Решение маслихата Зыряновского района Восточно-Казахстанской области от 28 февраля 2014 года № 28/3-V. Зарегистрировано Департаментом юстиции Восточно-Казахстанской области 11 апреля 2014 года № 3229. Утратило силу решением маслихата района Алтай Восточно-Казахстанской области от 13 июня 2024 года № 16/7-VIII (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Правил проведения раздельных сходов местного сообщества и определения количества представителей жителей села, улицы, многоквартирного жилого дома для участия в сходе местного сообщества района Алтай
  kaz: Алтай ауданының бөлек жергілікті қоғамдастық жиындарын өткізу Қағидалары және жергілікті қоғамдастық жиынына қатысу үшін ауыл, көше, көппәтерлі тұрғын үй тұрғындары өкілдерінің санын айқындау туралы
