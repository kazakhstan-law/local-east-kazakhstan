  title:
    rus: О внесении изменений в решение маслихата Зыряновского района от 28 февраля 2014 года № 28/3-V «Об утверждении Правил проведения раздельных сходов местного сообщества и определения количества представителей жителей села, улицы, многоквартирного жилого дома для участия в сходе местного сообщества Зыряновского района»
    kaz: Зырян ауданының мәслихаттың 2014 жылғы 28 ақпандағы № 28/3-V «Зырян ауданының бөлек жергілікті қоғамдастық жиындарын өткізу Қағидасын және жергілікті қоғамдастық жиынына қатысу үшін ауыл, көше, көппәтерлі тұрғын үй тұрғындары өкілдерінің санын айқындау туралы» шешіміне өзгерістер енгізу туралы
