  title:
    rus: О внесении изменений в решение маслихата Зыряновского района от 30 марта 2018 года № 27/8-VI «О повышении базовых ставок земельного налога и ставок единого земельного налога на неиспользуемые земли сельскохозяйственного назначения»
    kaz: Зырян ауданының мәслихатының 2018 жылғы 30 наурыздағы № 27/8-VІ «Пайдаланылмайтын ауыл шаруашылығы мақсатындағы жерлерге жер салығының базалық мөлшерлемелерін және бірыңғай жер салығы мөлшерлемелерін жоғарылату туралы» шешіміне өзгерістер енгізу туралы
