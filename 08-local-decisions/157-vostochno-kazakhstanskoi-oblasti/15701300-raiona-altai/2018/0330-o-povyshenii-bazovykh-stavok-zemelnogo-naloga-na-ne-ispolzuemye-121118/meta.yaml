act_code: '121118'
requisite: Решение маслихата Зыряновского района Восточно-Казахстанской области от 30 марта 2018 года № 27/8-VI. Зарегистрировано Управлением юстиции Зыряновского района Департамента юстиции Восточно-Казахстанской области 19 апреля 2018 года № 5-12-152. Утратило силу решением маслихата района Алтай Восточно-Казахстанской области от 26 июля 2022 года № 19/3-VII (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: О повышении базовых ставок земельного налога на не используемые в соответствии с земельным законодательством Республики Казахстан земли сельскохозяйственного назначения района Алтай
  kaz: Қазақстан Республикасының жер заңнамасына сәйкес Алтай ауданының пайдаланылмайтын ауыл шаруашылығы мақсатындағы жерлерге жер салығының базалық мөлшерлемелерін арттыру туралы
