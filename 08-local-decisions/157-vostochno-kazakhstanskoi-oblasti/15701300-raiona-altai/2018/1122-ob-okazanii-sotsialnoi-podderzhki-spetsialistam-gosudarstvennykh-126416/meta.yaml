  title:
    rus: О приостановлении действия решения маслихата района Алтай от 22 ноября 2018 года № 38/3-VІ «Об оказании социальной поддержки специалистам государственных организаций, проживающим и работающим в сельских населенных пунктах района Алтай»
    kaz: Алтай ауданының мәслихатының 2018 жылғы 22 қарашадағы № 38/3-VI «Алтай ауданының ауылдық елді мекендерінде тұратын және жұмыс істейтін мемлекеттік ұйымдардың мамандарына әлеуметтік қолдау көрсету туралы» шешімнің қолданылуын тоқта тұру туралы
