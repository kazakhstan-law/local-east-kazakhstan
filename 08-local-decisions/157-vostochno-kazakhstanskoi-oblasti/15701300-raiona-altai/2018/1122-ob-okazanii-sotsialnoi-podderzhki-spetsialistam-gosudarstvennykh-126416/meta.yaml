  title:
    rus: О внесении изменений в решение маслихата Зыряновского района от 22 ноября 2018 года № 38/3-VI «Об оказании социальной поддержки специалистам государственных организаций, проживающим и работающим в сельских населенных пунктах Зыряновского района»
    kaz: Зырян ауданының мәслихатының 2018 жылғы 22 қарашадағы № 38/3-VI «Зырян ауданының ауылдық елді мекендерінде тұратын және жұмыс істейтін мемлекеттік ұйымдардың мамандарына әлеуметтік қолдау көрсету туралы» шешіміне өзгерістер енгізу туралы
