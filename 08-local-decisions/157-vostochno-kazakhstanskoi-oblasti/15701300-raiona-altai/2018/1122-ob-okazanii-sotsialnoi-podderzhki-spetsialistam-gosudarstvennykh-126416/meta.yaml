requisite: Решение маслихата Зыряновского района Восточно-Казахстанской области от 22 ноября 2018 года № 38/3-VI. Зарегистрировано Управлением юстиции Зыряновского района Департамента юстиции Восточно-Казахстанской области 27 ноября 2018 года № 5-12-172. Действие решения приостановлено решением маслихата района Алтай Восточно-Казахстанской области от 27 февраля 2020 года № 62/3-VI (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования). Утратило силу решением маслихата района Алтай Восточно-Казахстанской области от 11 июня 2020 года № 67/3-VI (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
