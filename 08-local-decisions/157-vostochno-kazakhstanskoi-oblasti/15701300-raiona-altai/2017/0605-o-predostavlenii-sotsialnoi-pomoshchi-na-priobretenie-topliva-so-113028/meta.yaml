act_code: '113028'
requisite: Решение маслихата Зыряновского района Восточно-Казахстанской области от 5 июня 2017 года № 18/4-VI. Зарегистрировано Департаментом юстиции Восточно-Казахстанской области 22 июня 2017 года № 5093. Утратило силу решением маслихата Зыряновского района Восточно-Казахстанской области от 22 ноября 2018 года № 38/3-VI
title:
  rus: О предоставлении социальной помощи на приобретение топлива, социальных гарантий и социальной поддержки специалистам государственных организаций, проживающим и работающим в сельских населенных пунктах Зыряновского района
  kaz: Зырян ауданының ауылдық елді мекендерінде тұратын және жұмыс істейтін, мемлекеттік ұйымдардың мамандарына отын сатып алу үшін әлеуметтік көмек, әлеуметтік кепілдіктер және әлеуметтік қолдау көрсету туралы
