  title:
    rus: О внесении изменений в решение маслихата Зыряновского района от 26 июня 2017 года № 19/8-VI «Об утверждении норм образования и накопления коммунальных отходов, тарифов на захоронение твердых бытовых отходов по Зыряновскому району»
    kaz: Зырян ауданының мәслихатының 2017 жылғы 26 маусымдағы № 19/8-VІ «Зырян ауданы бойынша коммуналдық қалдықтардың түзілу және жинақталу нормаларын, тұрмыстық қатты қалдықтарын көму тарифтерін бекіту туралы» шешіміне өзгерістер енгізу туралы
