title:
  rus: Об утверждении норм образования и накопления коммунальных отходов, тарифов на захоронение твердых бытовых отходов по  району Алтай
  kaz: Алтай ауданы бойынша коммуналдық қалдықтардың түзілу және жинақталу нормаларын, тұрмыстық қатты қалдықтарды жинауға, әкетуге және көмуге арналған тарифтерді бекіту туралы
