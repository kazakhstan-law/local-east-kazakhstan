requisite: Решение маслихата района Алтай Восточно-Казахстанской области от 12 апреля 2024 года № 13/17-VIII. Зарегистрировано Департаментом юстиции Восточно-Казахстанской области 19 апреля 2024 года № 9005-16
title:
  rus: Об определении специализированных мест для организации и проведения мирных собраний, порядка их использования, норм их предельной заполняемости, требований к их материально-техническому и организационному обеспечению, границ прилегающих территорий, в которых запрещено проведение пикетирования в районе Алтай
  kaz: Алтай ауданында бейбіт жиналыстарды ұйымдастыру және өткізу үшін арнайы орындарды, оларды пайдалану тәртібін, олардың шекті толу нормаларын, оларды материалдық-техникалық және ұйымдастырушылық қамтамасыз етуге қойылатын талаптарды, пикеттеуді өткізуге тыйым салынған іргелес аумақтардың шекараларын айқындау туралы
