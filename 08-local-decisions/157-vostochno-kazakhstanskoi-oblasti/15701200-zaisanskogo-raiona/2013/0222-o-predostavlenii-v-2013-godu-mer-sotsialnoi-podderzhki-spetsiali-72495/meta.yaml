requisite: Решение Зайсанского районного маслихата Восточно-Казахстанской области от 22 февраля 2013 года № 11-2/1. Зарегистрировано Департаментом юстиции Восточно-Казахстанской области 26 марта 2013 года № 2915. Утратило силу решением Зайсанского районного маслихата от 25 декабря 2013 года № 21-11/1
title:
  rus: О предоставлении в 2013 году мер социальной поддержки специалистам   здравоохранения, образования, социального обеспечения, культуры, спорта и ветеринарии, прибывшим для работы и проживания в сельские населенные пункты
  kaz: 2013 жылға арналған ауылдық елді мекендерге жұмыс істеу және тұру үшін келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және ветеринария мамандарына әлеуметтік қолдау шараларын ұсыну туралы
