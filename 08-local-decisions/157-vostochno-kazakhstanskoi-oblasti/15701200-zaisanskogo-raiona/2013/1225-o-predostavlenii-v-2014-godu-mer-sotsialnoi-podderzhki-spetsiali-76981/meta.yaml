requisite: Решение Зайсанского районного маслихата Восточно-Казахстанской области от 25 декабря 2013 года № 21-11/5. Зарегистрировано Департаментом юстиции Восточно-Казахстанской области 21 января 2014 года № 3172. Утратило силу - решением Зайсанского районного маслихата Восточно-Казахстанской области от 23 декабря 2014 года № 29-8/4
title:
  rus: О предоставлении в 2014 году мер социальной поддержки специалистам здравоохранения, образования, социального обеспечения, культуры, спорта и ветеринарии, прибывшим для работы и проживания в сельские населенные пункты
  kaz: 2014 жылға арналған ауылдық елдi мекендерге жұмыс iстеу және тұру үшiн келген денсаулық сақтау, бiлiм беру, әлеуметтiк қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен мамандарына әлеуметтiк қолдау шараларын ұсыну туралы
