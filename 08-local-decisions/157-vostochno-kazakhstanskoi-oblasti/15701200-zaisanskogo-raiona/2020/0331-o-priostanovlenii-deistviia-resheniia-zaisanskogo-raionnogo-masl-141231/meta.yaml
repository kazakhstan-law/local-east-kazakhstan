title:
  rus: О приостановлении действия решения Зайсанского районного маслихата от 18 сентября 2018 года № 30-3 «Об оказании социальной поддержки специалистам государственных организаций, проживающим и работающим в сельских населенных пунктах Зайсанского района»
  kaz: Зайсан аудандық мәслихатының 2018 жылғы 18 қыркүйектегі № 30-3 «Зайсан ауданының ауылдық елді мекендерінде тұратын және жұмыс істейтін мемлекеттік ұйымдардың мамандарына әлеуметтік көмек көрсету туралы» шешімінің қолданысын тоқтата тұру туралы
