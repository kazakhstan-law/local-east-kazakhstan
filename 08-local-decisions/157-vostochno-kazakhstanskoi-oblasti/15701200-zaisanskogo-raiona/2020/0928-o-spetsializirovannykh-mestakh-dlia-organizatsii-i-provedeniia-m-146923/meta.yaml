act_code: '146923'
requisite: Решение Зайсанского районного маслихата Восточно-Казахстанской области от 28 сентября 2020 года № 62-2. Зарегистрировано Департаментом юстиции Восточно-Казахстанской области 30 сентября 2020 года № 7601. Утратило силу решением Зайсанского районного маслихата Восточно-Казахстанской области от 11 марта 2024 года № 01-03/VIII-19-2/3 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: О специализированных местах для организации и проведения мирных собраний, порядке их использования, нормах их предельной заполняемости, требованиях к их материально-техническому и организационному обеспечению, границах прилегающих территорий, в которых запрещено проведение пикетирования
  kaz: Бейбіт жиналыстарды ұйымдастыру және өткізу үшін арнайы орындар, оларды пайдалану тәртібі, олардың шекті толу нормалары, олардың материалдық-техникалық және ұйымдастырушылық қамтамасыз етуге қойылатын талаптары, пикеттеуді өткізуге тыйым салынған іргелес аумақтардың шекараларын айқындау туралы
