act_code: '152348'
requisite: Решение Зайсанского районного маслихата Восточно-Казахстанской области от 25 декабря 2020 года № 68-10. Зарегистрировано Департаментом юстиции Восточно-Казахстанской области 12 января 2021 года № 8332
title:
  rus: О предоставлении мер социальной поддержки специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта, агропромышленного комплекса и государственным служащим аппаратов акимов сельских округов, прибывшим для работы и проживания в сельские населенные пункты Зайсанского района на 2021 год
  kaz: Зайсан ауданының ауылдық елдi мекендерге жұмыс iстеу және тұру үшiн келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт, агроөнеркәсіптік кешен саласындағы мамандарға және ауылдық округтер әкімдері аппараттарының мемлекеттік қызметшілеріне 2021 жылға әлеуметтiк қолдау шараларын ұсыну туралы
