act_code: '146926'
requisite: Решение Зайсанского районного маслихата Восточно-Казахстанской области от 21 сентября 2020 года № 61-6. Зарегистрировано Департаментом юстиции Восточно-Казахстанской области 30 сентября 2020 года № 7598. Утратило силу решением Зайсанского районного маслихата Восточно-Казахстанской области от 28 августа 2024 года № 25/7-VIII (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Правил и размера оказания социальной поддержки по оплате коммунальных услуг и приобретению топлива за счет бюджетных средств специалистам государственных организаций здравоохранения, социального обеспечения, образования, культуры, спорта и ветеринарии, проживающим и работающим в сельских населенных пунктах Зайсанского района
  kaz: Зайсан ауданының ауылдық елді мекендерінде тұратын және жұмыс  істейтін мемлекеттік денсаулық сақтау, әлеуметтік  қамсыздандыру, білім беру, мәдениет, спорт және  ветеринария ұйымдарының мамандарына бюджет қаражаты есебiнен коммуналдық көрсетілетін қызметтерге ақы төлеу және отын сатып алу бойынша әлеуметтік қолдау көрсету Қағидасы мен мөлшерін бекіту туралы
