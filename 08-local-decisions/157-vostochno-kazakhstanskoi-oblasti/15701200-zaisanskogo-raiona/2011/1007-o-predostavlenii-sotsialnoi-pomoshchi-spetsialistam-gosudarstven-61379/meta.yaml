requisite: Решение Зайсанского районного маслихата Восточно-Казахстанской области от 7 октября 2011 года № 35-4/2. Зарегистрировано управлением юстиции Зайсанского района Департамента юстиции Восточно-Казахстанской области 14 ноября 2011 года за № 5-11-142. Утратило силу - решением Зайсанского районного маслихата Восточно-Казахстанской области от 16 июля 2012 года № 5-2/1
title:
  rus: О предоставлении социальной помощи специалистам государственных организаций здравоохранения, социального обеспечения, образования, культуры и спорта, проживающим и работающим в сельских населенных пунктах
  kaz: Ауылдық елді мекендерде тұратын және жұмыс істейтін мемлекеттік денсаулық сақтау, әлеуметтік қамсыздандыру, білім беру, мәдениет және спорт ұйымдарының мамандарына әлеуметтік көмек беру туралы
