requisite: Решение Зайсанского районного маслихата Восточно-Казахстанской области от 18 сентября 2018 года № 30-3. Зарегистрировано Управлением юстиции Зайсанского района Департамента юстиции Восточно-Казахстанской области 12 октября 2018 года № 5-11-168. Действие решения приостановлено решением Зайсанского районного маслихата Восточно-Казахстанской области от 31 марта 2020 года № 52-8/2 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования). Утратило силу решением Зайсанского районного маслихата Восточно-Казахстанской области от 21 сентября 2020 года № 61-6 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
