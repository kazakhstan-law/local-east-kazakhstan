requisite: Решение Зайсанского районного маслихата Восточно-Казахстанской области от 28 декабря 2018 года № 34-2. Зарегистрировано Управлением юстиции Зайсанского района Департамента юстиции Восточно-Казахстанской области 10 января 2019 года № 5-11-188. Утратило силу решением Зайсанского районного маслихата Восточно-Казахстанской области от 24 февраля 2020 года № 50-6/1 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: О предоставлении мер социальной поддержки специалистам здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса прибывшим для работы и проживания в сельские населенные пункты на 2019 год
  kaz: 2019 жылға арналған ауылдық елдi мекендерге жұмыс iстеу және тұру үшiн келген денсаулық сақтау, бiлiм беру, әлеуметтiк қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға әлеуметтiк қолдау шараларын ұсыну туралы
