  title:
    rus: О внесении изменения в решение Зайсанского районного маслихата от 28 декабря 2018 года № 34-2 «О предоставлении мер социальной поддержки специалистам здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса прибывшим для работы и проживания в сельские населенные пункты на 2019 год»
    kaz: Зайсан аудандық мәслихатының 2018 жылғы 28 желтоқсандағы № 34-2 «2019 жылға арналған ауылдық елдi мекендерге жұмыс iстеу және тұру үшiн келген денсаулық сақтау, бiлiм беру, әлеуметтiк қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға әлеуметтiк қолдау шараларын ұсыну туралы» шешіміне өзгеріс енгізу туралы
