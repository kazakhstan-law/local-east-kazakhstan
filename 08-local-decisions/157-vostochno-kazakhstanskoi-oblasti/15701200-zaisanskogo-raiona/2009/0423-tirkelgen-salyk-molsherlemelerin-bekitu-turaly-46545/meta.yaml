requisite: Шығыс Қазақстан облысы Зайсан ауданы мәслихатының 2009 жылғы 23 сәуірдегі № 13-3/7 шешімі. Шығыс Қазақстан облысы Әділет департаментінің Зайсан аудандық Әділет басқармасында 2009 жылғы 2 маусымда № 5-11-97 тіркелді. Күші жойылды - Шығыс Қазақстан облысы Зайсан аудандық мәслихатының 2018 жылғы 7 наурыздағы № 22-2 шешімімен
