act_code: '49604'
requisite: Шығыс Қазақстан облысы Зайсан аудандық мәслихатының 2009 жылғы 29 желтоқсандағы № 17-1 шешімі. Шығыс Қазақстан облысы Әділет департаментінің Зайсан аудандық әділет басқармасында 2009 жылғы 31 желтоқсанда № 5-11-107 тіркелді. Қолданылу мерзімінің өтуіне байланысты күші жойылды (Зайсан аудандық мәслихатының 2011 жылғы 11 қаңтардағы № 28 хаты)
