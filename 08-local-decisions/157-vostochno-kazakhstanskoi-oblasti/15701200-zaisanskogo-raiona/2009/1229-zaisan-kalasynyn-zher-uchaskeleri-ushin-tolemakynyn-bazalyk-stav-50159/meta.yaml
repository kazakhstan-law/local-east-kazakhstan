act_code: '50159'
requisite: Шығыс Қазақстан облысы Зайсан аудандық мәслихатының 2009 жылғы 29 желтоқсандағы № 17-6/2 шешімі. Шығыс Қазақстан облысы Әділет департаментінің Зайсан аудандық Әділет басқармасында 2010 жылғы 22 қаңтарда № 5-11-109 тіркелді
