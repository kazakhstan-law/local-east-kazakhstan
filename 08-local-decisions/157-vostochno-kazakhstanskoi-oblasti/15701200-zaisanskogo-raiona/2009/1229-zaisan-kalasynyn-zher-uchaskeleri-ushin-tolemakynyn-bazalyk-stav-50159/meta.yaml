    rus: О внесении изменений в решение Зайсанского районного маслихата от 29 декабря 2009 года № 17-6/2 «Об утверждении поправочных коэффициентов к базовым ставкам земельного налога и базовым ставкам платы за земельные участки города Зайсан»
    kaz: «Зайсан қаласының жер учаскелері үшін төлемақының базалық мөлшерлемесіне және жер салығының базалық мөлшерлемесіне түзету коэффициенттерін бекіту туралы» 2009 жылғы 29 желтоқсандағы № 17-6/2 Зайсан аудандық мәслихатының шешіміне өзгерістер енгізу туралы
