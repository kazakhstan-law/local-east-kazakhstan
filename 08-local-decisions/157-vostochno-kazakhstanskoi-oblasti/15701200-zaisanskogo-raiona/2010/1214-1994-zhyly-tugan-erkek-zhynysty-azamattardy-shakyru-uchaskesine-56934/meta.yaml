requisite: Шығыс Қазақстан облысы Зайсан ауданы әкімінің 2010 жылғы 14 желтоқсандағы № 2 шешімі. Шығыс Қазақстан облысы Әділет департаментінің Зайсан аудандық әділет басқармасында 2011 жылғы 19 қаңтарда № 5-11-128 тіркелді. Күші жойылды - Зайсан аудыны әкімінің 2011 жылғы 31 наурыздағы № 4 шешімімен
