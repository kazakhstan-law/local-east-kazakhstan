act_code: '54311'
requisite: Шығыс Қазақстан облысы Зайсан аудандық мәслихатының 2010 жылғы 29 шілдедегі № 23-3/5 шешімі. Шығыс Қазақстан облысы Әділет департаментінің Зайсан аудандық әділет басқармасында 2010 жылғы 3 қыркүйекте № 5-11-121 тіркелді. Күші жойылды - Зайсан аудандық мәслихатының 2011 жылғы 7 қазандағы № 35-4/2 шешімімен
title:
