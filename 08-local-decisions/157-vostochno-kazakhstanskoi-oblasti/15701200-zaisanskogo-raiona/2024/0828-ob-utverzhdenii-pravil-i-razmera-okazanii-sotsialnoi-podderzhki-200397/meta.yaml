act_code: '200397'
requisite: Решение Зайсанского районного маслихата Восточно-Казахстанской области от 28 августа 2024 года № 25/7-VIII. Зарегистрировано Департаментом юстиции Восточно-Казахстанской области 4 сентября 2024 года № 9072-16
title:
  rus: Об утверждении Правил и размера оказании социальной поддержки по оплате коммунальных услуг и приобретению топлива за счет бюджетных средств специалистам государственных организаций здравоохранения, социального обеспечения, образования, культуры, спорта и ветеринарии, проживающим и работающим в сельских населенных пунктах Зайсанского района
  kaz: Зайсан ауданының ауылдық елді мекендерінде тұратын және жұмыс істейтін мемлекеттік денсаулық сақтау, әлеуметтік қамсыздандыру, білім беру, мәдениет, спорт және ветеринария ұйымдарының мамандарына бюджет қаражаты есебiнен коммуналдық көрсетілетін қызметтерге ақы төлеу және отын сатып алу бойынша әлеуметтік қолдау көрсету Қағидасын және мөлшерін бекіту туралы
