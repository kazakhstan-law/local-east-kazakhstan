act_code: '205297'
requisite: Решение Зайсанского районного маслихата Восточно-Казахстанской области от 25 декабря 2024 года № 30/7-VIII. Утратило силу решением Зайсанского районного маслихата Восточно-Казахстанской области от 23 декабря 2025 года № 46/1-VIII (вводится в действие с 01.01.2026)
title:
  rus: О предоставлении мер социальной поддержки специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, государственным служащим аппаратов акимов  сел, поселков, сельских округов, прибывшим для работы и проживания в сельские населенные пункты Зайсанского района на 2025 год
  kaz: Зайсан ауданындағы ауылдық елдi мекендерге жұмыс iстеу және тұруға келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға, ауылдық округтер әкімдері аппараттарының мемлекеттік қызметшілеріне 2025 жылға әлеуметтiк қолдау  шараларын ұсыну туралы
