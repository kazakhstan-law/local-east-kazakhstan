act_code: '194576'
requisite: Решение Зайсанского районного маслихата Восточно-Казахстанской области от 11 марта 2024 года № 01-03/VIII-19-2/3. Зарегистрировано Департаментом юстиции Восточно-Казахстанской области 19 марта 2024 года № 8974-16
title:
  rus: Об определении специализированных мест для организации и проведения мирных собраний и норм их предельной заполняемости, требований к их материально-техническому и организационному обеспечению, порядка их использования, границ прилегающих территории, в которых запрещено проведение пикетирования по Зайсанскому району
  kaz: Зайсан ауданы бойынша бейбіт жиналыстарды ұйымдастыру және өткізу үшін арнайы орындарды және олардың шекті толу нормаларын, оларды материалдық-техникалық және ұйымдастырушылық қамтамасыз етуге қойылатын талаптарды, пайдалану тәртібін, пикеттеуді өткізуге тыйым салынған іргелес аумақтардың шекараларын айқындау туралы
