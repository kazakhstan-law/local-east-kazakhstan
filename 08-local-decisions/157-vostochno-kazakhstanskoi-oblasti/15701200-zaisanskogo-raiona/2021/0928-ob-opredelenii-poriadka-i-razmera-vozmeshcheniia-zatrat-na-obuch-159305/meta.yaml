  title:
    rus: О внесении изменений в решение Зайсанского районного маслихата от 28 сентября 2021 года № 11-4/4 «Об определении порядка и размера возмещения затрат на обучение на дому детей с ограниченными возможностями из числа  инвалидов по индивидуальному учебному  плану в Зайсанском районе»
    kaz: Зайсан аудандық мәслихатының 2021 жылғы 28 қыркүйектегі № 11-4/4 «Зайсан ауданында мүгедектер қатарындағы кемтар балаларды жеке оқыту жоспары бойынша үйде оқытуға жұмсаған шығындарын өндіріп алу тәртібін және мөлшерін айқындау туралы» шешіміне өзгерістер енгізу туралы
