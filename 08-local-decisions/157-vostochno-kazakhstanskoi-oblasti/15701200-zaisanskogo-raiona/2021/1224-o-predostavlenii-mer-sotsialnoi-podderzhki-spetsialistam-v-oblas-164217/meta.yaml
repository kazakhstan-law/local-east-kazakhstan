act_code: '164217'
requisite: Решение Зайсанского районного маслихата Восточно-Казахстанской области от 24 декабря 2021 года № 15-16
title:
  rus: О предоставлении мер социальной поддержки специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта, агропромышленного комплекса и государственным служащим аппаратов акимов сельских округов, прибывшим для работы и проживания в сельские населенные пункты Зайсанского района на 2022 год
  kaz: Зайсан ауданының ауылдық елдi мекендерге жұмыс iстеу және тұру үшiн келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт, агроөнеркәсіптік кешен саласындағы мамандарға және ауылдық округтер әкімдері аппараттарының мемлекеттік қызметшілеріне 2022 жылға әлеуметтiк қолдау шараларын ұсыну туралы
