requisite: Решение Зайсанского районного маслихата Восточно-Казахстанской области от 18 июля 2014 года № 26-4. Зарегистрировано Департаментом юстиции Восточно-Казахстанской области 20 августа 2014 года № 3461. Утратило силу решением Зайсанского районного маслихата Восточно-Казахстанской области от 6 ноября 2023 года № 01-03/VIII-12-15/2 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Правил проведения раздельных сходов местного сообщества и определения количества представителей жителей села, улицы, многоквартирного жилого дома для участия в сходах местного сообщества на территории Зайсанского района
  kaz: Зайсан ауданының аумағында бөлек жергілікті қоғамдастық жиындарын өткізу және жергілікті қоғамдастық жиынына қатысу үшін ауыл, көше, көппәтерлі тұрғын үй тұрғындары өкілдерінің санын айқындау қағидасын бекіту туралы
