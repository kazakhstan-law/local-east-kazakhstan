requisite: Решение Зайсанского районного маслихата Восточно-Казахстанской области от 18 июля 2014 года № 26-5/2. Зарегистрировано Департаментом юстиции Восточно-Казахстанской области 12 августа 2014 года № 3449. Утратило силу - решением Зайсанского районного маслихата Восточно-Казахстанской области от 22 декабря 2017 года № 20-11
title:
  rus: О предоставлении социальной помощи на приобретение топлива специалистам государственных организаций здравоохранения, социального обеспечения, образования, культуры, спорта и ветеринарии, проживающим и работающим в сельских населенных пунктах Зайсанского района
  kaz: Зайсан ауданының ауылдық елді мекендерінде тұратын және жұмыс істейтін мемлекеттік денсаулық сақтау, әлеуметтік қамсыздандыру, білім беру, мәдениет, спорт және ветеринария ұйымдарының мамандарына отын сатып алуға әлеуметтік көмек беру туралы
