title:
  rus: О признании утратившим силу решение маслихата Зайсанского района Восточно-Казахстанской области от 27 марта 2024 года №VIII-21-20 «О понижении размера ставки налогов при применении специального налогового режима розничного налога в Зайсанском районе»
  kaz: Шығыс Қазақстан облысы Зайсан аудандық мәслихатының 2024 жылғы 27 наурыздағы «Зайсан ауданында бөлшек салықтың арнаулы салық режимін қолдану кезінде салық мөлшерлемесінің мөлшерін төмендету туралы» №VIII-21-20 шешімінің күшін жою туралы
