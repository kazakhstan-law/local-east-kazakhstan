act_code: '219391'
requisite: Решение Зайсанского районного маслихата Восточно-Казахстанской области от 23 декабря 2025 года № 46/1-VIII
title:
  rus: О предоставлении мер социальной поддержки специалистам в области здравоохранения, образования, социальной защиты, культуры, спорта и агропромышленного комплекса, а также государственным служащим аппаратов акимов сельских округов, прибывшим для работы и проживания в сельских населённых пунктах Зайсанского района в 2026 году в виде единовременного пособия и бюджетного кредита на приобретение или строительство жилья
  kaz: Зайсан ауданындағы ауылдық елдi мекендерге жұмыс iстеу және тұру үшiн келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласы мамандарына, ауылдық округтер әкімдері аппараттарының мемлекеттік қызметшілеріне 2026 жылға көтерме жәрдемақы және тұрғын үй сатып алуға немесе салуға бюджеттік кредит түрінде әлеуметтік қолдау шараларын ұсыну туралы
