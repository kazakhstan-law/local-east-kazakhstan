act_code: '69012'
requisite: Решение Зайсанского районного маслихата Восточно-Казахстанской области от 21 ноября 2012 года № 8-2/2. Зарегистрировано Департаментом юстиции Восточно-Казахстанской области 7 декабря 2012 года № 2753. Утратило силу - решением Зайсанского районного маслихата от 21 декабря 2012 года № 10-7/3
title:
  rus: О предоставлении в 2012 году мер социальной поддержки специалистам здравоохранения, образования, социального обеспечения, культуры, спорта и ветеринарии, прибывшим для работы и проживания в сельские населенные пункты
  kaz: 2012 жылға арналған ауылдық елді мекендерге жұмыс істеу және тұру үшін келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және ветеринария мамандарына әлеуметтік қолдау шараларын ұсыну туралы
