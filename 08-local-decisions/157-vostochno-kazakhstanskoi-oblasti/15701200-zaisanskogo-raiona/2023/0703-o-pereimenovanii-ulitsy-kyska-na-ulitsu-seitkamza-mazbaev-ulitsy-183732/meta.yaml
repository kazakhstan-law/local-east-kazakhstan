title:
  rus: О переименовании улицы «Қысқа» на улицу «Сейтқамза Мазбаев», улицы «Қазан» на улицу «Ахметқан Адиков» села Карабулак Зайсанского района  Восточно-Казахстанской области
  kaz: Шығыс Қазақстан облысы Зайсан ауданы Қарабұлақ ауылындағы «Қысқа» көшесінің атауын «Мазбаев Сейтқамза», «Қазан» көшесінің атауын «Адиков Ахметқан» көшесі болып қайта атау туралы
