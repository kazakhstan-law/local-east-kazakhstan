act_code: '192376'
requisite: Решение Зайсанского районного маслихата Восточно-Казахстанской области от 29 декабря 2023 года № 01-03/VIII-17-11/1
title:
  rus: О предоставлении мер социальной поддержки специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, государственным служащим аппаратов акимов сельских округов, прибывшим для работы и проживания в сельские населенные пункты Зайсанского района на 2024 год
  kaz: Зайсан ауданындағы ауылдық елдi мекендерге жұмыс iстеу және тұру үшiн келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға, ауылдық округтер әкімдері аппараттарының мемлекеттік қызметшілеріне 2024 жылға әлеуметтiк қолдау шараларын ұсыну
