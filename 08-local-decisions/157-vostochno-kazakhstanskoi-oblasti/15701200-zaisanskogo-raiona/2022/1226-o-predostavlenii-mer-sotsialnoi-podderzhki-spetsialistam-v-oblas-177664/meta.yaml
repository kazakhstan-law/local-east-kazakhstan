act_code: '177664'
requisite: Решение Зайсанского районного маслихата Восточно-Казахстанской области от 26 декабря 2022 года № 27-4
title:
  rus: О предоставлении мер социальной поддержки специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, государственным служащим аппаратов акимов сельских округов, прибывшим для работы и проживания в сельские населенные пункты Зайсанского района на 2023 год
  kaz: Зайсан ауданының ауылдық елдi мекендерге жұмыс iстеу және тұру үшiн келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға, ауылдық округтер әкімдері аппараттарының мемлекеттік қызметшілеріне 2023 жылға әлеуметтiк қолдау шараларын ұсыну
