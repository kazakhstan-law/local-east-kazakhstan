requisite: Шығыс Қазақстан облысы Зайсан аудандық мәслихатының 2008 жылғы 11 шілдедегі № 7-5/1 шешімі. Шығыс Қазақстан облысы Әділет департаментінің Зайсан аудандық Әділет басқармасында 2008 жылғы 15 тамызда № 5-11-82 тіркелді. Күші жойылды - Зайсан аудандық мәслихатының 2009 жылғы 23 сәуірдегі № 13-3/5 шешімімен
