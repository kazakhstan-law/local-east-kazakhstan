requisite: Шығыс Қазақстан облысы Зайсан ауданының әкімінің 2008 жылғы 23 желтоқсандағы № 19 шешімі. Шығыс Қазақстан облысы Әділет департаментінің Зайсан аудандық Әділет басқармасында 2009 жылғы 16 қаңтарда № 5-11-88 тіркелді. Күші жойылды - Зайсан ауданы әкімінің 2009 жылғы 8 шілдедегі № 29 шешімімен
