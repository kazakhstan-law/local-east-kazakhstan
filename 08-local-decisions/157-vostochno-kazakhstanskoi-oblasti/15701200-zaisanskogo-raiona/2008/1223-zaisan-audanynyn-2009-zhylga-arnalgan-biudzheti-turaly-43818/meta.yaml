act_code: '43818'
requisite: Шығыс Қазақстан облысы Зайсан аудандық мәслихатының 2008 жылғы 23 желтоқсандағы № 10-1 шешімі. Шығыс Қазақстан облысы Әділет департаментінің Зайсан аудандық әділет басқармасында 2008 жылғы 31 желтоқсанда № 5-11-87 тіркелді. Қабылданған мерзімінің бітуіне байланысты күші жойылды - Зайсан аудандық мәслихатының 2010 жылғы 6 қаңтардағы № 4 хаты
