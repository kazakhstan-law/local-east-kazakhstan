act_code: '138795'
requisite: Решение Зайсанского районного маслихата Восточно-Казахстанской области от 27 декабря 2019 года № 49-2. Зарегистрировано Департаментом юстиции Восточно-Казахстанской области 16 января 2020 года № 6557. Утратило силу решением Зайсанского районного маслихата Восточно-Казахстанской области от 25 декабря 2020 года № 68-10 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: О предоставлении мер социальной поддержки специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта, агропромышленного комплекса и государственным служащим аппарата акимов сельских округов, прибывшим для работы и проживания в сельские населенные пункты Зайсанского района на 2020 год
  kaz: 2020 жылға Зайсан ауданының ауылдық елді мекендеріне жұмыс істеуге жəне тұруға келген денсаулық сақтау, білім беру, əлеуметтік қамсыздандыру, мəдениет, спорт, агроөнеркəсіптік кешен саласындағы мамандарға және ауылдық округтер əкімдері аппараттарының мемлекеттік қызметшілеріне әлеуметтiк қолдау шараларын ұсыну туралы
