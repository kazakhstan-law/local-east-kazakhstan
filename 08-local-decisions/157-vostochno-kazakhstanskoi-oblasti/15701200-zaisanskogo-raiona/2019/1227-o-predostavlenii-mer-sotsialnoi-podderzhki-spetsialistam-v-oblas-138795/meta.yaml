  title:
    rus: О внесении изменений в решение Зайсанского районного маслихата от 27 декабря 2019 года № 49-2 «О предоставлении мер социальной поддержки специалистам здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса прибывшим для работы и проживания в сельские населенные пункты на 2020 год»
    kaz: Зайсан аудандық мәслихатының 2019 жылғы 27 желтоқсандағы № 49-2 «2020 жылға арналған ауылдық елдi мекендерге жұмыс iстеу және тұру үшiн келген денсаулық сақтау, бiлiм беру, әлеуметтiк қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға әлеуметтiк қолдау шараларын ұсыну туралы» шешіміне өзгерістер енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/146925/rus
