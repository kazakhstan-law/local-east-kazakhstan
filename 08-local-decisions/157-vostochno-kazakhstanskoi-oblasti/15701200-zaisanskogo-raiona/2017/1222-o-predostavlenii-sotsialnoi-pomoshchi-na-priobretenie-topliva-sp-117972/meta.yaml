act_code: '117972'
requisite: Решение Зайсанского районного маслихата Восточно-Казахстанской области от 22 декабря 2017 года № 20-11. Зарегистрировано Департаментом юстиции Восточно-Казахстанской области 10 января 2018 года № 5401. Утратило силу решением Зайсанского районного маслихата Восточно-Казахстанской области от 18 сентября 2018 года № 30-3
title:
  rus: О предоставлении социальной помощи на приобретение топлива специалистам государственных организаций здравоохранения, социального обеспечения, образования, культуры, спорта и ветеринарии,  проживающим и работающим в сельских населенных пунктах Зайсанского района
  kaz: Зайсан ауданының ауылдық елді мекендерде тұратын және жұмыс істейтін мемлекеттік денсаулық сақтау, әлеуметтік қамсыздандыру, білім беру, мәдениет, спорт және ветеринария ұйымдарының мамандарына отын cатып алу үшін әлеуметтік көмек беру туралы
