  title:
    rus: О внесении изменений и дополнений в решение Аягозского районного маслихата от 28 мая 2014 года № 25/176-V «Об утверждении Правил оказания социальной помощи, установления размеров и определения перечня отдельных категорий нуждающихся граждан»
    kaz: Аягөз аудандық мәслихатының 2014 жылғы 28 мамырдағы № 25/176-V «Әлеуметтiк көмек көрсетудiң, оның мөлшерлерiн белгiлеудiң және мұқтаж азаматтардың жекелеген санаттарының тiзбесiн айқындаудың қағидаларын бекіту туралы» шешіміне өзгерістер мен толықтырулар енгізу туралы
