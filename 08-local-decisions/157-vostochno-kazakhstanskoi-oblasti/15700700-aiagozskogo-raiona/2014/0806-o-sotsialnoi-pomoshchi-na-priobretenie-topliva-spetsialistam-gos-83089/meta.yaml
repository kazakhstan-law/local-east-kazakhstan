requisite: Решение Аягозского районного маслихата Восточно-Казахстанской области от 6 августа 2014 года № 28/195-V. Зарегистрировано Департаментом юстиции Восточно-Казахстанской области 5 сентября 2014 года № 3477. Утратило силу решением Аягозского районного маслихата Восточно-Казахстанской области от 6 сентября 2018 года № 27/190-VI
title:
  rus: О социальной помощи на приобретение топлива специалистам государственных организаций здравохранения, социального обеспечения, образования, культуры, спорта и ветеринарии, проживающим и работающим в сельских населенных пунктах
  kaz: Ауылдық елді мекендерде тұратын және жұмыс істейтін мемлекеттік денсаулық сақтау, әлеуметтік қамсыздандыру, білім беру, мәдениет, спорт және ветеринария ұйымдарының мамандарына отын сатып алуға әлеуметтік көмек туралы
