  title:
    rus: О внесении изменений в решение Аягозского районного маслихата от 06 августа 2014 года № 28/196-V «Об утверждении Правил проведения раздельных сходов местного сообщества и определения количества представителей жителей села, улицы, многоквартирного жилого дома для участия в сходах местного сообщества Аягозского района»
    kaz: Аягөз аудандық мәслихатының 2014 жылғы 6 тамыздағы №28/196-V «Аягөз ауданында бөлек жергілікті қоғамдастық жиындарын өткізудің және жергілікті қоғамдастық жиынына қатысу үшін ауыл, көше, көппәтерлі тұрғын үй тұрғындары өкілдерінің санын айқындау Қағидаларын бекіту туралы» шешіміне өзгерістер енгізу туралы
