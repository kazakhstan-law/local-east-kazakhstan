requisite: Решение Аягозского районного маслихата Восточно-Казахстанской области от 6 августа 2014 года № 28/196-V. Зарегистрировано Департаментом юстиции Восточно-Казахстанской области 5 сентября 2014 года № 3478. Утратило силу решением Аягозского районного маслихата области Абай от 16 августа 2023 года № 5/88-VIII (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
