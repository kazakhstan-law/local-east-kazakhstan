requisite: Шығыс Қазақстан облысы Аягөз аудандық мәслихатының 2010 жылғы 28 шілдедегі N 01-02/27-17 шешімі. Шығыс Қазақстан облысы Әділет департаментінің Аягөз аудандық әділет басқармасында 2010 жылғы 18 тамызда N 5-6-111 тіркелді. Күші жойылды - Шығыс қазақстан облысы Аягөз аудандық мәслихатының 2012 жылғы 18 мамырдағы N 4/27-V шешімімен
