act_code: '52325'
requisite: Шығыс Қазақстан облысы Аягөз аудандық мәслихатының 2010 жылғы 16 сәуірдегі № 01-02/24-14 шешімі. Шығыс Қазақстан облысы Аягөз ауданының әділет басқармасында 2010 жылғы 11 мамырда № 5-6-105 тіркелді. Күші жойылды - Аягөз аудандық мәслихатының 2012 жылғы 18 мамырдағы № 4/27-V шешімімен
title:
