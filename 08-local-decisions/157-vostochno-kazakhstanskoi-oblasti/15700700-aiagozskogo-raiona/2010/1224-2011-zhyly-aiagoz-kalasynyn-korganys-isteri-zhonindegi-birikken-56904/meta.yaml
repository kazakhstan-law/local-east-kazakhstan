act_code: '56904'
requisite: Шығыс Қазақстан облысы Аягөз ауданы әкімінің 2010 жылғы 24 желтоқсандағы № 01 шешімі. Шығыс Қазақстан облысы әділет департаментінің Аягөз аудандық әділет басқармасында 2011 жылғы 20 қаңтарда № 5-6-129 тіркелді. Шешімнің қабылдау мерзімінің өтуіне байланысты қолдану тоқтатылды (Аягөз ауданының әділет басқармасының 2011 жылғы 11 мамырдағы № 04-08/2366 хаты)
title:
  rus: 2011 жылы Аягөз қаласының қорғаныс істері жөніндегі біріккен бөлімінің шақыру учаскесіне тіркеу жылы он жеті жасқа толатын, сондай-ақ шақыру учаскесіне бұрын тіркелмеген Қазақстан Республикасының еркек жынысты азаматтарын тіркеуді өткізу туралы
  kaz: 2011 жылы Аягөз қаласының қорғаныс істері жөніндегі біріккен бөлімінің шақыру учаскесіне тіркеу жылы он жеті жасқа толатын, сондай-ақ шақыру учаскесіне бұрын тіркелмеген Қазақстан Республикасының еркек жынысты азаматтарын тіркеуді өткізу туралы
