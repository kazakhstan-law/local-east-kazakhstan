act_code: '54023'
requisite: Шығыс Қазақстан облысы Аягөз аудандық мәслихатының 2010 жылғы 28 шілдедегі № 01-02/27-14 шешімі. Шығыс Қазақстан облысы Әділет департаментінің Аягөз аудандық әділет басқармасында 2010 жылғы 16 тамызда № 5-6-110 тіркелді. Күші жойылды - Аягөз аудандық мәслихатының 2012 жылғы 13 шілдедегі № 5/37-V шешімімен
