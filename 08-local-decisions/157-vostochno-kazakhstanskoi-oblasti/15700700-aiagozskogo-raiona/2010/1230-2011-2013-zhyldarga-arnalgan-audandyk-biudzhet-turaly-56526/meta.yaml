act_code: '56526'
requisite: Шығыс Қазақстан облысы Аягөз аудандық мәслихатының 2010 жылғы 30 желтоқсандағы № 01-02/30-2 шешімі. Шығыс Қазақстан облысы Әділет департаментінің Аягөз аудандық әділет басқармасында 2010 жылғы 31 желтоқсанда № 5-6-128 тіркелді. Шешімнің қабылдау мерзімінің өтуіне байланысты қолдану тоқтатылды (Аягөз аудандық мәслихатының 2011 жылғы 27 желтоқсандағы № 166/0617/620х хаты)
