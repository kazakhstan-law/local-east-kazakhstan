  title:
    rus: О внесении изменений в решение Аягозского районного маслихата от 25 октября 2021 года № 8/123-VIІ «Об определении порядка и размера возмещения затрат на обучение на дому детей с ограниченными возможностями из числа инвалидов по индивидуальному учебному плану в Аягозском районе»
    kaz: Аягөз аудандық мәслихатының 2021 жылғы 25 қазандағы № 8/123-VІІ «Аягөз ауданында мүгедектер қатарындағы кемтар балаларды жеке оқыту жоспары бойынша үйде оқытуға жұмсаған шығындарын өндіріп алу тәртібі мен мөлшерін айқындау туралы» шешіміне өзгерістер енгізу туралы
