  title:
    rus: О внесении изменений в решение Аягозского районного маслихата от 25 октября 2021 года № 8/124-VIІ «Об утверждении Правил оказания социальной поддержки по оплате коммунальных услуг и приобретению топлива за счет бюджетных средств специалистам государственных организаций здравоохранения, социального обеспечения, образования, культуры, спорта и ветеринарии, проживающим и работающим в сельских населенных пунктах Аягозского района»
    kaz: Аягөз аудандық мәслихатының 2021 жылғы 25 қазандағы № 8/124-VII «Аягөз ауданының ауылдық елді мекендерінде тұратын және жұмыс істейтін мемлекеттік денсаулық сақтау, әлеуметтік қамсыздандыру, білім беру, мәдениет, спорт және ветеринария ұйымдарының мамандарына бюджет қаражаты есебiнен коммуналдық көрсетілетін қызметтерге ақы төлеу және отын сатып алу бойынша әлеуметтік қолдау көрсету Қағидасын бекіту туралы» шешіміне өзгерістер енгізу туралы
