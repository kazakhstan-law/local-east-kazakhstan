act_code: '160077'
requisite: Решение Аягозского районного маслихата Восточно-Казахстанской области от 25 октября 2021 года № 8/124-VII. Зарегистрировано в Министерстве юстиции Республики Казахстан 9 ноября 2021 года № 25072. Утратило силу решением Аягозского районного маслихата области Абай от 19 декабря 2024 года № 19/356-VIII (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Порядка и размера оказания социальной поддержки по оплате коммунальных услуг и приобретению топлива за счет бюджетных средств специалистам государственных организаций здравоохранения, социального обеспечения, образования, культуры, спорта и ветеринарии, проживающим и работающим в сельских населенных пунктах Аягозского района
  kaz: Аягөз ауданының ауылдық елді мекендерінде тұратын және жұмыс істейтін мемлекеттік денсаулық сақтау, әлеуметтік қамсыздандыру, білім беру, мәдениет, спорт және ветеринария ұйымдарының мамандарына бюджет қаражаты есебiнен коммуналдық көрсетілетін қызметтерге ақы төлеу және отын сатып алу бойынша әлеуметтік қолдау көрсету тәртібі мен мөлшерін бекіту туралы
