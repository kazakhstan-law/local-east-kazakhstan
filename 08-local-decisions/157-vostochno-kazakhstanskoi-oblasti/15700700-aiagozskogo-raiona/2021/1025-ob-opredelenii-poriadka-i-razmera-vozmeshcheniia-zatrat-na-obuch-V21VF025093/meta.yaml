  title:
    rus: О внесении изменения в решение Аягозского районного маслихата от 25 октября 2021 года № 8/123-VІІ «Об определении порядка и размера возмещения затрат на обучение на дому детей с ограниченными возможностями из числа детей с инвалидностью по индивидуальному учебному плану в Аягозском районе»
