requisite: Решение акима Акшатауского сельского округа Аягозского района Восточно-Казахстанской области от 1 февраля 2021 года № 1. Зарегистрировано Департаментом юстиции Восточно-Казахстанской области 3 февраля 2021 года № 8395. Утратило силу решением акима Акшатауского сельского округа Аягозского района Восточно-Казахстанской области от 8 апреля 2021 года № 2 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
