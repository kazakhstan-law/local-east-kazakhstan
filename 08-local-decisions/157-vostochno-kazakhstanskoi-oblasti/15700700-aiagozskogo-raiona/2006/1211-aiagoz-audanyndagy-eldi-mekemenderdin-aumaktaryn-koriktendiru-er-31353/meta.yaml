act_code: '31353'
requisite: Шығыс Қазақстан облысы Аягөз аудандық мәслихатының 2006 жылғы 11 желтоқсандағы № 01-02/31-5 шешімі. Шығыс Қазақстан облысы Әділет департаментінің Аягөз аудандық Әділет басқармасында 2007 жылғы 18 қаңтарда № 5-6-44 болып тіркелді. Күші жойылды - Шығыс Қазақстан облысы Аягөз аудандық мәслихатының 2012 жылғы 13 шілдедегі № 5/37-V шешімімен
