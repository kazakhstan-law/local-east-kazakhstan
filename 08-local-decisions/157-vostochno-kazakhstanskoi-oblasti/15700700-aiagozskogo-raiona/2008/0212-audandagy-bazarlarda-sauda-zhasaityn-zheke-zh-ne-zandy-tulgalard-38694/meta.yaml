requisite: Шығыс Қазақстан облысы Аягөз аудандық мәслихатының 2008 жылғы 12 ақпандағы № 01-02/4-5 шешімі. Шығыс Қазақстан облысысының Әділет департаментінің Аягөз ауданының әділет басқармасында 2008 жылғы 27 ақпанда № 5-6-66 тіркелді. Күші жойылды - Аягөз аудандық мәслихатының 2009.04.24 № 01-02/15-5 шешімімен
title:
