act_code: '41815'
requisite: Шығыс Қазақстан облысы Аягөз аудандық мәслихатының 2008 жылғы 24 қыркүйектегі № 01-02/10-4 шешімі. Шығыс Қазақстан облысысының Әділет департаментінің Аягөз ауданының әділет басқармасында 2008 жылғы 6 қазанда № 5-6-75 тіркелді. Күші жойылды - Шығыс Қазақстан облысы Аягөз аудандық мәслихатының 2009 жылғы 22 қазандағы № 01-02/19-4 шешімімен
