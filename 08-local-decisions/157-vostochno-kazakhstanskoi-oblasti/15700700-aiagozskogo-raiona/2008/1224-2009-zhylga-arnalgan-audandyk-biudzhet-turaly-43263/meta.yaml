act_code: '43263'
requisite: Шығыс Қазақстан облысы Аягөз аудандық мәслихатының 2008 жылғы 24 желтоқсандағы № 01-02/12-2 шешімі. Шығыс Қазақстан облысы Әділет департаментінің Аягөз аудандық әділет басқармасында 2009 жылғы 5 қаңтарда № 5-6-88 тіркелді. Күші жойылды - қабылданған мерзімінің бітуіне байланысты (Аягөз аудандық әділет басқармасының 2010 жылғы 09 ақпандағы № 1057 хаты)
