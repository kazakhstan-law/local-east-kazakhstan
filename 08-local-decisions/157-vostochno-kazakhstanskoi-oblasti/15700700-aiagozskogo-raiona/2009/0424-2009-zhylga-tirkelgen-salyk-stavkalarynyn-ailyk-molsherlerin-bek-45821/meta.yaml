requisite: Шығыс Қазақстан облысы Аягөз аудандық мәслихатының 2009 жылғы 24 сәуірдегі № 01-02/15-5 шешімі. Шығыс Қазақстан облысы Әділет департаментінің Аягөз аудандық Әділет басқармасында 2009 жылғы 8 мамырда № 5-6-92 тіркелді. Күші жойылды - Аягөз аудандық мәслихатының 2011 жылғы 18 наурыздағы № 01-02/32-16 шешімімен
