    kaz: «Аягөз ауданының Аягөз қаласындағы және Ақтоғай кентіндегі тұрмыстық қатты қалдықтарды жинауға, әкетуге және көмуге арналған тарифтерді бекіту туралы» Аягөз аудандық мәслихатының 2018 жылғы 09 ақпандағы № 19/138-VІ шешімнің қолданылуын тоқтата тұру туралы
