    kaz: Аягөз аудандық мәслихатының 2018 жылғы 9 ақпандағы № 19/138-VІ «Аягөз ауданындағы тұрмыстық қатты қалдықтарды жинауға, әкетуге және көмуге арналған тарифтерді бекіту туралы» шешіміне өзгерістер енгізу туралы
