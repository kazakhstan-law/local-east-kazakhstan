requisite: Решение Аягозского районного маслихата Восточно-Казахстанской области от 9 февраля 2018 года № 19/138-VI. Зарегистрировано Департаментом юстиции Восточно-Казахстанской области 23 февраля 2018 года № 5490. Возобновлено действие решением Аягозского районного маслихата Восточно-Казахстанской области от 27 июня 2019 года № 39/262-VI. Действие решения приостановлено решением Аягозского районного маслихата от 14 апреля 2020 года № 46/367-VI (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования). Утратило силу решением Аягозского районного маслихата области Абай от 16 января 2023 года № 21/429-VII (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении тарифов на сбор, вывоз и захоронение твердых бытовых отходов в городе Аягоз и поселке Актогай Аягозского района
  kaz: Аягөз ауданының Аягөз қаласындағы және Ақтоғай кентіндегі тұрмыстық қатты қалдықтарды жинауға, әкетуге және көмуге арналған тарифтерді бекіту туралы
