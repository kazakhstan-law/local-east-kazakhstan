requisite: Решение Аягозского районного маслихата Восточно-Казахстанской области от 23 июля 2018 года № 26/183-VI. Зарегистрировано Управлением юстиции Аягозского района Департамента юстиции Восточно-Казахстанской области 2 августа 2018 года № 5-6-175. Утратило силу решением Аягозского районного маслихата Восточно-Казахстанской области от 2 июля 2020 года № 49/407-VI (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: О повышении ставок единого земельного налога на не используемые в соответствии с земельным законодательством Республики Казахстан земли сельскохозяйственного назначения Аягозского района
  kaz: Қазақстан Республикасының жер заңнамасына сәйкес пайдаланылмайтын Аягөз ауданының ауыл шаруашылығы мақсатындағы жерлерге бірыңғай жер салығының мөлшерлемесін арттыру туралы
