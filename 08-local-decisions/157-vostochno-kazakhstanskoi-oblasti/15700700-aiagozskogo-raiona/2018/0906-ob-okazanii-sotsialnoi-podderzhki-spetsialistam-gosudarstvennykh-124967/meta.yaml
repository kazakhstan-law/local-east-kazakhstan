requisite: Решение Аягозского районного маслихата Восточно-Казахстанской области от 6 сентября 2018 года № 27/190-VI. Зарегистрировано Управлением юстиции Аягозского района Департамента юстиции Восточно-Казахстанской области 24 сентября 2018 года № 5-6-180. Утратило силу решением Аягозского районного маслихата Восточно-Казахстанской области от 2 июля 2020 года № 49/414-VI (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования). Действие решения приостановлено до 1 августа 2020 года решением Аягозского районного маслихата от 31 марта 2020 года № 45/339-VI (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
