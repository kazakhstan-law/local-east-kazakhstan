    kaz: «Аягөз ауданының ауылдық елді мекендерінде тұратын және жұмыс істейтін мемлекеттік ұйымдардың мамандарына әлеуметтік қолдау көрсету туралы» Аягөз аудандық мәслихатының 2018 жылғы 6 қыркүйектегі № 27/190-VI шешіміне өзгеріс енгізу туралы
