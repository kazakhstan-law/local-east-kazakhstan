  title:
    rus: О приостановлении действия решения Аягозского районного маслихата от 6 сентября 2018 года 27/190-VI «Об оказании социальной поддержки специалистам государственных организаций, проживающим и работающим в сельских населенных пунктах Аягозского района»
    kaz: «Аягөз ауданының ауылдық елді мекендерінде тұратын және жұмыс істейтін мемлекеттік ұйымдардың мамандарына әлеуметтік қолдау көрсету туралы» Аягөз аудандық мәслихатының 2018 жылғы 6 қыркүйектегі № 27/190-VI шешімінің қолданылуын тоқтата тұру туралы
