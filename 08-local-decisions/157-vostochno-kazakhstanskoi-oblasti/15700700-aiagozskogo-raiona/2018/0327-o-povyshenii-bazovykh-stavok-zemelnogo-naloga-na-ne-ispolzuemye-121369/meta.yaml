  title:
    rus: О внесении изменений в решение Аягозского районного маслихата от 27 марта 2018 года № 21/153-VI «О повышении базовых ставок земельного налога и единого земельного налога на не используемые земли сельскохозяйственного назначения по Аягозскому району»
    kaz: «Аягөз ауданы бойынша пайдаланылмайтын ауыл шаруашылығы мақсатындағы жерлерге жер салығының базалық мөлшерлемелерін және бірыңғай жер салығының мөлшерлемелерін жоғарылату туралы» Аягөз аудандық мәслихатының 2018 жылғы 27 наурыздағы № 21/153-VІ шешіміне өзгерістер енгізу туралы
