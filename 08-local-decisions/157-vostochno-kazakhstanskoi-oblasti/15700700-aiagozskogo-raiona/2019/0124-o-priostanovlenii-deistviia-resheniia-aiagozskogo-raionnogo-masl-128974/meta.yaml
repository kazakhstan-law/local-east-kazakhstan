requisite: Решение Аягозского районного маслихата Восточно-Казахстанской области от 24 января 2019 года № 34/230-VI. Зарегистрировано Управлением юстиции Аягозского района Департамента юстиции Восточно-Казахстанской области 4 февраля 2019 года № 5-6-194. Утратило силу решением Аягозского районного маслихата Восточно-Казахстанской области от 27 июня 2019 года № 39/262-VI
title:
  rus: О приостановлении действия решения Аягозского районного маслихата от 09 февраля 2018 года № 19/138-VI «Об утверждении тарифов на сбор, вывоз и захоронение твердых бытовых отходов в Аягозском районе»
  kaz: «Аягөз ауданындағы тұрмыстық қатты қалдықтарды жинауға, әкетуге және көмуге арналған тарифтерді бекіту туралы» Аягөз аудандық мәслихатының 2018 жылғы 09 ақпандағы № 19/138-VІ шешімнің қолданылуын тоқтата тұру туралы
