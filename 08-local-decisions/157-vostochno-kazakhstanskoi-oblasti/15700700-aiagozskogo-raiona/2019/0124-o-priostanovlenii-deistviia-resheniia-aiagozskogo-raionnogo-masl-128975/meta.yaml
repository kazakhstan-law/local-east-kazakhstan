requisite: Решение Аягозского районного маслихата Восточно-Казахстанской области от 24 января 2019 года № 34/229-VI. Зарегистрировано Управлением юстиции Аягозского района Департамента юстиции Восточно-Казахстанской области 4 февраля 2019 года № 5-6-193. Утратило силу решением Аягозского районного маслихата Восточно-Казахстанской области от 14 мая 2019 года № 37/252-VI
title:
