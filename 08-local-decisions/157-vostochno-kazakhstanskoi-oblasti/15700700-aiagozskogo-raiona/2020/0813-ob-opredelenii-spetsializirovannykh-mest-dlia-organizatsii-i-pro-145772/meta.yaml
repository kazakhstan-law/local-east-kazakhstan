act_code: '145772'
requisite: Решение Аягозского районного маслихата Восточно-Казахстанской области от 13 августа 2020 года № 50/424-VI. Зарегистрировано Департаментом юстиции Восточно-Казахстанской области 26 августа 2020 года № 7491
title:
  rus: Об определении специализированных мест для организации и проведения мирных собраний, порядка их использования, норм их предельной заполняемости, требований к их материально-техническому и организационному обеспечению, границ прилегающих территорий, в которых запрещено проведение пикетирования по Аягозскому району
  kaz: Аягөз ауданы бойынша бейбіт жиналыстарды ұйымдастыру және өткізу үшін арнайы орындарды, оларды пайдалану тәртібін, олардың шекті толу нормаларын, оларды материалдық-техникалық және ұйымдастырушылық қамтамасыз етуге қойылатын талаптарды, пикеттеуді өткізуге тыйым салынған іргелес аумақтардың шекараларын айқындау туралы
