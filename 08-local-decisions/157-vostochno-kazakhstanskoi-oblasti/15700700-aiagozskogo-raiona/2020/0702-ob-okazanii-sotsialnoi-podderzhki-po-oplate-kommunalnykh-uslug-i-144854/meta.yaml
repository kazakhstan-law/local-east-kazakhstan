act_code: '144854'
requisite: Решение Аягозского районного маслихата Восточно-Казахстанской области от 2 июля 2020 года № 49/414-VI. Зарегистрировано Департаментом юстиции Восточно-Казахстанской области 13 июля 2020 года № 7339. Утратило силу решением Аягозского районного маслихата Восточно-Казахстанской области от 25 октября 2021 года № 8/124-VII (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об оказании социальной поддержки по оплате коммунальных услуг и приобретению топлива за счет бюджетных средств специалистам государственных организаций здравоохранения, социального обеспечения, образования, культуры, спорта и ветеринарии, проживающим и работающим в сельских населенных пунктах Аягозского района
  kaz: Аягөз ауданының ауылдық елді мекендерде тұратын және жұмыс істейтін мемлекеттік денсаулық сақтау, әлеуметтік қамсыздандыру, білім беру, мәдениет, спорт және ветеринария ұйымдарының мамандарына бюджет қаражаты есебiнен көрсетілетін коммуналдық қызметтерге ақы төлеу және отын сатып алу бойынша әлеуметтік қолдау көрсету туралы
