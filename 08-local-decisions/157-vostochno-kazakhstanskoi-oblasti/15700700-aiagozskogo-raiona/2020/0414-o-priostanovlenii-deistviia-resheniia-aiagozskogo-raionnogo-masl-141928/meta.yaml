act_code: '141928'
requisite: Решение Аягозского районного маслихата Восточно-Казахстанской области от 14 апреля 2020 года № 46/367-VI. Зарегистрировано Департаментом юстиции Восточно-Казахстанской области 17 апреля 2020 года № 6951. Утратило силу решением Аягозского районного маслихата области Абай от 16 января 2023 года № 21/429-VII (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: О приостановлении действия решения Аягозского районного маслихата от 09 февраля 2018 года № 19/138-VI «Об утверждении тарифов на сбор, вывоз и захоронение твердых бытовых отходов в городе Аягоз и поселке Актогай Аягозского района»
  kaz: «Аягөз ауданының Аягөз қаласындағы және Ақтоғай кентіндегі тұрмыстық қатты қалдықтарды жинауға, әкетуге және көмуге арналған тарифтерді бекіту туралы» Аягөз аудандық мәслихатының 2018 жылғы 09 ақпандағы № 19/138-VІ шешімнің қолданылуын тоқтата тұру туралы
