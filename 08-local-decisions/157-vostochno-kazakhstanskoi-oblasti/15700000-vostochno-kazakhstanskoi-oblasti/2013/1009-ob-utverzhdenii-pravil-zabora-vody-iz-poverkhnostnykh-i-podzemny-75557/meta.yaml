  title:
    rus: О внесении изменения в решение Восточно-Казахстанского областного маслихата от 9 октября 2013 года № 14/171-V «Об утверждении Правил забора воды из поверхностных и подземных водных объектов при нецентрализованном питьевом и хозяйственно-бытовом водоснабжении населения Восточно-Казахстанской области»
    kaz: «Шығыс Қазақстан облысының халқын орталықтандырылмаған ауыз сумен және шаруашылық-тұрмыстық сумен жабдықтау кезінде жер үсті және жер асты су объектілерінен су алу ережесін бекіту туралы» Шығыс Қазақстан облыстық мәслихатының 2013 жылғы 9 қазандағы № 14/171-V шешіміне өзгеріс енгізу туралы
