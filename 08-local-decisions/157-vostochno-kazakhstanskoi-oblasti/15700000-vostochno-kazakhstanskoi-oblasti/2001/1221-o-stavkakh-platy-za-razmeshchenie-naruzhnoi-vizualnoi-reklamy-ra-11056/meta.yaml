requisite: Решение ХII сессии Восточно-Казахстанского областного маслихата II созыва от 21 декабря 2001 года N 12/10-II. Зарегистрировано управлением юстиции Восточно-Казахстанской области 21 января 2002 года за N 646. Утратило силу с 1 июня 2002 года решением XV сессии ВКО маслихата N 15/12-II от 30 мая 2002 года.
title:
