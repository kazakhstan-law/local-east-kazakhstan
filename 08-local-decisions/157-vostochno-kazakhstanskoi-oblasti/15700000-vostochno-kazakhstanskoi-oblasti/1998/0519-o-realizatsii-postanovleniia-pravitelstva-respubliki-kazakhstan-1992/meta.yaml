title:
  rus: О реализации постановления Правительства Республики Казахстан от 19 августа 1997 г. "О нормах отпуска топлива, потребления жилищно-коммунальных услуг, услуг связи при предоставлении льгот отдельным категориям граждан в соответствии с действующим законодательством"
  kaz: '"Азаматтардың жекелеген санаттарына жеңілдіктер беру кезінде отын босату, тұрғын үй-коммуналдық қызмет, байланыс қызметін тұтыну нормалары туралы" Қазақстан Республикасы Үкіметінің 1997 жылғы 19 тамыздағы қаулысын жүзеге асыру туралы'
