act_code: '2590'
requisite: Решение Акима Восточно-Казахстанской области от 29 декабря 1998 года № 627-к. Зарегистрировано управлением юстиции Восточно-Казахстанской области 22 января 1999 года за № 135. Утратило силу решением акима ВКО от 24 сентября 2004 года № 100
title:
  rus: О состоянии производственного травматизма,охраны труда и технической безопасности на промышленных предприятиях г. Лениногорска, ходе выполнения Протокольного Решения Правительства Республики Казахстан от 5 мая 1998 года № 11 "О состоянии технической безопасности на предприятиях Восточно-Казахстанской области"
  kaz: Лениногор қаласының, өнеркәсіп кәсіпорындарында өндірістік жара- катталудың, еңбек қорғау мен техникалық қауіпсіздіктің жағдайы, «Шығыс Қазақсан облысының кәсіпорындарында техникалық қауіпсіздіктің жағдайы туралы» Қазақстан Республикасы Үкіметінің 1998 жылғы 5 мамырдағы № 11 Хаттамалық Шешімін орындаудың барысы туралы
