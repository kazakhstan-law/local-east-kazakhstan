requisite: Решение акима Восточно-Казахстанской области от 17 сентября 1998 года № 582-к. Зарегистрировано управлением юстиции Восточно-Казахстанской области 25 сентября 1998 года за № 94. Утратило силу - решением акима Восточно-Казахстанской области № 691-к от 25 мая 1999 года
title:
  rus: Отчет акимов  Кокпектинского, Курчумского районов по выполнению решения Акима области от 31 марта 1998 года № 491-к «О подготовке объектов энергетики, образования, здравоохранения, жилищно-коммунального хозяйства к работе в осенне-зимний период 1998-1999 гг.»
  kaz: «Энергетика, білім беру, денсаулық сақтау, тұрмыстық- коммуналдық шаруашылық объектілерін 1998-1999 жылдардағы күзгі-қысқы жұмысқа әзірлеу туралы» облыс Әкімінің 1998 жылғы 31 наурыздағы № 491-к шешімін орындау жөніндегі Көкпекті, Күршім аудандары әкімдерінің есебі
