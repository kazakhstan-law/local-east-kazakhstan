act_code: '1161'
requisite: Решение акима Восточно-Казахстанской области от 6 августа 1998 года № 557-к. Зарегистрировано управлением юстиции Восточно-Казахстанской области 19 августа 1998 года за № 67. Утратило силу - решением акима Восточно-Казахстанской области № 691-к от 25 мая 1999 года
title:
  rus: О работе акимов гг. Усть-Каменогорска, Лениногорска по исполнению решения Акима области от 31 марта 1998 года № 491-к «О подготовке объектов энергетики, образования, здравоохранения и жилищно-коммунального хозяйства к работе в осенне-зимний период 1998-1999 гг.»
  kaz: Өскемен, Лениногор қалалары әкімдерінің «Энергетика, білім денсаулық сақтау, тұрғын үй-коммуналдық шаруашылық обьектілерін 1998-1999 жылдардағы күзгі-кысқы кездегі жұмысқа әзірлеу туралы» облыс Әкімінің 1998 жылғы 31 наурыздағы № 491-к шешімін орындау жөніндегі жұмысы туралы
