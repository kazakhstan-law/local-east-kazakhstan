title:
  rus: О работе акимов Бородулихинского и Катон-Карагайского районов по выполнению постановления Правительства Республики Казахстан от 25 февраля 1998 года №139 "О дополнительных мерах по осуществлению экономических реформ в сельском хозяйстве"
