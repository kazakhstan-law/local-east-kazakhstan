requisite: Решение акима Восточно-Казахстанской области от 2 сентября 1998 года № 575. Зарегистрировано управлением юстиции Восточно-Казахстанской области 4 сентября 1998 года за № 83. Утратило силу - решением акима Восточно-Казахстанской области от 24 сентября 2004 года № 100
title:
  rus: О работе Акимов Бескарагайского и Зайсанского районов по обеспечению выполнения решения Акима области от 20 февраля 1998 года №473 "О плане мероприятий по реализации протокола Республиканского совещания работников агропромышленного комплекса 23 декабря 1997 года и протокола совещания с акимами областей Республики Казахстан 10 февраля 1998 года"
