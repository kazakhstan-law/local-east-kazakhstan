  title:
    rus: О внесении изменений в решение Восточно-Казахстанского областного маслихата от 21 декабря 2009 года № 17/225-IV «О ставках платы за пользование водными ресурсами поверхностных источников Восточно-Казахстанской области»
    kaz: «Шығыс Қазақстан облысының жер үсті көздеріндегі су ресурстарын пайдаланғаны үшін төлемақы ставкалары туралы» Шығыс Қазақстан облыстық мәслихатының 2009 жылғы 21 желтоқсандағы № 17/225-IV шешіміне өзгерістер енгізу туралы
