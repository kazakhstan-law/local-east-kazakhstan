  title:
    rus: О внесении изменения в решение Восточно-Казахстанского областного маслихата от 5 ноября 2019 года № 34/381-VI «Об утверждении Правил о порядке и условиях размещения наружной (визуальной) рекламы на открытом пространстве за пределами помещений в населенных пунктах, в полосе отвода автомобильных дорог общего пользования, на открытом пространстве за пределами помещений вне населенных пунктов и вне полосы отвода автомобильных дорог общего пользования в Восточно-Казахстанской области»
    kaz: «Шығыс Қазақстан облысында сыртқы (көрнекі) жарнаманы елді мекендердегі үй-жайлардың шегінен тыс ашық кеңістікте, жалпыға ортақ пайдаланылатын автомобиль жолдарының бөлінген белдеуінде, елді мекендерден тыс жердегі үй-жайлардың шегінен тыс ашық кеңістікте және жалпыға ортақ пайдаланылатын автомобиль жолдарының бөлінген белдеуінен тыс жерде орналастыру тәртібі мен шарттары туралы қағидаларды бекіту туралы» Шығыс Қазақстан облыстық мәслихатының 2019 жылғы 5 қарашадағы № 34/381-VI шешіміне өзгеріс енгізу туралы
