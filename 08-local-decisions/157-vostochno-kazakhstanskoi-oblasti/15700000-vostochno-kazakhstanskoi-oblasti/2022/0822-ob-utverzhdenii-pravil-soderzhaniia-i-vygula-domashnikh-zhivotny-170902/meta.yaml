    rus: О внесении изменения в решение Восточно-Казахстанского областного маслихата от 22 августа 2022 года № 18/156-VII «Об утверждении Правил содержания и выгула домашних животных в Восточно-Казахстанской области, Правил отлова, временного содержания и умерщвления животных в Восточно-Казахстанской области»
    kaz: «Шығыс Қазақстан облысында үй жануарларын ұстаудың және серуендетудің қағидаларын, Шығыс Қазақстан облысында жануарларды аулаудың, уақытша ұстаудың және жансыздандырудың қағидаларын бекіту туралы» Шығыс Қазақстан облыстық мәслихатының 2022 жылғы 22 тамыздағы № 18/156-VІІ шешіміне өгеріс енгізу туралы
