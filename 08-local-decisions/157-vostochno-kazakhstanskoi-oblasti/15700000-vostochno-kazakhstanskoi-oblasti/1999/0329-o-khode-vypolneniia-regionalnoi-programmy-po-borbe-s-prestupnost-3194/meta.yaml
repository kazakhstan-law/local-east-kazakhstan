requisite: Решение ХХ сессии Восточно-Казахстанского областного Маслихата от 30 марта 1999 года N 20/2. Зарегистрировано Управлением юстиции Восточно-Казахстанской области 21 апреля 1999 года за N 164. Утратило силу в связи с истечением срока действия на основании письма начальника департамента юстиции ВКО от 27 декабря 2004 года
