  title:
    rus: О внесении изменения в решение Восточно-Казахстанского областного маслихата от 11 апреля 2014 года № 19/219-V «Об утверждении Правил содержания животных в населенных пунктах Восточно-Казахстанской области, Правил содержания сельскохозяйственных животных в населенных пунктах Восточно-Казахстанской области»
    kaz: Шығыс Қазақстан облыстық мәслихатының 2014 жылғы 11 сәуірдегі № 19/219-V «Шығыс Қазақстан облысының елді мекендерінде жануарларды асырау қағидаларын, Шығыс Қазақстан облысының елді мекендерінде ауыл шаруашылығы жануарларын асырау қағидаларын бекіту туралы» шешіміне өзгеріс енгізу туралы
