  title:
    rus: О признании утратившим силу решения Восточно-Казахстанского областного маслихата от 14 декабря 2021 года № 12/111-VII «О размере платы за один кубический метр поданной питьевой воды населению из особо важных групповых и локальных систем водоснабжения, являющихся безальтернативными источниками питьевого водоснабжения по Восточно-Казахстанской области»
    kaz: «Шығыс Қазақстан облысы бойынша ауызсумен жабдықтаудың баламасыз көздері болып табылатын сумен жабдықтаудың ерекше маңызды топтық және оқшау жүйелерінен халыққа берілген ауызсудың бір текше метрі үшін төлемақы мөлшері туралы» Шығыс Қазақстан облыстық мәслихатының 2021 жылғы 14 желтоқсандағы № 12/111-VII шешімінің күші жойылды деп тану туралы
