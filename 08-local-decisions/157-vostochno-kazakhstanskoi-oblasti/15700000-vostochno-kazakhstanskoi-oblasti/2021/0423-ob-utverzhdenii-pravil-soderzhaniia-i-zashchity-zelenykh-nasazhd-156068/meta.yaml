  kaz: Шығыс Қазақстан облысының жасыл екпелерді күтіп-ұстау  және қорғау қағидаларын, Шығыс Қазақстан облысының қалалары мен елді мекендерінің аумақтарын абаттандыру қағидаларын бекіту туралы
