  title:
    rus: О внесении изменения в решение Восточно-Казахстанского областного маслихата от 23 апреля 2021 года № 4/40-VII «Об утверждении Правил содержания и защиты зеленых насаждений Восточно-Казахстанской области, Правил благоустройства территорий городов и населенных пунктов Восточно-Казахстанской области»
    kaz: «Шығыс Қазақстан облысының жасыл екпелерді күтіп-ұстау және қорғау қағидаларын, Шығыс Қазақстан облысының қалалары мен елді мекендерінің аумақтарын абаттандыру қағидаларын бекіту туралы» Шығыс Қазақстан облыстық мәслихатының 2021 жылғы 23 сәуірдегі № 4/40-VII шешіміне өзгеріс енгізу туралы
