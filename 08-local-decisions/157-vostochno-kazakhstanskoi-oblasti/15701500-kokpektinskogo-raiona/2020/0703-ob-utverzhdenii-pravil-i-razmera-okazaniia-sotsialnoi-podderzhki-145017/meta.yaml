act_code: '145017'
requisite: Решение Кокпектинского районного маслихата Восточно-Казахстанской области от 3 июля 2020 года № 48-5/5. Зарегистрировано Департаментом юстиции Восточно-Казахстанской области 22 июля 2020 года № 7385
title:
  rus: Об утверждении Правил и размера оказания социальной поддержки по оплате коммунальных услуг и приобретению топлива за счет бюджетных средств специалистам государственных организаций здравоохранения, социального обеспечения, образования, культуры, спорта и ветеринарии, проживающим и работающим в сельских населенных пунктах Кокпектинского района
  kaz: Көкпекті ауданының ауылдық елді мекендерінде тұратын және жұмыс істейтін мемлекеттік денсаулық сақтау, әлеуметтік қамсыздандыру, білім беру, мәдениет, спорт және ветеринария ұйымдарының мамандарына бюджет қаражаты есебінен коммуналдық көрсетілетін қызметтерге ақы төлеу және отын сатып алу бойынша әлеуметтік қолдау көрсету Қағидалары мен мөлшерін бекіту туралы
