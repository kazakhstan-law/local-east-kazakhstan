  title:
    rus: О внесении изменения в решение Кокпектинского районного маслихата от 3 июля 2020 года № 48-5/5 «Об оказании социальной поддержки по оплате коммунальных услуг и приобретению топлива за счет бюджетных средств специалистам государственных организаций здравоохранения, социального обеспечения, образования, культуры, спорта и ветеринарии, проживающим и работающим в сельских населенных пунктах Кокпектинского района»
    kaz: Көкпекті аудандық мәслихатының 2020 жылғы 3 шілдедегі № 48-5/5 «Көкпекті ауданының ауылдық елді мекендерінде тұратын және жұмыс істейтін мемлекеттік денсаулық сақтау, әлеуметтік қамсыздандыру, білім беру, мәдениет, спорт және ветеринария ұйымдарының мамандарына бюджет қаражаты есебiнен көрсетілетін коммуналдық қызметтерге ақы төлеу және отын сатып алу бойынша әлеуметтік қолдау көрсету туралы» шешіміне өзгеріс енгізу туралы
