requisite: Решение Кокпектинского районного маслихата Восточно-Казахстанской области от 3 июля 2020 года № 48-5/2. Зарегистрировано Департаментом юстиции Восточно-Казахстанской области 17 июля 2020 года № 7376. Утратило силу решением Кокпектинского районного маслихата области Абай от 10 апреля 2024 года № 12-5/2 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: О специализированных местах для организации и проведения мирных собраний, порядке их использования, нормах их предельной заполняемости, требованиях к их материально-техническому и организационному обеспечению, границах прилегающих территорий, в которых запрещено проведение пикетирования
