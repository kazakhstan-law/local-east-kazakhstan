requisite: Решение Кокпектинского районного маслихата Восточно-Казахстанской области от 31 марта 2020 года № 45-6/3. Зарегистрировано Департаментом юстиции Восточно-Казахстанской области 14 апреля 2020 года № 6889. Утратило силу решением Кокпектинского районного маслихата Восточно-Казахстанской области от 3 июля 2020 года № 48-5/5 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: О приостановлении действия решения Кокпектинского районного маслихата от 3 октября 2018 года № 26-5/3 «Об оказании социальной поддержки специалистам государственных организаций, проживающим и работающим в сельских населенных пунктах Кокпектинского района»
  kaz: Көкпекті аудандық мәслихатының 2018 жылғы 3 қазандағы № 26-5/3 «Көкпекті ауданының ауылдық елді мекендерінде тұратын және жұмыс істейтін мемлекеттік ұйымдардың мамандарына әлеуметтік қолдау көрсету туралы» шешімінің қолданылуын тоқтата тұру туралы
