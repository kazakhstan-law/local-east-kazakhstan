requisite: Шығыс Қазақстан облысы Көкпекті аудандық мәслихатының 10 сессиясының 2008 жылғы 23 желтоқсандағы № 10-3 шешімі. Шығыс Қазақстан облысы Әділет департаментінің Көкпекті аудандық әділет басқармасында 2009 жылғы 9 қаңтарда № 5-15-45 тіркелді. Қабылданған мерзімінің бітуіне байланысты күші жойылды - Көкпекті аудандық мәслихатының 2010 жылғы 2 наурыздағы № 45 хаты
