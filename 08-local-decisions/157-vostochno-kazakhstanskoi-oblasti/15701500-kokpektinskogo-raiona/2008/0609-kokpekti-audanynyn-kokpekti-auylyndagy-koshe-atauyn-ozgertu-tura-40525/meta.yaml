act_code: '40525'
requisite: Шығыс Қазақстан облысы Көкпекті ауданы Көкпекті селолық округі әкімінінің аппаратының 2008 жылғы 9 маусымдағы № 1 шешімі. Шығыс Қазақстан облысы Әділет департаментінің Көкпекті аудандық Әділет басқармасында 2008 жылғы 25 маусымда № 5-15-39 тіркелді
