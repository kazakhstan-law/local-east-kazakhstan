act_code: '43817'
requisite: Шығыс Қазақстан облысы Көкпекті ауданы әкімінің 2008 жылғы 30 желтоқсандағы № 766 шешімі. Шығыс Қазақстан облысы Көкпекті ауданының Әділет басқармасында 2009 жылғы 28 қаңтарда № 5-15-46 тіркелді. Күші жойылды - Көкпекті ауданы әкімінің 2009 жылғы 9 маусымдағы № 4 шешімімен
