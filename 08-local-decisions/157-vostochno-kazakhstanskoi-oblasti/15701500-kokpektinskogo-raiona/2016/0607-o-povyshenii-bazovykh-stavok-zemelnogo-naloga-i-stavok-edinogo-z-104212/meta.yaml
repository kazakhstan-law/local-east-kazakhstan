requisite: Решение Кокпектинского районного маслихата Восточно-Казахстанской области от 7 июня 2016 года № 3-3/5. Зарегистрировано Департаментом юстиции Восточно-Казахстанской области 9 июля 2016 года № 4590. Утратило силу решением Кокпектинского районного маслихата Восточно-Казахстанской области от 20 июня 2018 года № 23-6/5
title:
  rus: О повышении базовых ставок земельного налога и ставок единого земельного налога на не используемые в соответствии с земельным законодательством Республики Казахстан земли сельскохозяйственного  назначения Кокпектинского района
  kaz: Қазақстан Республикасының жер заңнамасына сәйкес пайдаланылмайтын Көкпекті ауданының ауыл шаруашылығы мақсатындағы жерлерге жер салығының базалық мөлшерлемелерін және бірыңғай жер салығының мөлшерлемелерін жоғарылату туралы
