act_code: '49942'
requisite: Шығыс Қазақстан облысы Көкпекті аудандық мәслихатының 2009 жылғы 29 желтоқсандағы № 19-2 шешімі. Шығыс Қазақстан облысы Әділет департаментінің Көкпекті аудандық әділет басқармасында 2010 жылғы 10 қаңтарда № 5-15-64 тіркелді. Қолданылу мерзімінің өтуіне байланысты күші жойылды (Көкпекті аудандық мәслихатының 2010 жылғы 29 желтоқсандағы № 243 хаты)
