act_code: '55795'
requisite: Шығыс Қазақстан облысы Көкпекті аудандық мәслихатының 2010 жылғы 2 қарашадағы № 25-4/3 шешімі. Шығыс Қазақстан облысы Әділет департаментінің Көкпекті аудандық әділет басқармасында 2010 жылғы 8 желтоқсанда № 5-15-76 тіркелді. Күші жойылды - Көкпекті аудандық мәслихатының 2012 жылғы 6 маусымдағы № 4-2 шешімімен
