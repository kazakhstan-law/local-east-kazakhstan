requisite: Шығыс Қазақстан облысы Көкпекті аудандық мәслихатының 2010 жылғы 27 шілдедегі № 24-5/2 шешімі. Шығыс Қазақстан облысы Әділет департаментінің Көкпекті аудандық әділет басқармасында 2010 жылғы 26 тамызда № 5-15-72 тіркелді. Күші жойылды - Көкпекті аудандық мәслихатының 2012 жылғы 10 сәуірдегі № 3-5/5) шешімімен
