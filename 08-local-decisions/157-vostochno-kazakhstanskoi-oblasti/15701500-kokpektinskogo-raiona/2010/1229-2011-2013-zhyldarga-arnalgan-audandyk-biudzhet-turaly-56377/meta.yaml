act_code: '56377'
requisite: Шығыс Қазақстан облысы Көкпекті аудандық мәслихатының 2010 жылғы 29 желтоқсандағы № 27-2 шешімі. Шығыс Қазақстан облысы Әділет департаментінің Көкпекті аудандық әділет басқармасында 2010 жылғы 31 желтоқсанда № 5-15-79 тіркелді. Шешімнің қабылдау мерзімінің өтуіне байланысты қолдану тоқтатылды (Көкпекті аудандық мәслихатының 2011 жылғы 29 желтоқсандағы № 238 хаты)
