  title:
    rus: О внесении изменений в решение Кокпектинского районного маслихата от 15 апреля 2022 года № 16-5/2 «Об определении порядка и размера возмещения затрат на обучение на дому детей с ограниченными возможностями из числа инвалидов по индивидуальному учебному плану в Кокпектинском районе»
    kaz: Көкпекті аудандық мәслихатының 2022 жылғы 15 сәуірдегі № 16-5/2 «Көкпекті ауданында мүгедектер қатарындағы кемтар балаларды жеке оқыту жоспары бойынша үйде оқытуға жұмсалған шығындарын өндіріп алу тәртібі мен мөлшерін айқындау туралы» шешіміне өзгерістер енгізу туралы
