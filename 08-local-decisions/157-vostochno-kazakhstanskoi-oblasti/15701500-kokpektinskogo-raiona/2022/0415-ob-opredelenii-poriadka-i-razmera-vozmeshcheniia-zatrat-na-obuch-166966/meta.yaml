requisite: Решение Кокпектинского районного маслихата Восточно-Казахстанской области от 15 апреля 2022 года № 16-5/2. Зарегистрировано в Министерстве юстиции Республики Казахстан 20 апреля 2022 года № 27667. Утратило силу решением Кокпектинского районного маслихата области Абай от 27 декабря 2024 года № 23-13/2 (вводится в действие по истечении десяти календарных дней после дня его  первого официального опубликования)
title:
  rus: Об определении порядка и размера возмещения затрат на обучение на дому детей с ограниченными возможностями из числа детей с инвалидностью по индивидуальному учебному плану в Кокпектинском районе
  kaz: Көкпекті ауданында мүгедектігі бар балалар қатарындағы кемтар балаларды жеке оқыту жоспары бойынша үйде оқытуға жұмсаған шығындарын өндіріп алу тәртібі мен мөлшерін айқындау туралы
