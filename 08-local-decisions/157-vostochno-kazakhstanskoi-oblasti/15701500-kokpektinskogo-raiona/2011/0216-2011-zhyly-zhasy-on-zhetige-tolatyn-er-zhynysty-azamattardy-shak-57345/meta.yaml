requisite: Шығыс Қазақстан облысы Көкпекті ауданы әкімінің 2011 жылғы 16 ақпандағы № 22 шешімі. Шығыс Қазақстан облысы Әділет департаментінің Көкпекті аудандық Әділет басқармасында 2011 жылғы 22 ақпанда № 5-15-80 тіркелді. Күші жойылды - Көкпекті ауданы әкімінің 2012 жылғы 11 сәуірдегі № 6 шешімімен
