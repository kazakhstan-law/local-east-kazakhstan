act_code: '125483'
requisite: Решение Кокпектинского районного маслихата Восточно-Казахстанской области от 3 октября 2018 года № 26-5/3. Зарегистрировано Управлением юстиции Кокпектинского района Департамента юстиции Восточно-Казахстанской области 26 октября 2018 года № 5-15-126. Утратило силу решением Кокпектинского районного маслихата Восточно-Казахстанской области от 3 июля 2020 года № 48-5/5 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования); Действие решения приостановлено до 1 августа 2020 года решением Кокпектинского районного маслихата Восточно-Казахстанской области от 31 марта 2020 года № 45-6/3 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
