requisite: Решение Бородулихинского районного маслихата Восточно-Казахстанской области от 9 февраля 2009 года № 16-14-IV. Зарегистрировано Управлением юстиции Бородулихинского района Департамента юстиции Восточно-Казахстанской области 17 февраля 2009 года за № 5-8-78. Утратило силу решением Бородулихинского районного маслихата Восточно-Казахстанской области от 23 ноября 2012 года № 9-3-V
title:
  rus: Об установлении повышения на двадцать пять процентов должностных окладов и тарифных ставок специалистам социального обеспечения, образования и культуры работающим в аульной (сельской) местности
  kaz: Ауылдық (селолық) жерлерде жұмыс істейтін әлеуметтік қамсыздандыру, білім беру, мәдениет саласы мамандарының лауазымдық еңбекақыларының мөлшері мен тарифтік ставкаларын жиырма бес пайызға көтеруді белгілеу туралы
