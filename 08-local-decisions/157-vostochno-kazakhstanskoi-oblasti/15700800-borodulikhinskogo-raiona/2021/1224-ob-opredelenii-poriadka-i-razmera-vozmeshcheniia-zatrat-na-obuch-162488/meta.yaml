requisite: Решение маслихата Бородулихинского района Восточно-Казахстанской области от 24 декабря 2021 года № 12-7-VII. Зарегистрировано в Министерстве юстиции Республики Казахстан 27 декабря 2021 года № 26100
title:
  rus: Об определении порядка и размера возмещения затрат на обучение на дому детей с ограниченными возможностями из числа детей с инвалидностью по индивидуальному учебному плану в Бородулихинском районе
  kaz: Бородулиха ауданында мүгедектігі бар балалар қатарындағы кемтар балаларды жеке оқыту жоспары бойынша үйде оқытуға жұмсаған шығындарын өндіріп алу тәртібі мен мөлшерін айқындау туралы
