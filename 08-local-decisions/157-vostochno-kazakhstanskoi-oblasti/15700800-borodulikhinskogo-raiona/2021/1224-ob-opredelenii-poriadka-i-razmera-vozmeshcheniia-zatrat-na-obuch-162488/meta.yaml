  title:
    rus: О внесении изменений в решение Бородулихинского районного маслихата от 24 декабря 2021 года № 12-7-VII «Об определении порядка и размера возмещения затрат на обучение на дому детей с ограниченными возможностями из числа инвалидов по индивидуальному учебному плану в Бородулихинском районе»
    kaz: Бородулиха аудандық мәслихатының 2021 жылғы 24 желтоқсандағы № 12-7-VII «Бородулиха ауданында мүгедектер қатарындағы кемтар балаларды жеке оқыту жоспары бойынша үйде оқытуға жұмсаған шығындарын өндіріп алу тәртібі мен мөлшерін айқындау туралы» шешіміне өзгерістер енгізу туралы
