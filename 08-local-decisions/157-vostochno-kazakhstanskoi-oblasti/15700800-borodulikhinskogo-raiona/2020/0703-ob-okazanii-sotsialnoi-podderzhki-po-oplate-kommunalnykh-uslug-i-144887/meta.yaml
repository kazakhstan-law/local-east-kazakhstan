act_code: '144887'
requisite: Решение маслихата Бородулихинского района Восточно-Казахстанской области от 3 июля 2020 года № 51-8-VI. Зарегистрировано Департаментом юстиции Восточно-Казахстанской области 14 июля 2020 года № 7358. Утратило силу решением Бородулихинского районного маслихата области Абай от 6 октября 2023 года № 8-10-VIII (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об оказании социальной поддержки по оплате коммунальных услуг и приобретению топлива за счет бюджетных средств специалистам государственных организаций здравоохранения, социального обеспечения, образования, культуры, спорта и ветеринарии, проживающим и работающим в сельских населенных пунктах Бородулихинского района
  kaz: Бородулиха ауданының ауылдық елді мекендерінде тұратын және жұмыс істейтін мемлекеттік денсаулық сақтау, әлеуметтік қамсыздандыру, білім беру, мәдениет, спорт және ветеринария ұйымдарының мамандарына бюджет қаражаты есебiнен коммуналдық көрсетілетін қызметтерге ақы төлеу және отын сатып алу бойынша әлеуметтік қолдау көрсету туралы
