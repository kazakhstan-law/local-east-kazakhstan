requisite: Решение акима Бородулихинского района Восточно-Казахстанской области от 6 декабря 2010 года № 52. Зарегистрировано Управлением юстиции Бородулихинского района Департамента юстиции Восточно-Казахстанской области 6 января 2011 года за № 5-8-123. Утратило силу решением акима Бородулихинского района Восточно-Казахстанской области от 18 апреля 2011 года № 57
title:
