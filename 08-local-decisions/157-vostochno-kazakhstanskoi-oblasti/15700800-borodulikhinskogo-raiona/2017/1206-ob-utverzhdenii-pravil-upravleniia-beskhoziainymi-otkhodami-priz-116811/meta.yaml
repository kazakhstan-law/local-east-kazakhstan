requisite: Решение маслихата Бородулихинского района Восточно-Казахстанской области от 6 декабря 2017 года № 16-3-VI. Зарегистрировано Департаментом юстиции Восточно-Казахстанской области 21 декабря 2017 года № 5346. Утратило силу решением Бородулихинского районного маслихата области Абай от 20 сентября 2022 года № 21-7-VII (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Правил управления бесхозяйными отходами, признанными решением суда поступившими в коммунальную собственность Бородулихинского района
