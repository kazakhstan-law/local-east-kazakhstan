requisite: Решение маслихата Бородулихинского района Восточно-Казахстанской области от 17 марта 2017 года № 9-8-VI. Зарегистрировано Департаментом юстиции Восточно-Казахстанской области 27 апреля 2017 года № 4983. Утратило силу - решением Бородулихинского районного маслихата Восточно-Казахстанской области от 30 марта 2018 года № 20-12-VI
title:
  rus: Об утверждении методики оценки деятельности административных государственных служащих корпуса «Б» государственного учреждения «Аппарат маслихата Бородулихинского района Восточно-Казахстанской области»
  kaz: «Шығыс Қазақстан облысы Бородулиха ауданының мәслихат аппараты» мемлекеттік мекемесінің «Б» корпусы мемлекеттік әкімшілік қызметшілерінің қызметін бағалаудың әдістемесін бекіту туралы
