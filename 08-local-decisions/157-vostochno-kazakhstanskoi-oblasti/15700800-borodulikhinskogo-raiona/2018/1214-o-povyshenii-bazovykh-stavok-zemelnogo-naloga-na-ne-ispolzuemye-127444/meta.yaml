requisite: Решение маслихата Бородулихинского района Восточно-Казахстанской области от 14 декабря 2018 года № 30-3-VI. Зарегистрировано Управлением юстиции Бородулихинского района Департамента юстиции Восточно-Казахстанской области 24 декабря 2018 года № 5-8-189. Утратило силу решением Бородулихинского районного маслихата области Абай от 21 октября 2022 года № 22-8-VII (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: О повышении базовых ставок земельного налога на не используемые в соответствии с земельным законодательством Республики Казахстан земли сельскохозяйственного назначения Бородулихинского района
  kaz: Қазақстан Республикасының жер заңнамасына сәйкес пайдаланылмайтын Бородулиха ауданының ауыл шаруашылығы мақсатындағы жерге жер салығының базалық мөлшерлемелерін арттыру туралы
