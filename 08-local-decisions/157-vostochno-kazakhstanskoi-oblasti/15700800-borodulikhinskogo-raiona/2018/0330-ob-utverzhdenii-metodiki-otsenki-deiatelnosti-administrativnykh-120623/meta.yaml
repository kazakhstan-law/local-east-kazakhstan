requisite: Решение маслихата Бородулихинского района Восточно-Казахстанской области от 30 марта 2018 года № 20-12-VI. Зарегистрировано Департаментом юстиции Восточно-Казахстанской области 13 апреля 2018 года № 5611. Утратило силу решением маслихата Бородулихинского района Восточно-Казахстанской области от 29 марта 2022 года № 16-9-VII (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении методики оценки деятельности административных государственных служащих корпуса «Б» государственного учреждения «Аппарат маслихата Бородулихинского района Восточно-Казахстанской области»
  kaz: «Шығыс Қазақстан облысы Бородулиха ауданының мәслихат аппараты» мемлекеттік мекемесінің «Б» корпусы мемлекеттік әкімшілік қызметшілерінің қызметін бағалаудың әдістемесін бекіту туралы
