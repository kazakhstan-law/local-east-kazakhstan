act_code: '43103'
requisite: Решение Бородулихинского районного маслихата Восточно-Казахстанской области от 23 декабря 2008 года № 14-10-IV. Зарегистрировано в Управлении юстиции Бородулихинского района Департамента юстиции Восточно-Казахстанской области 30 декабря 2008 года за № 5-8-71. Утратило силу решением Бородулихинского районного маслихата Восточно-Казахстанской области от 23 ноября 2012 года № 9-3-V
title:
  rus: Об утверждении "Инструкции выплаты социальной помощи на приобретение топлива специалистам государственных организаций здравоохранения, социального обеспечения, образования, культуры и спорта, проживающим и работающим в сельских населенных пунктах"
  kaz: '"Селолық елді мекендерде тұратын және жұмыс істейтін денсаулық сақтау, әлеуметтік қамсыздандыру, білім беру, мәдениет және спорт мемлекеттік ұйымдарының мамандарына отын сатып алуға арналған әлеуметтік көмек төлеудің нұсқаулығын" бекіту туралы'
