act_code: '40064'
requisite: Решение Бородулихинского районного маслихата Восточно-Казахстанской области от 6 мая 2008 года № 8-2-IV. Зарегистрировано Управлением юстиции Бородулихинского района Департамента юстиции Восточно-Казахстанской области 6 июня 2008 года за № 5-8-62. Утратило силу решением Бородулихинского районного маслихата Восточно-Казахстанской области от 21 апреля 2009 года № 17-10-IV
title:
  rus: О ставках платы за размещение наружной (визуальной) рекламы, размещаемой на движимых и недвижимых объектах, а также расположенной в полосе отвода автомобильных дорог общего пользования местного значения и на открытом пространстве за пределами помещений в населенных пунктах района
  kaz: Ауданның елді мекендеріндегі ортақ пайдаланылатын автомобиль жолдарының  бөлінген белдеуіндегі және үй - жайлардың шегінен тыс ашық кеңістіктердегі, сол сияқты жылжымалы және жылжымайтын объектілердегі сыртқы (көрнекі) жарнамаларды орналастыру үшін төлемақы ставкалары туралы
