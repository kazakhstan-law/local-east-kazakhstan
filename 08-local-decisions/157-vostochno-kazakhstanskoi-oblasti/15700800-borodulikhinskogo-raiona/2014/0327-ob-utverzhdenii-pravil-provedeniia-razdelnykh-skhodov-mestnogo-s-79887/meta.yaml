    kaz: Бородулиха аудандық мәслихатының 2014 жылғы 27 наурыздағы № 21-9-V "Бородулиха ауданының аумағында бөлек жергілікті қоғамдастық жиындарын өткізу Қағидасын бекіту және жергілікті қоғамдастық жиынына қатысу үшін ауыл, көше, көппәтерлі тұрғын үй тұрғындары өкілдерінің санын айқындау туралы" шешіміне өзгерістер енгізу туралы
