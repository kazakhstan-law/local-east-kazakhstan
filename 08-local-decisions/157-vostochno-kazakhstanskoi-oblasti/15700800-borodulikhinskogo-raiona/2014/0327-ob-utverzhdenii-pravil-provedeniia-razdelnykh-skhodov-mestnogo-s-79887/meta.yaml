act_code: '79887'
requisite: Решение Бородулихинского районного маслихата Восточно-Казахстанской области от 27 марта 2014 года № 21-9-V. Зарегистрировано Департаментом юстиции Восточно-Казахстанской области 11 мая 2014 года № 3303. Утратило силу решением Бородулихинского районного маслихата области Абай от 28 августа 2023 года № 7-6-VIII (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Правил проведения раздельных сходов местного сообщества и определения количества представителей жителей сел, улиц, многоквартирных жилых домов для участия в сходах местного сообщества на территории Бородулихинского района
  kaz: Бородулиха ауданының аумағында бөлек жергілікті қоғамдастық жиындарын өткізу Қағидасын бекіту және жергілікті қоғамдастық жиынына қатысу үшін ауыл, көше, көппәтерлі тұрғын үй тұрғындары өкілдерінің санын айқындау туралы
