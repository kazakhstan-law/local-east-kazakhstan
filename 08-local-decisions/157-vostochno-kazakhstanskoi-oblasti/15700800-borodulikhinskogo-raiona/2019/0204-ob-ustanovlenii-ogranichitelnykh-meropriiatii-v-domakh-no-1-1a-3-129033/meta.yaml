requisite: Решение акима Жезкентского поселкового округа Бородулихинского района Восточно-Казахстанской области от 4 февраля 2019 года № 2. Зарегистрировано Управлением юстиции Бородулихинского района Департамента юстиции Восточно-Казахстанской области 7 февраля 2019 года № 5-8-200. Утратило силу решением акима Жезкентского поселкового округа Бородулихинского района Восточно-Казахстанской области от 10 апреля 2019 года № 3
