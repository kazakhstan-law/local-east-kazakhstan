requisite: Решение акима Бородулихинского района Восточно-Казахстанской области от 21 декабря 2011 года № 13. Зарегистрировано Управлением юстиции Бородулихинского района Департамента юстиции Восточно-Казахстанской области 13 января 2012 года за № 5-8-144. Прекращено действие по истечении срока, на который постановление было принято, на основании письма аппарата акима Бородулихинского района Восточно-Казахстанской области от 4 мая 2012 года № 1153
title:
  rus: О проведении приписки граждан мужского пола, которым в год приписки исполняется семнадцать лет к призывному участку отдела по делам обороны Бородулихинского района в 2012 году
