requisite: Решение акима Кабанбайского сельского округа Урджарского района Восточно-Казахстанской области от 31 января 2017 года № 4. Зарегистрировано Департаментом юстиции Восточно-Казахстанской области 27 февраля 2017 года № 4889. Утратило силу - решением акима Кабанбайского сельского округа Урджарского района Восточно-Казахстанской области от 11 сентября 2017 года № 42
