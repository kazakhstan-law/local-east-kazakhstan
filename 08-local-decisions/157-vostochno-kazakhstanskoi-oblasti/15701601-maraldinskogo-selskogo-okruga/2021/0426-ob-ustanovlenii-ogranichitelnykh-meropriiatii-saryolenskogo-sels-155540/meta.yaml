act_code: '155540'
requisite: Решение акима Сарыоленского сельского округа Курчумского района Восточно-Казахстанской области от 26 апреля 2021 года № 1. Зарегистрировано Департаментом юстиции Восточно-Казахстанской области 27 апреля 2021 года № 8682. Утратило силу решением акима Сарыоленского сельского округа Курчумского района Восточно-Казахстанской области от 30 декабря 2021 года № 5 (вводится в действие со дня его первого официального опубликования)
title:
  rus: Об установлении ограничительных мероприятий Сарыоленского сельского округа Курчумского района по отношению санитарного табуна организованного из крупно-рогатого скота положительно реагирирующих на бруцеллез от личных подсобных хозяйств сел Сарыолен, Барак батыр, Бирлик
  kaz: Күршім ауданы Сарыөлең ауылдық округіне Қарасты Сарыөлең, Барақ батыр, Бірлік ауылдарының жеке қосалқы шаруашылықтарынан сарып ауруына оң нәтиже берген аулаларының мүйізді ірі қара малдарынан ұйымдастырылған санитарлық табынға шектеу іс-шарасын белгілеу туралы
