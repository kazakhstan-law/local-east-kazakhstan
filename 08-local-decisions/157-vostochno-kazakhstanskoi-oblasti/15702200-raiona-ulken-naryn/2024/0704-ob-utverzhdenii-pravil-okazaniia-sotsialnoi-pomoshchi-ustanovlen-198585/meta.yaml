    rus: О внесении изменений и дополнения в решение маслихата  района  Үлкен Нарын от 4 июля 2024 года № 4/23-VIII «Об утверждении Правил оказания социальной помощи, установления размеров и определения перечня отдельных категорий нуждающихся граждан»
    kaz: Үлкен Нарын ауданы  мәслихатының 2024 жылғы 4 шілдедегі № 4/23-VIII «Әлеуметтік көмек көрсетудің, мөлшерлерін белгілеудің және мұқтаж азаматтардың жекелеген санаттарының тізбесін айқындаудың қағидаларын бекіту туралы» шешіміне өзгерістер мен толықтыру енгізу туралы
