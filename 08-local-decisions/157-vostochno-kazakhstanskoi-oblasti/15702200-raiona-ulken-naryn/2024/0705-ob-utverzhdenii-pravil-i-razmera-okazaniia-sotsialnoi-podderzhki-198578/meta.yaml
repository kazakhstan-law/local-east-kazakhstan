act_code: '198578'
requisite: Решение  маслихата района Үлкен Нарын Восточно-Казахстанской области от 5 июля 2024 года № 4/24-VIII. Зарегистрировано Департаментом юстиции Восточно-Казахстанской области 10 июля 2024 года № 9051-16
title:
  rus: «Об утверждении Правил и размера оказания социальной поддержки по оплате коммунальных услуг и приобретению топлива за счет бюджетных средств специалистам государственных организаций здравоохранения, социального обеспечения, образования, культуры, спорта и ветеринарии, проживающим и работающим в сельских населенных пунктах в районе Үлкен Нарын»
  kaz: «Үлкен Нарын ауданының ауылдық елді мекендерінде тұратын және жұмыс істейтін мемлекеттік денсаулық сақтау, әлеуметтік қамсыздандыру, білім беру, мәдениет, спорт және ветеринария ұйымдарының мамандарына бюджет қаражаты есебінен коммуналдық көрсетілетін қызметтерге ақы төлеу және отын  сатып алу бойынша әлеуметтік қолдау көрсету Қағидасын және мөлшерін бекіту туралы»
