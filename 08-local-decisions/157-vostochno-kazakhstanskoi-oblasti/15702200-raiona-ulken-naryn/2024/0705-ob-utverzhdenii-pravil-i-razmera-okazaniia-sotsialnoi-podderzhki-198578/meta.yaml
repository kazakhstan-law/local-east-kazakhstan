  title:
    rus: О внесении  изменения  в  решение маслихата района Үлкен Нарын от 5 июля  2024 года №4/24-VIII «Об утверждении Правил и размера оказания социальной поддержки по оплате коммунальных услуг и приобретению топлива за счет бюджетных средств специалистам государственных организаций здравоохранения, социального обеспечения, образования, культуры, спорта и ветеринарии, проживающим и работающим в сельских населенных пунктах района Үлкен Нарын»
    kaz: Үлкен Нарын ауданы мәслихатының 2024 жылғы 5 шілдедегі № 4/24-VIII «Үлкен Нарын ауданының ауылдық елді мекендерінде тұратын және жұмыс істейтін мемлекеттік денсаулық сақтау, әлеуметтік қамсыздандыру, білім беру, мәдениет, спорт және ветеринария ұйымдарының мамандарына бюджет қаражаты есебінен коммуналдық көрсетілетін қызметтерге ақы төлеу және отын  сатып алу бойынша әлеуметтік қолдау көрсету Қағидасын және мөлшерін бекіту туралы» шешіміне өзгеріс енгізу туралы
