act_code: '222031'
requisite: Решение маслихата района Үлкен Нарын Восточно-Казахстанской области от 10 февраля 2026 года № 21/212-VIII
title:
  rus: О предоставлении мер социальной поддержки специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, государственным служащим аппаратов акимов сел, поселков, сельских округов, прибывшим для работы и проживания в сельские населенные пункты района Үлкен Нарын на 2026 год
  kaz: Үлкен Нарын ауданының ауылдық елдi мекендерге жұмыс iстеуге және тұруға келген денсаулық сақтау, бiлiм беру, әлеуметтiк қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға, ауылдар, кенттер, ауылдық округтер әкімдері аппараттарының мемлекеттік қызметшілеріне 2026 жылы әлеуметтiк қолдау шараларын ұсыну туралы
