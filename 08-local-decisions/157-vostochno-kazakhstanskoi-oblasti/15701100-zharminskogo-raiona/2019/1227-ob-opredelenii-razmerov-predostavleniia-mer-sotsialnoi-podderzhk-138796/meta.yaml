  requisite: Решение Жарминского районного маслихата Восточно-Казахстанской области от 25 сентября 2020 года № 50/480-VI. Зарегистрировано Департаментом юстиции Восточно-Казахстанской области 13 октября 2020 года № 7642. Утратило силу решением Жарминского районного маслихата Восточно-Казахстанской области от 25 декабря 2020 года № 53/529-VI (вводится в действие по истечении десяти календарных дней после его первого официального опубликования)
  title:
    rus: О внесении изменений в решение Жарминского районного маслихата от 27 декабря 2019 года № 41/336-VI «Об определении размеров предоставления мер социальной поддержки специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания в сельские населенные пункты Жарминского района на 2020 год»
    kaz: Жарма аудандық мәслихатының 2019 жылғы 27 желтоқсандағы № 41/336-VI «2020 жылы Жарма ауданының ауылдық елді мекендеріне жұмыс істеу және тұру үшін келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға әлеуметтік қолдау шараларын ұсыну мөлшерін айқындау туралы» шешіміне өзгерістер енгізу туралы
