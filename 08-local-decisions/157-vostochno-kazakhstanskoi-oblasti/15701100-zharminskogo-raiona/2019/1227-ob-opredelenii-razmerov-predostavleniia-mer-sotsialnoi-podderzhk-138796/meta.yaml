act_code: '138796'
requisite: Решение Жарминского районного маслихата Восточно-Казахстанской области от 27 декабря 2019 года № 41/336-VI. Зарегистрировано Департаментом юстиции Восточно-Казахстанской области 17 января 2020 года № 6579. Утратило силу решением Жарминского районного маслихата Восточно-Казахстанской области от 25 декабря 2020 года № 53/529-VI (вводится в действие по истечении десяти календарных дней после его первого официального опубликования)
title:
  rus: Об определении размеров предоставления мер социальной поддержки специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, государственным служащим аппаратов акимов сел, поселков, сельских округов, прибывшим для работы и проживания в сельские населенные пункты Жарминского района на 2020 год
  kaz: 2020 жылға Жарма ауданының ауылдық елді мекендерге жұмыс істеу және тұру үшін келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға, ауылдар, кенттер, ауылдық округтер әкімдері аппараттарының мемлекеттік қызметшілеріне әлеуметтік қолдау шараларын ұсыну мөлшерін айқындау туралы
