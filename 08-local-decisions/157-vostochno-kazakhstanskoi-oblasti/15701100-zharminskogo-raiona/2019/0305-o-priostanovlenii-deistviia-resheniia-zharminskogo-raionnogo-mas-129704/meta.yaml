requisite: Решение Жарминского районного маслихата Восточно-Казахстанской области от 5 марта 2019 года № 30/256-VI. Зарегистрировано Департаментом юстиции Восточно-Казахстанской области 15 марта 2019 года № 5777. Утратило силу решением Жарминского районного маслихата Восточно-Казахстанской области от 18 ноября 2019 года № 40/326-VI (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: О приостановлении действия решения Жарминского районного маслихата от 22 декабря 2016 года № 9/73-VI «Об утверждении норм образования и накопления коммунальных отходов, тарифов на захоронение твердых бытовых отходов по Жарминскому району»
  kaz: Жарма аудандық мәслихатының 2016 жылғы 22 желтоқсандағы № 9/73-VI «Жарма ауданыны бойынша коммуналдық қалдықтардың түзілу және жинақталу нормаларын және тұрмыстық қатты қалдықтарын көму тарифтерін бекіту туралы» шешімінің қолданылуын тоқтата тұру туралы
