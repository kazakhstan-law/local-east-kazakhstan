requisite: Решение Жарминского районного маслихата Восточно-Казахстанской области от 29 мая 2020 года № 46/409-VI. Зарегистрировано Департаментом юстиции Восточно-Казахстанской области 12 июня 2020 года № 7186. Утратило силу решением Жарминского районного маслихата Восточно-Казахстанской области от 11 ноября 2021 года № 9/114-VII (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об оказании социальной поддержки по оплате коммунальных услуг и приобретению топлива специалистам государственных организаций, проживающим и работающим в сельских населенных пунктах Жарминского района
  kaz: Жарма ауданының ауылдық елді мекендерінде тұратын және жұмыс істейтін мемлекеттік мамандарына көрсетілетін коммуналдық қызметтерге ақы төлеу және отын сатып алу бойынша әлеуметтік қолдау көрсету туралы
