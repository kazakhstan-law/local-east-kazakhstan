act_code: '151216'
requisite: Решение Жарминского районного маслихата Восточно-Казахстанской области от 25 декабря 2020 года № 53/529-VI. Зарегистрировано Департаментом юстиции Восточно-Казахстанской области 29 декабря 2020 года № 8101
title:
  rus: Об определении размеров предоставления мер социальной поддержки специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, государственным служащим аппаратов акимов сел, поселков, сельских округов, прибывшим для работы и проживания в сельские населенные пункты Жарминского района на 2021 год
  kaz: 2021 жылы Жарма ауданының ауылдық елді мекендеріне жұмыс істеу және тұру үшін келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға, ауылдар, кенттер, ауылдық округтер әкімдері аппараттарының мемлекеттік қызметшілеріне әлеуметтік қолдау шараларын ұсыну мөлшерін айқындау туралы
