requisite: Шығыс Қазақстан облысы Жарма ауданы әкімінің 2009 жылғы 11 желтоқсандағы № 13 шешімі. Шығыс Қазақстан облысы Әділет департаментінің Жарма аудандық әділет басқармасында 2010 жылғы 14 қаңтарда № 5-10-93 тіркелді. Қабылданған мерзімінің бітуіне байланысты күші жойылды - Жарма ауданы әкімі аппаратының 2011 жылғы 11 мамырдағы № 1113 хаты
