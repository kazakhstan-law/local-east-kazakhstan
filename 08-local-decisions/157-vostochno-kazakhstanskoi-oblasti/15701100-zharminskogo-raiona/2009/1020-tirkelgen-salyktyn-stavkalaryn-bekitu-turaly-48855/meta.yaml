act_code: '48855'
requisite: Шығыс Қазақстан облысы Жарма аудандық мәслихатының 2009 жылғы 20 қазандағы № 15/8-IV шешімі. Шығыс Қазақстан облысы Әділет департаментінің Жарма ауданының әділет басқармасында 2009 жылғы 17 қарашада № 5-10-89 тіркелді. Күші жойылды - Жарма аудандық мәслихатының 2012 жылғы 5 маусымдағы № 3/32-V шешімімен
