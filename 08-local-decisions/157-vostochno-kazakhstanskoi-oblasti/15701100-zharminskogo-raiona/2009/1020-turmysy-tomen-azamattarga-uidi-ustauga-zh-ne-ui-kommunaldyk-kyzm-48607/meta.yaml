requisite: Шығыс Қазақстан облысы Жарма аудандық мәслихатының 2009 жылғы 20 қазандағы № 15/6-IV шешімі. Шығыс Қазақстан облысы Әділет департаментінің Жарма ауданының әділет басқармасында 2009 жылғы 6 қарашада № 5-10-87 тіркелді. Күші жойылды - Жарма аудандық мәслихатының 2010 жылғы 27 шілдедегі № 23/182-IV шешімімен
