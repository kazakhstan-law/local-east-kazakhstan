requisite: Шығыс Қазақстан облысы Жарма аудандық мәслихатының 2009 жылғы 28 желтоқсандағы № 17/2-IV шешімі. Шығыс Қазақстан облысы Әділет департаментінің Жарма аудандық әділет басқармасында 2010 жылғы 10 қаңтарда № 5-10-92 тіркелді. Қабылданған мерзімінің бітуіне байланысты күші жойылды - Жарма аудандық мәслихатының 2010 жылғы 31 желтоқсандағы № 287/4-15 хаты
