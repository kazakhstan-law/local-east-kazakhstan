act_code: '48856'
requisite: Шығыс Қазақстан облысы Жарма аудандық мәслихатының 2009 жылғы 20 қазандағы № 15/7-IV шешімі. Шығыс Қазақстан облысы Әділет департаментінің Жарма ауданының әділет басқармасында 2009 жылғы 25 қарашада № 5-10-90 тіркелді. Күші жойылды - Жарма аудандық мәслихатының 2012 жылғы 5 маусымдағы № 3/33-V шешімімен
