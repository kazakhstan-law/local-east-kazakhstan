requisite: Решение Жарминского районного маслихата Восточно-Казахстанской области от 9 января 2018 года № 18/158-VI. Зарегистрировано Департаментом юстиции Восточно-Казахстанской области 24 января 2018 года № 5468. Утратило силу решением Жарминского районного маслихата Восточно-Казахстанской области от 21 декабря 2018 года № 28/247-VI
title:
  rus: Об определении размеров предоставления мер социальной поддержки специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса прибывшим для работы и проживания в сельские населенные пункты Жарминского района на 2018 год
  kaz: 2018 жылы Жарма ауданының ауылдық елді мекендеріне жұмыс істеу және тұру үшін келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға әлеуметтік қолдау шараларын ұсыну туралы
