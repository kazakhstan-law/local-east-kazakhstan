  title:
    rus: О внесении изменений в решение Жарминского районного маслихата от 12 сентября 2018 года № 25/219-VI «Об оказании социальной поддержки специалистам государственных организаций, проживающим и работающим в сельских населенных пунктах Жарминского района»
    kaz: Жарма аудандық мәслихатының 2018 жылғы 12 қыркүйектегі № 25/219-VI «Жарма ауданының ауылдық елді мекендерінде тұратын және жұмыс істейтін мемлекеттік ұйымдардың мамандарына әлеуметтік қолдау көрсету туралы» шешіміне өзгерістер енгізу туралы
