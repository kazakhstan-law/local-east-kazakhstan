requisite: Решение Жарминского районного маслихата Восточно-Казахстанской области от 21 декабря 2018 года № 28/247-VI. Зарегистрировано Управлением юстиции Жарминского района Департамента юстиции Восточно-Казахстанской области 14 января 2019 года № 5-10-166. Утратило силу решением Жарминского районного маслихата Восточно-Казахстанской области от 27 декабря 2019 года № 41/336-VI (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об определении размеров предоставления мер социальной поддержки специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса прибывшим для работы и проживания в сельские населенные пункты Жарминского района на 2019 год
  kaz: 2019 жылға Жарма ауданының ауылдық елді мекендеріне жұмыс істеу және тұру үшін келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға әлеуметтік қолдау шараларын ұсыну мөлшерін айқындау туралы
