  title:
    rus: О внесении изменения в решение Жарминского районного маслихата от 21 декабря 2018 года № 28/247-VI «Об определении размеров предоставления мер социальной поддержки специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания в сельские населенные пункты Жарминского района на 2019 год»
    kaz: Жарма аудандық мәслихатының 2018 жылғы 21 желтоқсандағы № 28/247-VI «2019 жылға Жарма ауданының ауылдық елді мекендеріне жұмыс істеу және тұру үшін келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға әлеуметтік қолдау шараларын ұсыну мөлшерін айқындау туралы» шешіміне өзгеріс енгізу туралы
