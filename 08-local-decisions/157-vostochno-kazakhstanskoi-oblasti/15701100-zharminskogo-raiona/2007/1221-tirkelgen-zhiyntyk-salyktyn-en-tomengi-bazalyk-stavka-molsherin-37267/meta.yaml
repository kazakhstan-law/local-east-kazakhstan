requisite: Шығыс Қазақстан облысы Жарма аудандық мәслихатының 2007 жылғы 21 желтоқсандағы № 3/5-IV шешімі. Шығыс Қазақстан облысы Әділет департаментінің Жарма аудандық Әділет басқармасында 2008 жылғы 11 қаңтарда № 5-10-54 тіркелді. Күші жойылды - Жарма аудандық мәслихатының 2009 жылғы 13 ақпандағы № 11/10-IV шешімімен
