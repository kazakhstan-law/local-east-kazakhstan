  title:
    rus: О внесении изменения в решение Жарминского районного маслихата от 11 ноября 2021 года № 9/114-VII «Об утверждении Правил и размера оказания социальной поддержки по оплате коммунальных услуг и приобретению топлива за счет бюджетных средств специалистам государственных организаций здравоохранения, социального обеспечения, образования, культуры, спорта и ветеринарии, проживающим и работающим в сельских населенных пунктах Жарминского района»
    kaz: Жарма аудандық мәслихатының 2021 жылғы 11 қарашадағы № 9/114-VII «Жарма ауданының ауылдық елді мекендерінде тұратын және жұмыс істейтін денсаулық сақтау, әлеуметтік қамсыздандыру, білім беру, мәдениет, спорт және ветеринария мемлекеттік ұйымдардың мамандарына бюджет қаражаты есебiнен коммуналдық қызметтерге ақы төлеу және отын сатып алу бойынша әлеуметтік қолдау көрсету қағидалары мен мөлшерін бекіту туралы» шешіміне өзгеріс енгізу туралы
