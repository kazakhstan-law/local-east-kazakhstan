act_code: '160367'
requisite: Решение Жарминского районного маслихата Восточно-Казахстанской области от 11 ноября 2021 года № 9/114-VII. Зарегистрировано в Министерстве юстиции Республики Казахстан 19 ноября 2021 года № 25232
title:
  rus: Об утверждении Правил и размера оказания социальной поддержки по оплате коммунальных услуг и приобретению топлива за счет бюджетных средств специалистам государственных организаций здравоохранения, социального обеспечения, образования, культуры, спорта и ветеринарии, проживающим и работающим в сельских населенных пунктах Жарминского района
  kaz: Жарма ауданының ауылдық елді мекендерінде тұратын және жұмыс істейтін денсаулық сақтау, әлеуметтік қамсыздандыру, білім беру, мәдениет, спорт және ветеринария мемлекеттік ұйымдардың мамандарына бюджет қаражаты есебiнен коммуналдық қызметтерге ақы төлеу және отын сатып алу бойынша әлеуметтік қолдау көрсету қағидалары мен мөлшерін бекіту туралы
