act_code: '160338'
requisite: Решение Жарминского районного маслихата Восточно-Казахстанской области от 11 ноября 2021 года № 9/112-VII. Зарегистрировано в Министерстве юстиции Республики Казахстан 19 ноября 2021 года № 25231. Утратило силу решением Жарминского районного маслихата области Абай от 27 июня 2023 года № 3/46-VII (вводится в действие по истечении десяти календарных дней после его первого официального опубликования)
title:
  rus: Об определении порядка и размера возмещения затрат на обучение на дому детей с ограниченными возможностями из числа детей с инвалидностью по индивидуальному учебному плану в Жарминском районе области Абай
  kaz: Абай облысы Жарма ауданында мүгедектегі бар балалар қатарындағы кемтар балаларды жеке оқыту жоспары бойынша үйде оқытуға жұмсаған шығындарын өндіріп алу тәртібі және мөлшерін айқындау туралы
