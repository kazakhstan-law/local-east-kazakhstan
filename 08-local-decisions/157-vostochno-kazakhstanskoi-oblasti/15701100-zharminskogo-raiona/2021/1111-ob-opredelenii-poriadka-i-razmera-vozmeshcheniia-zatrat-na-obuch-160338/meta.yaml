  title:
    rus: О внесении изменения в решение Жарминского районного маслихата от  11 ноября 2021 года № 9/112-VII «Об определении порядка и размера возмещения затрат на обучение на дому детей с ограниченными возможностями из числа инвалидов по индивидуальному учебному плану в Жарминском районе»
    kaz: Жарма аудандық мәслихатының 2021 жылғы 11 қарашадағы № 9/112-VII «Жарма ауданында мүгедектер қатарындағы кемтар балаларды жеке оқыту жоспары бойынша үйде оқытуға жұмсаған шығындарын өндіріп алу тәртібі және мөлшерін айқындау туралы» шешіміне өзгерістер енгізу туралы
