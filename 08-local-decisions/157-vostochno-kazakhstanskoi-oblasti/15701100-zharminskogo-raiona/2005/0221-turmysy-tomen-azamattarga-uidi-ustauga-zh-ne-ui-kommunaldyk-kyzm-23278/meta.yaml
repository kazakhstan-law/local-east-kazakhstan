requisite: Шығыс Қазақстан облысы Жарма аудандық мәслихатының XVII сессиясының 2005 жылғы 21 ақпандағы № 17-5 шешімі. Шығыс Қазақстан облысының Әділет департаментінде 2005 жылғы 2 наурызда № 2207 тіркелді. Күші жойылды - Жарма аудандық мәслихатының 2009 жылғы 20 қазандағы № 15/6-IV шешімімен
