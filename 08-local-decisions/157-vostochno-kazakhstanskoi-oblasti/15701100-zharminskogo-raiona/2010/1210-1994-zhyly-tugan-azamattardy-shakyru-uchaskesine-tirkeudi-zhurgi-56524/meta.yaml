requisite: Шығыс Қазақстан облысы Жарма ауданы әкімінің 2010 жылғы 10 желтоқсандағы № 23 шешімі. Шығыс Қазақстан облысы Әділет департаментінің Жарма аудандық әділет басқармасында 2010 жылғы 24 желтоқсанда № 5-10-108 тіркелді. Қабылданған мерзімінің бітуіне байланысты күші жойылды - Жарма ауданы әкімі аппаратының 2011 жылғы 11 мамырдағы № 1113 хаты
