act_code: '54020'
requisite: Шығыс Қазақстан облысы Жарма аудандық мәслихатының 2010 жылғы 27 шілдедегі № 23/183-IV шешімі. Шығыс Қазақстан облысы Әділет департаментінің Жарма аудандық әділет басқармасында 2010 жылғы 16 тамызда № 5-10-102 тіркелді. Күші жойылды - Жарма аудандық мәслихатының 2012 жылғы 5 маусымдағы № 3/39-V шешімімен
title:
  rus: Жарма ауданындағы елді мекендердің аумақтарын көріктендіру, инфрақұрылым объектілерін сақтау және жасыл желектерді күтіп ұстау мен қорғау Ережесін бекіту туралы
