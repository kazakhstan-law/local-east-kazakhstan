act_code: '43258'
requisite: Шығыс Қазақстан облысы Жарма ауданы әкімінің 2008 жылғы 10 желтоқсандағы № 11 шешімі. Шығыс Қазақстан облысы Әділет департаментінің Жарма аудандық Әділет басқармасында 2008 жылғы 30 желтоқсанда № 5-10-71 тіркелді. Күші жойылды - Жарма ауданы әкімінің аппаратының 2009 жылғы 15 мамырдағы № 715 хатымен
