act_code: '43260'
requisite: Шығыс Қазақстан облысы Жарма аудандық мәслихатының 2008 жылғы 29 желтоқсандағы № 9/2-IV шешімі. Шығыс Қазақстан облысы Әділет департаментінің Жарма аудандық әділет басқармасында 2009 жылғы 6 қаңтарда № 5-10-73 тіркелді. Қабылданған мерзімінің бітуіне байланысты күші жойылды - Жарма аудандық мәслихатының 2010 жылғы 5 ақпандағы № 29/4-15 хаты
