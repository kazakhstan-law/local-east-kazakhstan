requisite: Решение Абайского районного маслихата Восточно-Казахстанской области от 22 апреля 2014 года № 21/5-V. Зарегистрировано Департаментом юстиции Восточно-Казахстанской области 27 мая 2014 года № 3364. Утратило силу решением маслихата Абайского района области Абай от 8 сентября 2022 года № 27/3-VII (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Правил проведения раздельных сходов местного сообщества и определения количества представителей жителей сел, улиц, многоквартирных жилых домов для участия в сходе местного сообщества Абайского района
  kaz: Абай ауданында бөлек жергілікті қоғамдастық жиындарын өткізу Қағидасын  бекіту және жергілікті қоғамдастық жиынына қатысу үшін ауылдар, көшелер, көппәтерлі тұрғын үйлер тұрғындары өкілдерінің санын айқындау туралы
