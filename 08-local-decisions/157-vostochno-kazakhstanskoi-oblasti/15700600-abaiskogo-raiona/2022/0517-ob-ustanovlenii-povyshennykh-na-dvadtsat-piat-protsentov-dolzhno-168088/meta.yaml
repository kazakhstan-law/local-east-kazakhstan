  requisite: Решение Абайского районного маслихата области Абай от 7 октября 2025 года № 31/10-VIII
  title:
    rus: О внесении изменений в решение маслихата Абайского района от 17 мая 2022 года № 22/5-VІІ «Об установлении повышенных на двадцать пять процентов должностных окладов и тарифных ставок специалистам в области социального обеспечения, культуры являющимся гражданскими служащими и работающим в сельской местности»
    kaz: Абай аудандық мәслихатының 2022 жылғы 17 мамырдағы № 22/5-VІІ «Азаматтық қызметшілер болып табылатын және ауылдық жерде жұмыс iстейтiн әлеуметтiк қамсыздандыру, мәдениет саласындағы мамандарға жиырма бес пайызға жоғарылатылған лауазымдық айлықақылар мен тарифтiк мөлшерлемелер белгiлеу туралы» шешіміне өзгерістер енгізу туралы
