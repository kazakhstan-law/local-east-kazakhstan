  title:
    rus: О внесении изменений в решение Абайского районного маслихата от 3 ноября 2021 года № 14/3-VІІ «Об определении порядка и размера возмещения затрат на обучение на дому детей  с ограниченными возможностями из числа инвалидов по индивидуальному учебному плану в Абайском районе»
    kaz: Абай аудандық мәслихатының 2021 жылғы 3 қарашадағы  № 14/3-VІІ «Абай ауданында мүгедектер қатарындағы кемтар балаларды жеке оқыту жоспары бойынша үйде оқытуға жұмсаған шығындарын өндіріп алу мөлшері мен тәртібін айқындау туралы» шешіміне өзгерістер енгізу туралы
