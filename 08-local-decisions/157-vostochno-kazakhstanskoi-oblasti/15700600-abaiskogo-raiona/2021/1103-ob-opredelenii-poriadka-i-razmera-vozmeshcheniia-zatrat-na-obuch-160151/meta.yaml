    kaz: Абай аудандық мәслихатының 2021 жылғы 3 қарашадағы № 14/3-VІІ «Абай ауданында мүгедектігі бар балалар қатарындағы кемтар балаларды жеке оқыту жоспары бойынша үйде оқытуға жұмсалған  шығындарды өтеу мөлшері мен тәртібін айқындау туралы» шешіміне өзгеріс енгізу туралы
