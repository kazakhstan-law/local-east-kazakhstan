requisite: Шығыс Қазақстан облысы Абай ауданының әкімінің 2002 жылғы 6 қарашадағы № 321 шешімі. Шығыс Қазақстан облысының Әділет басқармасында 2002 жылғы 11 желтоқсанда № 1017 тіркелді. Шешімнің қабылдау мерзімінің өтуіне байланысты қолдану тоқтатылды - Шығыс Қазақстан облысы Абай ауданының әкімінің 2009 жылғы 8 желтоқсандағы № 23 хатымен
