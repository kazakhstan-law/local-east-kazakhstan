act_code: '55687'
requisite: Шығыс Қазақстан облысы Абай аудандық мәслихатының 2010 жылғы 2 қарашадағы № 24-5 шешімі. Шығыс Қазақстан облысы Әділет департаментінің Абай ауданындағы Әділет басқармасында 2010 жылғы 2 желтоқсанда № 5-5-118 тіркелді. Күші жойылды - Шығыс Қазақстан облысы Абай аудандық мәслихатының 2012 жылғы 10 сәуірдегі № 3-11 шешімімен
