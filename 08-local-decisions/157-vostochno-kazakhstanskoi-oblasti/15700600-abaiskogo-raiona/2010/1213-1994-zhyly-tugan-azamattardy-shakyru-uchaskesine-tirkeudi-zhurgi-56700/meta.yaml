requisite: Шығыс Қазақстан облысы Абай ауданының әкімінің 2010 жылғы 13 желтоқсандағы № 52 шешімі. Шығыс Қазақстан облысы Әділет департаментінің Абай ауданындағы Әділет басқармасында 2011 жылғы 12 қаңтарда № 5-5-121 тіркелді. Күші жойылды - Шығыс Қазақстан облысы Абай ауданының әкімінің 2011 жылғы 6 мамырдағы № 67 шешімімен
