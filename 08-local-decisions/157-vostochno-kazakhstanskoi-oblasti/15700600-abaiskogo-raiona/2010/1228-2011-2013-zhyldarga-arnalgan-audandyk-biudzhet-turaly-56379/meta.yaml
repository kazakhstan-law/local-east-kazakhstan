act_code: '56379'
requisite: Шығыс Қазақстан облысы Абай аудандық мәслихатының 2010 жылғы 28 желтоқсандағы № 26-3 шешімі. Шығыс Қазақстан облысы Әділет департаментінің Абай ауданындағы Әділет басқармасында 2010 жылғы 31 желтоқсанда № 5-5-120 тіркелді. Күші жойылды - Шығыс Қазақстан облысы Абай аудандық мәслихатының 2012 жылғы 17 ақпандағы № 2-3 шешімімен
