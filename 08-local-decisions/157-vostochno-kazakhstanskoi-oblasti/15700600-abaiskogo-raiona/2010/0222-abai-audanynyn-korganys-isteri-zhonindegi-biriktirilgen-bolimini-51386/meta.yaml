act_code: '51386'
requisite: Шығыс Қазақстан облысы Абай ауданының әкімінің 2010 жылғы 22 ақпандағы № 33-а шешімі. Шығыс Қазақстан облысы Әділет департаментінің Абай ауданындағы Әділет басқармасында 2010 жылғы 19 наурызда № 5-5-104 тіркелді. Шешімнің қабылдау мерзімінің өтуіне байланысты қолдану тоқтатылды - Шығыс Қазақстан облысы Абай ауданының әкімдігінің 2010 жылғы 26 сәуірдегі № 41 хатымен
