requisite: Решение маслихата Абайского района Восточно-Казахстанской области от 20 сентября 2016 года № 5/3-VI. Зарегистрировано Департаментом юстиции Восточно-Казахстанской области 17 октября 2016 года № 4693. Утратило силу - решением Абайского районного маслихата Восточно-Казахстанской области от 28 марта 2018 года № 22/6-VI
title:
  rus: О повышении базовых ставок земельногоналога и ставок единого земельного налога на не используемые в соответствии с земельным законодательством Республики Казахстан земли сельскохозяйственного назначения Абайского района
  kaz: Қазақстан Республикасының жер заңнамасына сәйкес пайдаланылмайтын Абай ауданының ауыл шаруашылығы мақсатындағы жерлерге жер салығының базалық мөлшерлемелерін және  бірыңғай жер салығының мөлшерлемелерін жоғарылату  туралы
