  title:
    rus: О внесении изменений в решение Абайского районного маслихата от 23 июня 2020 года № 49/7-VІ «Об оказании социальной поддержки специалистам государственных организаций, проживающим и работающим в сельских населенных пунктах Абайского района»
    kaz: Абай аудандық мәслихатының 2020 жылғы 23 маусымдағы № 49/7-VІ «Абай ауданының ауылдық елді мекендерінде тұратын және жұмыс істейтін мемлекеттік ұйымдардың мамандарына әлеуметтік қолдау көрсету туралы» шешіміне өзгерістер енгізу туралы
