  title:
    rus: О внесении изменений в решение Абайского районного маслихата от 10 сентября 2020 года № 52/5-VI «О специализированных местах для организации и проведения мирных собраний, порядке их использования, нормах их предельной заполняемости, требованиях к их материально-техническому и организационному обеспечению, границах прилегающих территорий, в которых запрещено проведение пикетирования»
    kaz: Абай аудандық мәслихатының 2020 жылғы 10 қыркүйектегі № 52/5-VI «Бейбіт жиналыстарды ұйымдастыру және өткізу үшін арнайы орындар, оларды пайдалану тәртібі, олардың шекті толу нормалары, олардың материалдық-техникалық және ұйымдастырушылық қамтамасыз етуге қойылатын талаптары, пикеттеуді өткізуге тыйым салынған іргелес аумақтардың шекараларын айқындау туралы» шешіміне өзгерістер енгізу туралы
