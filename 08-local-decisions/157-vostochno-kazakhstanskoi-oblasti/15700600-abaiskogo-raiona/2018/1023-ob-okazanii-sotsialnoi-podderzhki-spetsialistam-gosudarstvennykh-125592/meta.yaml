    kaz: Абай аудандық мәслихатының 2018 жылғы 23 қазандағы № 27/7-VI «Абай ауданының ауылдық елді мекендерінде тұратын және жұмыс істейтін мемлекеттік ұйымдардың мамандарына әлеуметтік қолдау көрсету туралы» шешімінің қолданылуын тоқтата тұру туралы
