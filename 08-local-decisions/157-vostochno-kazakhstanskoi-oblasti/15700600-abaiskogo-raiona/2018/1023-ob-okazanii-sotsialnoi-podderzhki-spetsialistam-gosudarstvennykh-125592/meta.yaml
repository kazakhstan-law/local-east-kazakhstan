act_code: '125592'
requisite: Решение маслихата Абайского района Восточно-Казахстанской области от 23 октября 2018 года № 27/7-VІ. Зарегистрировано Управлением юстиции Абайского района Департамента юстиции Восточно-Казахстанской области 1 ноября 2018 года № 5-5-158. Действие решения приостановлено до приведения его в соответствие с действующим законодательством Республики Казахстан и принятия решения на сессии Абайского районного маслихата решением Абайского районного маслихата Восточно-Казахстанской области от 13  апреля 2020 года № 46/11-VI (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования). Утратило силу решением Абайского районного маслихата Восточно-Казахстанской области от 23 июня 2020 года № 49/7-VI (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
