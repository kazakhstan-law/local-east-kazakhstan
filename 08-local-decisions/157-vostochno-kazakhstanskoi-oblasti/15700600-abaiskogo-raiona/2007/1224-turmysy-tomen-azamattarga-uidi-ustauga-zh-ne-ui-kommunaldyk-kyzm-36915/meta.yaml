act_code: '36915'
requisite: Шығыс Қазақстан облысы Абай аудандық мәслихатының 2007 жылғы 24 желтоқсандағы №  3-10 шешімі. Шығыс Қазақстан облысы Әділет департаментінің Абай ауданындағы Әділет басқармасында 2008 жылғы 22 қаңтарда № 5-5-68 тіркелді. Күші жойылды - Шығыс Қазақстан облысы Абай аудандық мәслихатының 2008 жылғы 18 сәуірдегі № 5-3 шешімімен
