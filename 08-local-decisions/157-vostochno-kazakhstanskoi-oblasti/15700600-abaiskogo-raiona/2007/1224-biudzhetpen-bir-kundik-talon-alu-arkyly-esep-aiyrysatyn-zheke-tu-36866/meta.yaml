requisite: Шығыс Қазақстан облысы Абай аудандық мәслихатының 2007 жылғы 24 желтоқсандағы № 3-7 шешімі. Шығыс Қазақстан облысы Әділет департаментінің Семей қаласындағы әділет басқармасында 2008 жылғы 18 қаңтарда № 5-5-65 тіркелді. Күші жойылды - Шығыс Қазақстан облысы Абай аудандық мәслихатының 2009 жылғы 21 сәуірдегі № 14-6 шешімімен
