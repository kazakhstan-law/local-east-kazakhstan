requisite: Шығыс Қазақстан облысы Абай аудандық мәслихатыңың 2007 жылғы 24 желтоқсандағы № 3-6 шешімі. Шығыс Қазақстан облысы Әділет департаментінің Абай ауданындағы әділет басқармасында 2008 жылғы 18 қаңтарда № 5-5-64 тіркелді. Күші жойылды - Шығыс Қазақстан облысы Абай аудандық мәслихатының 2009 жылғы 21 сәуірдегі № 14-6 шешімімен
