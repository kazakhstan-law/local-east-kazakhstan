requisite: Шығыс Қазақстан облысы Абай аудандық маслихатының 2009 жылғы 17 шілдедегі № 15-5 шешімі. Шығыс Қазақстан облысы Әділет департаментінің Абай ауданындағы Әділет басқармасында 2009 жылы 27 тамызда № 5-5-98 тіркелді. Күші жойылды - Шығыс Қазақстан облысы Абай аудандық маслихатының 2010 жылғы 27 шілдедегі № 23-5 шешімімен
