act_code: '41001'
requisite: Шығыс Қазақстан облысы Абай аудандық мәслихатының 2008 жылғы 10 шілдедегі № 6-5 шешімі. Шығыс Қазақстан облысы Әділет департаментінің Абай ауданындағы Әділет басқармасында 2008 жылғы 25 шілдесінде № 5-5-82 тіркелді. Күші жойылды - Шығыс Қазақстан облысы Абай ауданы әкімдігінің 2008 жылғы 19 қыркүйектегі № 8-2 шешімімен
