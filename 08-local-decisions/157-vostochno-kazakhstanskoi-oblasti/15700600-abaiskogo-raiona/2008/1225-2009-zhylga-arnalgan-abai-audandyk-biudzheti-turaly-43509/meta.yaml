act_code: '43509'
requisite: Шығыс Қазақстан облысы Абай аудандық маслихатының 2008 жылғы 25 желтоқсандағы № 10-3 шешімі. Шығыс Қазақстан облысы Әділет департаментінің Абай ауданындағы Әділет басқармасында 2009 жылғы 14 қаңтарда № 5-5-85 тіркелді. Күші жойылды - Шығыс Қазақстан облысы Абай аудандық мәслихатының 2010 жылғы 25 қаңтардағы № 19-4 шешімімен
