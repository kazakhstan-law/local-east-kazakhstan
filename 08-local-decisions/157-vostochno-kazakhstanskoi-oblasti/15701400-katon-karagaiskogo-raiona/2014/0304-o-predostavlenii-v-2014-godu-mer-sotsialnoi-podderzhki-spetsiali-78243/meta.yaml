  title:
    rus: О внесении изменений в решение Катон-Карагайского районного маслихата от 4 марта 2014 года № 21/147-V "О предоставлении в 2014 году мер социальной поддержки специалистам здравоохранения, образования, социального обеспечения, культуры, спорта и ветеринарии, прибывшим для работы и проживания в сельские населенные пункты Катон-Карагайского района"
    kaz: '"Катонқарағай ауданының ауылдық елдi мекендеріне жұмыс iстеу және тұру үшiн келген денсаулық сақтау, бiлiм беру, әлеуметтiк қамсыздандыру, мәдениет, спорт және ветеринария мамандарына 2014 жылы әлеуметтiк қолдау шараларын ұсыну туралы" Катонқарағай аудандық мәслихатының 2014 жылғы 4 наурыздағы № 21/147-V шешіміне өзгерістер енгізу туралы'
