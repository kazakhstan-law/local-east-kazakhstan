act_code: '78243'
requisite: Решение Катон-Карагайского районного маслихата Восточно-Казахстанской области от 4 марта 2014 года № 21/147-V. Зарегистрировано Департаментом юстиции Восточно-Казахстанской области 27 марта 2014 года № 3208. Утратило силу (письмо Катон-Карагайского районного маслихата Восточно-Казахстанской области от 25 декабря 2014 года № 272)
title:
  rus: О предоставлении в 2014 году мер социальной поддержки специалистам здравоохранения, образования, социального обеспечения, культуры, спорта и ветеринарии, прибывшим для работы и проживания в сельские населенные пункты Катон-Карагайского района
  kaz: Катонқарағай ауданының ауылдық елдi мекендерге жұмыс iстеуге және тұруға үшiн келген денсаулық сақтау, бiлiм беру, әлеуметтiк қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға 2014 жылы әлеуметтiк қолдау шараларын ұсыну туралы
