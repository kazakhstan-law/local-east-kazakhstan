  title:
    rus: О внесении изменений в решение Катон-Карагайского районного маслихата от 17 апреля 2014 года № 22/162-V «Об утверждении Правил проведения раздельных сходов местного сообщества и определения количества представителей жителей сел, улиц, многоквартирных жилых домов для участия в сходах местного сообщества на территории Катон-Карагайского района»
