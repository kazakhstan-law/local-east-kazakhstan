act_code: '80181'
requisite: Решение Катон-Карагайского районного маслихата Восточно-Казахстанской области от 17 апреля 2014 года № 22/162-V. Зарегистрировано Департаментом юстиции Восточно-Казахстанской области 20 мая 2014 года № 3344. Утратило силу решением Катон-Карагайского районного маслихата Восточно-Казахстанской области от 24 октября 2023 года № 8/96-VIII (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
