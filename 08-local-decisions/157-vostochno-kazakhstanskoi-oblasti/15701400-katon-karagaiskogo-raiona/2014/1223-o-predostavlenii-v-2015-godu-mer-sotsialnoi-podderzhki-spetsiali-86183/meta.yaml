act_code: '86183'
requisite: Решение Катон-Карагайского районного маслихата Восточно-Казахстанской области от 23 декабря 2014 года № 28/220-V. Зарегистрировано Департаментом юстиции Восточно-Казахстанской области 20 января 2015 года № 3641. Утратило силу - решением Катон-Карагайского районного маслихата Восточно-Казахстанской области от 21 декабря 2015 года № 35/280-V
title:
  rus: О предоставлении в 2015 году мер социальной поддержки специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания в сельские населенные пункты Катон-Карагайского района
  kaz: Катонқарағай ауданының ауылдық елдi мекендеріне жұмыс iстеу және тұру үшiн келген денсаулық сақтау, бiлiм беру, әлеуметтiк қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға 2015 жылы әлеуметтiк қолдау шараларын ұсыну туралы
