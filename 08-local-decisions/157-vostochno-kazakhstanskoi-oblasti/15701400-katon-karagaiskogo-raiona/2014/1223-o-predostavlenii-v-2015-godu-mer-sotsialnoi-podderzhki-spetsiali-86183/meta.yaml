  title:
    rus: О внесении изменения в решение Катон-Карагайского районного маслихата № 28/220-V от 23 декабря 2014 года «О предоставлении в 2015 году мер социальной поддержки специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса прибывшим для работы и проживания в сельские населенные пункты Катон-Карагайского района»
    kaz: Катонқарағай ауданының ауылдық елдi мекендеріне жұмыс iстеу және тұру үшiн келген денсаулық сақтау, бiлiм беру, әлеуметтiк қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға  2015 жылы әлеуметтiк қолдау шараларын ұсыну туралы» Катонқарағай аудандық мәслихатының 2014 жылғы 23 желтоқсандағы  № 28/220-V шешіміне өзгеріс енгізу туралы
