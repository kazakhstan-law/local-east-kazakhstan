act_code: '50454'
requisite: Шығыс Қазақстан облысы Катонқарағай ауданы әкімінің 2010 жылғы 25 қаңтардағы № 144 шешімі. Шығыс Қазақстан облысы Әділет департаментінің Катонқарағай аудандық әділет басқармасында 2010 жылғы 29 қаңтарда № 5-13-69 тіркелді. Күші жойылды - Катонқарағай ауданы әкімінің 2010 жылғы 7 шілдедегі № 150 шешімімен
