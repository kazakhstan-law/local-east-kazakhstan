act_code: '54160'
requisite: Шығыс Қазақстан облысы Катонқарағай аудандық мәслихатының 2010 жылғы 28 шілдедегі № 23/190-IV шешімі. Шығыс Қазақстан облысы Әділет департаментінің Катонқарағай аудандық әділет басқармасында 2010 жылғы 26 тамызда № 5-13-78 болып тіркелді. Күші жойылды (Шығыс Қазақстан облысы Катонқарағай аудандық мәслихатының 2014 жылғы 25 желтоқсандағы № 272 хаты)
