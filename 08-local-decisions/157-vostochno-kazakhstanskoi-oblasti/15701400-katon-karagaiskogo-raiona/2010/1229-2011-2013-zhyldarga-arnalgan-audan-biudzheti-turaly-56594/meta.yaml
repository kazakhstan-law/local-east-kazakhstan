act_code: '56594'
requisite: Шығыс Қазақстан облысы Катонқарағай аудандық мәслихатының 2010 жылғы 29 желтоқсандағы № 27/229-IV шешімі. Шығыс Қазақстан облысы Әділет департаментінің Катонқарағай аудандық әділет басқармасында 2010 жылғы 31 желтоқсанда № 5-13-82 тіркелді. Қабылданған мерзімінің бітуіне байланысты күші жойылды (Катонқарағай аудандық мәслихатының 2012 жылғы 5 қаңтардағы № 03 хаты)
