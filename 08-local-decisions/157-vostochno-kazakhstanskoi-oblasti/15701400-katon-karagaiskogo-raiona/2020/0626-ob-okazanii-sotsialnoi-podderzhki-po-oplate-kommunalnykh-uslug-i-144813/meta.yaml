act_code: '144813'
requisite: Решение Катон-Карагайского районного маслихата Восточно-Казахстанской области от 26 июня 2020 года № 40/350-VI. Зарегистрировано Департаментом юстиции Восточно-Казахстанской области 9 июля 2020 года № 7315. Утратило силу решением Катон-Карагайского районного маслихата Восточно-Казахстанской области от 26 октября 2021 года № 11/113-VII (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об оказании социальной поддержки по оплате коммунальных услуг и приобретению топлива за счет бюджетных средств специалистам государственных организаций здравоохранения, социального обеспечения, образования, культуры, спорта и ветеринарии, проживающим и работающим в сельских населенных пунктах Катон-Карагайского района
  kaz: Катонқарағай ауданының ауылдық елді мекендерінде тұратын және жұмыс істейтін мемлекеттік денсаулық сақтау, әлеуметтік қамсыздандыру, білім беру, мәдениет, спорт және ветеринария ұйымдарының мамандарына бюджет қаражаты есебiнен көрсетілетін коммуналдық қызметтерге ақы төлеу және отын сатып алу бойынша әлеуметтік қолдау көрсету туралы
