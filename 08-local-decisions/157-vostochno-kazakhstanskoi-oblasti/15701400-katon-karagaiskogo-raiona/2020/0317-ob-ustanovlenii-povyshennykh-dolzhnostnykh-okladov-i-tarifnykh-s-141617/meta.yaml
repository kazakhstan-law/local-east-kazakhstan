requisite: Решение Катон-Карагайского районного маслихата Восточно-Казахстанской области от 17 марта 2020 года № 36/317-VІ. Зарегистрировано Департаментом юстиции Восточно-Казахстанской области 13 апреля 2020 года № 6878. Утратило силу решением Катон-Карагайского районного маслихата Восточно-Казахстанской области от 25 декабря 2020 года № 46/408-VI (вводится в действие с 01.01.2021)
title:
  rus: Об установлении повышенных должностных окладов и тарифных ставок специалистам в области социального обеспечения, образования, культуры, спорта, являющимся гражданскими служащими и работающим в сельской местности
  kaz: Азаматтық қызметшілер болып табылатын және ауылдық жерде жұмыс iстейтiн әлеуметтiк қамсыздандыру, бiлiм беру, мәдениет, спорт саласындағы мамандарға жоғарылатылған лауазымдық айлықақылар мен тарифтiк мөлшерлемелер белгілеу туралы
