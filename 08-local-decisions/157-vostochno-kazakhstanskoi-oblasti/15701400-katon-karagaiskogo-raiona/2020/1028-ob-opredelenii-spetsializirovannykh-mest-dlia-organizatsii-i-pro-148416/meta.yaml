act_code: '148416'
requisite: Решение Катон-Карагайского районного маслихата Восточно-Казахстанской области от 28 октября 2020 года № 44/384-VI. Зарегистрировано Департаментом юстиции Восточно-Казахстанской области 12 ноября 2020 года № 7810. Утратило силу решением Катон-Карагайского районного маслихата Восточно-Казахстанской области от 11 апреля 2025 года № 26/299-VIII (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об определении специализированных мест для организации и проведения мирных собраний, порядка их использования, норм их предельной заполняемости, требований к их материально-техническому и организационному обеспечению, границ прилегающих территорий, в которых запрещено проведение пикетирования по Катон-Карагайскому району
  kaz: Катонқарағай ауданы бойынша бейбіт жиналыстарды ұйымдастыру және өткізу үшін арнайы орындарды, оларды пайдалану тәртібін, олардың шекті толу нормаларын, олардың материалдық-техникалық және ұйымдастыруды қамтамасыз етуге қойылатын талаптарын, пикеттеуді өткізуге тыйым салынған іргелес аумақтардың шекараларын айқындау туралы
