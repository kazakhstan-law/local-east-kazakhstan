  title:
    rus: О внесении изменения в решение Катон-Карагайского районного маслихата от 26 октября 2021 года № 11/113-VII «Об утверждении правил оказании социальной поддержки по оплате коммунальных услуг и приобретению топлива за счет бюджетных средств специалистам государственных организаций здравоохранения, социального обеспечения, образования, культуры, спорта и ветеринарии, проживающим и работающим в сельских населенных пунктах Катон-Карагайского района»
    kaz: Катонқарағай аудандық мәслихатының 2021 жылғы 26 қазандағы № 11/113-VII «Катонқарағай ауданының ауылдық елді мекендерінде тұратын және жұмыс істейтін мемлекеттік денсаулық сақтау, әлеуметтік қамсыздандыру, білім беру, мәдениет, спорт және ветеринария ұйымдарының мамандарына бюджет қаражаты есебінен коммуналдық көрсетілетін қызметтерге ақы төлеу және отын  сатып алу бойынша әлеуметтік қолдау көрсету Қағидасын бекіту туралы» шешіміне өзгеріс енгізу туралы
