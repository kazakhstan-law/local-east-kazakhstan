act_code: '160074'
requisite: Решение Катон-Карагайского районного маслихата Восточно-Казахстанской области от 26 октября 2021 года № 11/113-VII. Зарегистрировано в Министерстве юстиции Республики Казахстан 9 ноября 2021 года № 25081
title:
  rus: Об утверждении Правил и размера оказания социальной поддержки по оплате коммунальных услуг и приобретению топлива за счет бюджетных средств специалистам государственных организаций здравоохранения, социального обеспечения, образования, культуры, спорта и ветеринарии, проживающим и работающим в сельских населенных пунктах Катон-Карагайского района
  kaz: Катонқарағай ауданының ауылдық елді мекендерінде тұратын және жұмыс істейтін мемлекеттік денсаулық сақтау, әлеуметтік қамсыздандыру, білім беру, мәдениет, спорт және ветеринария ұйымдарының мамандарына бюджет қаражаты есебінен коммуналдық көрсетілетін қызметтерге ақы төлеу және отын сатып алу бойынша әлеуметтік қолдау көрсету Қағидасын және мөлшерін бекіту туралы
