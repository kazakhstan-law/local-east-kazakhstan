  title:
    rus: О внесении изменения в решение маслихата Катон-Карагайского района от 26 октября 2021 года № 11/113-VII «Об утверждении Правил и размера оказания социальной поддержки по оплате коммунальных услуг и приобретению топлива за счет бюджетных средств специалистам государственных организаций здравоохранения, социального обеспечения, образования, культуры, спорта и ветеринарии, проживающим и работающим в сельских населенных пунктах Катон-Карагайского района»
    kaz: Катонқарағай ауданының ауылдық елді мекендерінде тұратын және жұмыс істейтін мемлекеттік денсаулық сақтау, әлеуметтік қамсыздандыру, білім беру, мәдениет, спорт және ветеринария ұйымдарының мамандарына бюджет қаражаты есебінен коммуналдық көрсетілетін қызметтерге ақы төлеу және отын сатып алу бойынша әлеуметтік қолдау көрсету Қағидасын және мөлшерін бекіту туралы Катонқарағай ауданы мәслихатының 2021 жылғы 26 қазандағы № 11/113-VII шешіміне өзгеріс енгізу туралы
