    kaz: Катонқарағай аудандық мәслихатының 2021 жылғы 26 қазандағы № 11/114-VІІ «Катонқарағай ауданында мүгедектер қатарындағы кемтар балаларды жеке оқыту жоспары бойынша үйде оқытуға жұмсаған шығындарын өндіріп алу тәртібі мен мөлшерін айқындау туралы» шешіміне өзгерістер енгізу туралы
