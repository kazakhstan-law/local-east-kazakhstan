act_code: '117856'
requisite: Решение Катон-Карагайского районного маслихата Восточно-Казахстанской области от 26 декабря 2017 года № 15/136-VI. Зарегистрировано Департаментом юстиции Восточно-Казахстанской области 8 января 2018 года № 5392
title:
  rus: Об определении мер социальной поддержки специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса прибывшим для работы и  проживания в сельские населенные пункты Катон-Карагайского района на 2018 год
  kaz: Катонқарағай ауданының ауылдық елдi мекендеріне жұмыс iстеу және тұру үшiн келген денсаулық сақтау, бiлiм беру, әлеуметтiк қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы  мамандарға 2018 жылы әлеуметтiк қолдау шараларын ұсыну туралы
