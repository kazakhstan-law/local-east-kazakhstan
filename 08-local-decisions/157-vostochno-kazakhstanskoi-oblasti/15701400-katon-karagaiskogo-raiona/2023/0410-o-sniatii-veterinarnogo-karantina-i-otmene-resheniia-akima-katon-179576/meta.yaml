act_code: '179576'
requisite: Решение акима Катон-Карагайского сельского округа Катон-Карагайского района Восточно-Казахстанской области от 10 апреля 2023 года № 4
title:
  rus: О снятии ветеринарного карантина и отмене решения акима Катон-Карагайского сельского округа Катон - Карагайского района Восточно-Казахстанской области от 13 марта 2023 года № 3 «Об установлении карантина в селах Шынгыстай, Жана Ульго Катон-Карагайского сельского округа Катон-Карагайского района Восточно-Казахстанской области»
  kaz: Ветеринариялық карантинді алу және «Шығыс Қазақстан облысы Катонқарағай ауданы Катонқарағай ауылдық округінің Шыңғыстай, Жаңа Үлгі  ауылдарында карантин белгілеу туралы» Шығыс Қазақстан облысы Катонқарағай ауданы Катонқарағай ауылдық округі әкімінің 2023 жылғы 13 наурыздағы № 3 шешімін жою туралы
