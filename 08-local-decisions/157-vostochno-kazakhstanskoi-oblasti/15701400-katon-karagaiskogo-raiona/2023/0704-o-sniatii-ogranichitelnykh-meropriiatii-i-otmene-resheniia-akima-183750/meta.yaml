act_code: '183750'
requisite: Решение акима Солоновского сельского округа Катон-Карагайского района Восточно-Казахстанской области от 4 июля 2023 года № 4
title:
  rus: О снятии ограничительных мероприятий и отмене решения акима Солоновского сельского округа Катон – Карагайского района Восточно-Казахстанской области от 27 апреля 2023 года № 2 "Об установлении ограничительных мероприятий в частном подворье по улице Казахстан №11 села Малонарымка Солоновского сельского округа Восточно-Казахстанской области
  kaz: Шектеу іс-шараларын тоқтату және "Шығыс Қазақстан облысы Катонқарағай ауданы Солоновка ауылдық округінің Малонарым ауылындағы Қазақстан көшесіндегі №11 үйге шектеу іс - шараларын белгілеу туралы" Шығыс Қазақстан облысы Катонқарағай ауданы Солоновка ауылдық округі әкімінің 2023 жылғы 27 сәуірдегі № 2 шешімін жою туралы
