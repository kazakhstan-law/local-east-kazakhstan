act_code: '42134'
requisite: Шығыс Қазақстан облысы Катонқарағай аудандық мәслихатының 2008 жылғы 15 қазандағы № 8/95-IV шешімі. Шығыс Қазақстан облысы Әділет департаментінің Катонқарағай аудандық Әділет басқармасында 2008 жылғы 3 қарашада № 5-13-50 тіркелді. Күші жойылды - Катонқарағай аудандық мәслихатының 2012 жылғы 15 маусымдағы № 4/33-V шешімімен
