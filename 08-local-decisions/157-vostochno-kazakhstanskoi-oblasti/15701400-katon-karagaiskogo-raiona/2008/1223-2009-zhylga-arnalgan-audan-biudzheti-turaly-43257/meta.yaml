act_code: '43257'
requisite: Шығыс Қазақстан облысы Катонқарағай аудандық мәслихатының 2008 жылғы 23 желтоқсандағы N 9/98-IV шешімі. Шығыс Қазақстан облысы Әділет департаментінің Катонқарағай аудандық Әділет басқармасында 2008 жылғы 30 желтоқсанда № 5-13-51 тіркелді. Шешімнің қабылдау мерзімінің өтуіне байланысты қолдану тоқтатылды - Катонқарағай аудандық мәслихатының 2010 жылғы 11 қаңтардағы № 09 хатымен
