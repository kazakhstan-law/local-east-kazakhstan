act_code: '43475'
requisite: Шығыс Қазақстан облысы Катонқарағай аудандық әкімдігінің 2008 жылғы 30 желтоқсандағы № 134 шешімі. Шығыс Қазақстан облысы Әділет департаментінің Катонқарағай аудандық Әділет басқармасында 2009 жылғы 14 қаңтарда № 5-13-54 тіркелді. Күші жойылды - қабылданған мерзімінің бітуіне байланысты Катонқарағай ауданы әкімінің аппаратының 2009 жылғы 10 тамыздағы № 488 хатымен
title:
  rus: «2009 жылы Катонқарағай ауданының қорғаныс істері жөніндегі бөліміндегі шақыру учаскесіне 17 жасқа толатын еркек жынысты жасөспірімдерді есепке алу туралы»
