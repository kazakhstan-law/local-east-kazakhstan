  title:
    rus: О внесении изменения в решение Катон-Карагайского районного маслихата от 24 декабря 2018 года № 24/206-VI «Об определении мер социальной поддержки специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса прибывшим для работы и проживания в сельские населенные пункты Катон-Карагайского района на 2019 год»
    kaz: Катонқарағай аудандық мәслихатының 2018 жылы 24 желтоқсандағы № 24/206-VI «Катонқарағай ауданының ауылдық елдi мекендеріне жұмыс iстеу және тұру үшiн келген денсаулық сақтау, бiлiм беру, әлеуметтiк қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға 2019 жылы әлеуметтiк қолдау шараларын ұсыну туралы» шешіміне өзгеріс енгізу туралы
