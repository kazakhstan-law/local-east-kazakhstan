act_code: '128594'
requisite: Решение Катон-Карагайского районного маслихата Восточно-Казахстанской области от 24 декабря 2018 года № 24/206-VI. Зарегистрировано Управлением юстиции Катон-Карагайского района Департамента юстиции Восточно-Казахстанской области 14 января 2019 года № 5-13-157
title:
  rus: Об определении мер социальной поддержки специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания в сельские населенные пункты Катон-Карагайского района на 2019 год
  kaz: Катонқарағай ауданының ауылдық елдi мекендеріне жұмыс iстеу және тұру үшiн келген денсаулық сақтау, бiлiм беру, әлеуметтiк қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға 2019 жылы әлеуметтiк қолдау шараларын ұсыну туралы
