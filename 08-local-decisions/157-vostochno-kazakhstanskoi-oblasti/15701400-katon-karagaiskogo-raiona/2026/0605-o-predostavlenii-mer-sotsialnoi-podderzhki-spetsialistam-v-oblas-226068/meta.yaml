act_code: '226068'
requisite: Решение Катон-Карагайского районного маслихата Восточно-Казахстанской области от 5 июня 2026 года № 37/408-VIII
title:
  rus: О предоставлении мер социальной поддержки специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, государственным служащим аппаратов акимов сел, поселков, сельских округов,  прибывшим для работы и проживания в сельские населенные пункты Катон-Карагайского района на 2026 год
  kaz: Катонқарағай ауданының ауылдық елдi мекендерге жұмыс iстеуге және тұруға келген денсаулық сақтау, бiлiм беру, әлеуметтiк қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға, ауылдар, кенттер, ауылдық округтер әкімдері  аппараттарының мемлекеттік қызметшілеріне 2026 жылы әлеуметтiк қолдау шараларын ұсыну туралы
