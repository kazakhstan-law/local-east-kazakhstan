act_code: '109647'
requisite: Решение Катон-Карагайского районного маслихата Восточно-Казахстанской области от 23 декабря 2016 года № 8/60-VI. Зарегистрировано Департаментом юстиции Восточно-Казахстанской области 23 января 2017 года № 4840
title:
  rus: Об определении мер социальной поддержки специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса прибывшим для работы и проживания в сельские населенные пункты Катон-Карагайского района на 2017 год
  kaz: Катонқарағай ауданының ауылдық елдi мекендеріне жұмыс iстеу және тұру үшiн келген денсаулық сақтау, бiлiм беру, әлеуметтiк қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы  мамандарға 2017 жылы әлеуметтiк қолдау шараларын ұсыну туралы
