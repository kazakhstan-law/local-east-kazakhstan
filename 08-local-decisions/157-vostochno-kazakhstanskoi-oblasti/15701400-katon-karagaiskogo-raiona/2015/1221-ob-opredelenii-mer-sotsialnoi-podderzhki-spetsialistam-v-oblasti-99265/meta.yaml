requisite: Решение Катон-Карагайского районного маслихата Восточно-Казахстанской области от 21 декабря 2015 года № 35/280-V. Зарегистрировано Департаментом юстиции Восточно-Казахстанской области 22 января 2016 года № 4363. Утратило силу - решением Катон-Карагайского районного маслихата Восточно-Казахстанской области от 23 декабря 2016 года № 8/60-VI
title:
  rus: Об определении мер социальной поддержки специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса прибывшим для работы и проживания в сельские населенные пункты Катон-Карагайского района на 2016 год
  kaz: Катонқарағай ауданының ауылдық елдi мекендеріне жұмыс iстеу және тұру үшiн келген денсаулық сақтау, бiлiм беру, әлеуметтiк қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға 2016 жылы әлеуметтiк қолдау шараларын ұсыну туралы
