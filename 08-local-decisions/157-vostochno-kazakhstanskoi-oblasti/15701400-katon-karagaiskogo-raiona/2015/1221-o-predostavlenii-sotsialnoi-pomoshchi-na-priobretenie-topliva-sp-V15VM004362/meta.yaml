requisite: Решение Катон-Карагайского районного маслихата Восточно-Казахстанской области от 21 декабря 2015 года № 35/284-V. Зарегистрировано Департаментом юстиции Восточно-Казахстанской области 22 января 2016 года № 4362. Утратило силу решением Катон-Карагайского районного маслихата Восточно-Казахстанской области от 19 октября 2018 года № 21/188-VI
title:
  rus: О предоставлении социальной помощи на приобретение топлива специалистам государственных организаций здравоохранения, социального обеспечения, образования,культуры, спорта и ветеринарии, проживающим и работающим в сельских населенных пунктах Катон-Карагайского района
  kaz: Катонқарағай ауданының ауылдық елдi мекендерде тұратын және жұмыс істейтiн мемлекеттiк денсаулық сақтау, әлеуметтiк қамсыздандыру, білім беру, мәдениет, спорт және ветеринария ұйымдарының мамандарына отын сатып алу үшiн әлеуметтік көмек беру туралы
