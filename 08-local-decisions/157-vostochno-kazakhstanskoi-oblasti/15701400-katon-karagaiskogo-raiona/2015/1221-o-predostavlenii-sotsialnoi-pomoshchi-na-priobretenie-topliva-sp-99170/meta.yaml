  title:
    rus: О внесении изменения в решение Катон-Карагайского районного маслихата № 35/284-V от 21 декабря 2015 года «О предоставлении социальной помощи на приобретение топлива специалистам государственных организаций здравоохранения, социального обеспечения, образования, культуры, спорта и ветеринарии, проживающим и работающим в сельских населенных пунктах Катон-Карагайского района»
    kaz: «Катонқарағай ауданының ауылдық елдi мекендерде тұратын және жұмыс істейтiн мемлекеттiк денсаулық сақтау, әлеуметтiк қамсыздандыру, білім беру, мәдениет, спорт және ветеринария ұйымдарының мамандарына отын сатып алу үшiн әлеуметтік көмек беру туралы» Катонқарағай аудандық мәслихатының 2015 жылғы 21 желтоқсандағы № 35/284-V шешіміне өзгеріс енгізу туралы
