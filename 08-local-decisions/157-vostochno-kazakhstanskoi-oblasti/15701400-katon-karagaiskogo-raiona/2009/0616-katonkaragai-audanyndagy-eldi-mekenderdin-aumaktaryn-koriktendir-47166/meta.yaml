act_code: '47166'
requisite: Шығыс Қазақстан облысы Катонқарағай аудандық мәслихатының 2009 жылғы 16 маусымдағы № 13/132-IV шешімі. Шығыс Қазақстан облысы Әділет департаментінің Катонқарағай аудандық Әділет басқармасында 2009 жылғы 20 шілдеде № 5-13-61 болып тіркелді. Күші жойылды - Катонқарағай аудандық мәслихатының 2012 жылғы 15 маусымдағы № 4/33-V шешімімен
title:
  rus: Катонқарағай ауданындағы елді мекендердің аумақтарын көріктендіру, инфрақұрылым обьектілерін сақтау және жасыл желектерді күтіп ұстау мен қорғау Ережесін бекіту туралы
