act_code: '49572'
requisite: Шығыс Қазақстан облысы Катонқарағай аудандық мәслихатының 2009 жылғы 28 желтоқсандағы № 17/152-IV шешімі. Шығыс Қазақстан облысы Әділет департаментінің Катонқарағай аудандық әділет басқармасында 2009 жылғы 30 желтоқсанда № 5-13-66 тіркелді. Қолданылу мерзімінің өтуіне байланысты күші жойылды (Катонқарағай аудандық мәслихатының 2011 жылғы 23 ақпандағы № 57 хаты)
