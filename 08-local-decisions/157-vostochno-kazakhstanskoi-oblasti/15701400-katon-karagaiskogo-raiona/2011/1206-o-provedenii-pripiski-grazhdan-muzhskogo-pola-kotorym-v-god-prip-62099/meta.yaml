requisite: Решение акима Катон-Карагайского района Восточно-Казахстанской области от 6 декабря 2011 года № 19. Зарегистрировано управлением юстиции Катон-Карагайского района Департамента юстиции Восточно-Казахстанской области 23 декабря 2011 года за № 5-13-102. Утратило силу - решением акима Катон-Карагайского района ВКО от 12 марта 2012 года № 20
title:
  rus: О проведении приписки граждан мужского пола, которым в год приписки исполняется семнадцать лет, к призывному участку отдела по делам обороны Катон-Карагайского района в 2012 году
  kaz: Катонқарағай ауданының қорғаныс істері жөніндегі бөлімінің шақыру учаскесіне тіркелетін жылы он жеті жасқа толатын еркек жынысты азаматтарды 2012 жылы тіркеуді өткізу туралы
