requisite: Шығыс Қазақстан облысы Катонқарағай ауданы әкімінің 2011 жылғы 17 ақпандағы № 13 шешімі. Шығыс Қазақстан облысы Әділет департаментінің Катонқарағай аудандық әділет басқармасында 2011 жылғы 3 наурызда № 5-13-84 тіркелді. Күші жойылды - Катонқарағай ауданы әкімінің 2011 жылғы 29 шілдедегі № 17 шешімімен
