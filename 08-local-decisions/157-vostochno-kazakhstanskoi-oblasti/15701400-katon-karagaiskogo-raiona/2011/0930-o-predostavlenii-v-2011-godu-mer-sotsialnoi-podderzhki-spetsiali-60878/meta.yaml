requisite: Решение Катон-Карагайского районного маслихата Восточно-Казахстанской области от 30 сентября 2011 года № 31/291-IV. Зарегистрировано управлением юстиции Катон-Карагайского района Департамента юстиции Восточно-Казахстанской области 20 октября 2011 года за № 5-13-96. Прекращено действие по истечении срока, на который решение было принято (письмо Катон-Карагайского районного маслихата от 5 января 2012 года № 03)
title:
  rus: О предоставлении в 2011 году мер социальной поддержки специалистам  здравоохранения, образования, социального обеспечения, культуры и спорта, работающим и проживающим в сельских населенных пунктах района
  kaz: Ауданның ауылдық елдi мекендерінде жұмыс iстейтін және тұратын денсаулық  сақтау, бiлiм беру, әлеуметтiк қамсыздандыру, мәдениет және спорт мамандарына әлеуметтiк қолдау шараларын 2011 жылы ұсыну туралы
