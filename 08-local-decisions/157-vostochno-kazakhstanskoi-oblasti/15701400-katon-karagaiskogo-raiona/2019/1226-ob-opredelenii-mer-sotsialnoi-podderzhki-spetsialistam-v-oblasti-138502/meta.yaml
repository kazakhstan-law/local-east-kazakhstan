act_code: '138502'
requisite: Решение Катон-Карагайского районного маслихата Восточно-Казахстанской области от 26 декабря 2019 года № 35/308-VI. Зарегистрировано Департаментом юстиции Восточно-Казахстанской области 15 января 2020 года № 6527
title:
  rus: Об определении мер социальной поддержки специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса прибывшим для работы и проживания в сельские населенные пункты Катон-Карагайского района на 2020 год
  kaz: Катонқарағай ауданының ауылдық елдi мекендеріне жұмыс iстеу және тұру үшiн келген денсаулық сақтау, бiлiм беру, әлеуметтiк қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға 2020 жылы әлеуметтiк қолдау шараларын ұсыну туралы
