requisite: Шығыс Қазақстан облысы Катонқарағай аудандық мәслихатының 2007 жылғы 22 желтоқсандағы № 3/34-IV шешімі. Шығыс Қазақстан облысы Әділет департаментінің Катонқарағай аудандық Әділет басқармасында 2008 жылғы 4 қаңтарда № 5-13-37 тіркелді. Күші жойылды - Катонқарағай аудандық мәслихатының 2012 жылғы 19 желтоқсандағы № 9/69-V шешімімен
