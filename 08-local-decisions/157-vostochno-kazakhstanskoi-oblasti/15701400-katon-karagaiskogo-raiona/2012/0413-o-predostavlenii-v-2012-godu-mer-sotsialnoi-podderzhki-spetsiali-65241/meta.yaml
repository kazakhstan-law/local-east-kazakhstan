act_code: '65241'
requisite: Решение маслихата Катон-Карагайского района Восточно-Казахстанской области от 13 апреля 2012 года № 3/25-V. Зарегистрировано управлением юстиции Катон-Карагайского района Департамента юстиции Восточно-Казахстанской области 8 мая 2012 года за № 5-13-128. Прекращено действие по истечении срока, на который решение было принято (письмо маслихата Катон-Карагайского района от 30 мая 2014 года № 117)
title:
  rus: О предоставлении в 2012 году мер социальной поддержки специалистам  здравоохранения, образования, социального обеспечения, культуры и спорта, прибывшим для работы и проживания в сельские населенные пункты района
  kaz: Ауданның ауылдық елді мекендеріне жұмыс істеу және тұру үшін келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет және спорт мамандарына 2012 жылы әлеуметтік қолдау шараларын ұсыну туралы
