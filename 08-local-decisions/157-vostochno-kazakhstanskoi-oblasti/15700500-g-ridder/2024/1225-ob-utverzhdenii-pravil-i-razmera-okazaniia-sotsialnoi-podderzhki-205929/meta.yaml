act_code: '205929'
requisite: Решение Риддерского городского маслихата Восточно-Казахстанской области от 25 декабря 2024 года № 23/8-VIII. Зарегистрировано Департаментом юстиции Восточно-Казахстанской области 8 января 2025 года № 9126-16
title:
  rus: «Об утверждении Правил и размера оказания социальной поддержки по оплате коммунальных услуг и приобретению топлива за счет бюджетных средств специалистам государственных организаций здравоохранения, социального обеспечения, образования, культуры, спорта и ветеринарии, проживающим и работающим в сельских населенных пунктах города Риддер»
  kaz: «Риддер қаласының ауылдық елді мекендерінде тұратын және жұмыс істейтін мемлекеттік денсаулық сақтау, әлеуметтік қамсыздандыру, білім беру, мәдениет, спорт және ветеринария ұйымдарының мамандарына бюджет қаражаты есебінен коммуналдық қызметтерге ақы төлеу және отын сатып алу бойынша әлеуметтік қолдау көрсету Қағидалары мен мөлшерін бекіту туралы»
