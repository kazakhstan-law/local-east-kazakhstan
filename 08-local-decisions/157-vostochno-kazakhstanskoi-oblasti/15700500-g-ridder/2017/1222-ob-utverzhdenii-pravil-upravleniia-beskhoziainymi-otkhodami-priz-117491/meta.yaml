requisite: Решение Риддерского городского маслихата Восточно-Казахстанской области от 22 декабря 2017 года № 18/6-VI. Зарегистрировано Департаментом юстиции Восточно-Казахстанской области 8 января 2018 года № 5395. Утратило силу решением Риддерского городского маслихата Восточно-Казахстанской области от 28 сентября 2021 года № 7/10-VII (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования). Действие решения приостановлено до 1 января 2021 года решением Риддерского городского маслихата Восточно-Казахстанской области от 21 июля 2020 года № 45/5-VI (вступает в силу со дня принятия)
