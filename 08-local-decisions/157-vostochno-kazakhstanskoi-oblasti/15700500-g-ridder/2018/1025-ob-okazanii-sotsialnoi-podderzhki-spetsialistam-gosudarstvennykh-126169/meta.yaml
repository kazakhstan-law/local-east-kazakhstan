    kaz: Риддер қалалық мәслихатының 2018 жылғы 25 қазандағы № 25/8-VI «Риддер қаласының ауылдық елді мекендерінде тұратын және жұмыс істейтін мемлекеттік ұйымдардың мамандарына әлеуметтік қолдау көрсету туралы» шешіміне өзгеріс енгізу туралы
