act_code: '126169'
requisite: Решение Риддерского городского маслихата Восточно-Казахстанской области от 25 октября 2018 года № 25/8-VI. Зарегистрировано Управлением юстиции города Риддера Департамента юстиции Восточно-Казахстанской области 27 ноября 2018 года № 5-4-181. Действие решения приостановлено до 1 октября 2020 года решением Риддерского городского маслихата Восточно-Казахстанской области от 4 июня 2020 года № 43/4-VI (вступает в силу со дня принятия). Утратило силу решением Риддерского городского маслихата Восточно-Казахстанской области от 20 октября 2020 года № 48/3-VI (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
