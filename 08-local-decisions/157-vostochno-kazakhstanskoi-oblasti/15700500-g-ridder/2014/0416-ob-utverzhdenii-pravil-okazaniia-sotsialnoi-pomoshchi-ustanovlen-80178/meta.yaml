  title:
    rus: О внесении изменений и дополнения в решение Риддерского городского маслихата от 16 апреля 2014 года № 26/9-V «Об утверждении Правил оказания социальной помощи, установления размеров и определения перечня отдельных категорий нуждающихся граждан»
    kaz: Риддер қалалық мәслихатының 2014 жылғы 16 сәуірдегі № 26/9-V «Әлеуметтік көмек көрсетудің, мөлшерлерін белгілеудің және мұқтаж азаматтардың жекелеген санаттарының тізбесін айқындаудың қағидаларын бекіту туралы» шешіміне өзгерістер мен толықтыру енгізу туралы
