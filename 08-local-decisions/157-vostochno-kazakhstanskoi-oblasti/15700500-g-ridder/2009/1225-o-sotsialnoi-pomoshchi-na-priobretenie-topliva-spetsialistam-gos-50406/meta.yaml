requisite: Решение Риддерского городского маслихата Восточно-Казахстанской области от 25 декабря 2009 года № 21/5-IV. Зарегистрировано управлением юстиции города Риддера Департамента юстиции Восточно-Казахстанской области 27 января 2010 года за № 5-4-125. Утратило силу - решением Риддерского городского маслихата от 21 декабря 2012 года № 11/8-V
title:
  rus: О социальной помощи на приобретение топлива специалистам государственных организаций здравоохранения, социального обеспечения, образования, культуры и спорта, проживающим и работающим в сельских населенных пунктах
  kaz: Ауылдық елді мекендерде тұратын және жұмыс істейтін мемлекеттік денсаулық сақтау, әлеуметтік қамсыздандыру, білім беру, мәдениет және спорт ұйымдарының мамандарына отын сатып алуға әлеуметтік көмек туралы
