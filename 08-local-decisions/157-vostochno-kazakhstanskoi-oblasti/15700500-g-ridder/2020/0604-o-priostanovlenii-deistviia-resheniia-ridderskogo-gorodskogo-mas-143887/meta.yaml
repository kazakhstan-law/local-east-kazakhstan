requisite: Решение Риддерского городского маслихата Восточно-Казахстанской области от 4 июня 2020 года № 43/4-VI. Зарегистрировано Департаментом юстиции Восточно-Казахстанской области 17 июня 2020 года № 7196. Утратило силу решением Риддерского городского маслихата Восточно-Казахстанской области от 20 октября 2020 года № 48/3-VI (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: О приостановлении действия решения Риддерского городского маслихата от 25 октября 2018 года №25/8-VI «Об оказании социальной поддержки специалистам государственных организаций, проживающим и работающим в сельских населённых пунктах города Риддера»
  kaz: Риддер қалалық мәслихатының 2018 жылғы 25 қазандағы № 25/8-VI «Риддер қаласының ауылдық елді мекендерінде тұратын және жұмыс істейтін мемлекеттік ұйымдардың мамандарына әлеуметтік қолдау көрсету туралы» шешімінің қолданысын тоқтату туралы
