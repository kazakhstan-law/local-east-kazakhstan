act_code: '145170'
requisite: Решение Риддерского городского маслихата Восточно-Казахстанской области от 21 июля 2020 года № 45/5-VI. Зарегистрировано Департаментом юстиции Восточно-Казахстанской области 29 июля 2020 года № 7417. Утратило силу решением Риддерского городского маслихата Восточно-Казахстанской области от 28 сентября 2021 года № 7/10-VII (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: О приостановлении действия решения Риддерского городского маслихата от 22 декабря 2017 года № 18/6-VI «Об утверждении правил управления бесхозяйными отходами, признанными решением суда поступившими в коммунальную собственность города Риддера»
  kaz: Риддер қалалық мәслихатының 2017 жылғы 22 желтоқсандағы № 18/6-VI «Сот шешімімен Риддер қаласының коммуналдық меншігіне түскен болып танылған иесіз қалдықтарды басқару қағидаларын бекіту туралы» шешімінің қүшін тоқтата туралы
