requisite: Решение маслихата района Самар Восточно-Казахстанской области от 28 ноября 2023 года № 7-5/VIII. Зарегистрировано Департаментом юстиции Восточно-Казахстанской области 4 декабря 2023 года № 8924-16. Утратило силу решением маслихата района Самар Восточно-Казахстанской области от 2 мая 2024 года № 11-3/VIII (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об определении специализированных мест для организации и проведения мирных собраний, порядка их использования, норм их предельной заполняемости, требований к их материально-техническому и организационному обеспечению, границ прилегающих территорий, в которых запрещено проведение пикетирования в районе Самар
  kaz: Самар ауданында бейбіт жиналыстарды ұйымдастыру және өткізу үшін арнайы орындарды, оларды пайдалану тәртібін, олардың шекті толу нормаларын, оларды материалдық-техникалық және ұйымдастырушылық қамтамасыз етуге қойылатын талаптарды, пикеттеуді өткізуге тыйым салынған іргелес аумақтардың шекараларын айқындау туралы
