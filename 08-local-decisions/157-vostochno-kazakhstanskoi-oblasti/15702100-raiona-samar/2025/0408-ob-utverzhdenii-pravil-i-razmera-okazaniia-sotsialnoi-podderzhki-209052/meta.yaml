act_code: '209052'
requisite: Решение маслихата района Самар Восточно-Казахстанской области от 8 апреля 2025 года № 20-7/VIII. Зарегистрировано Департаментом юстиции Восточно-Казахстанской области 11 апреля 2025 года № 9172-16
title:
  rus: Об утверждении Правил и размера оказания социальной поддержки по оплате коммунальных услуг и приобретению топлива за счет бюджетных средств специалистам государственных организаций здравоохранения, социального обеспечения, образования, культуры, спорта и ветеринарии, проживающим и работающим в сельских населенных пунктах района Самар
  kaz: Самар ауданының ауылдық елді мекендерінде тұратын және жұмыс істейтін денсаулық сақтау, әлеуметтік қамсыздандыру, білім беру, мәдениет, спорт және ветеринария мемлекеттік ұйымдарының мамандарына бюджет қаражаты есебінен коммуналдық көрсетілетін қызметтерге ақы төлеу және отын сатып алу бойынша әлеуметтік қолдау көрсету Қағидалары мен мөлшерін бекіту туралы
