  title:
    rus: О внесении изменения в решение маслихата района Самар Восточно-Казахстанской области от 25 декабря 2024 года № 18-13/VIIІ «Об утверждении норм образования и накопления коммунальных отходов, тарифов на сбор, транспортировку, сортировку и захоронение твердых бытовых отходов по району Самар»
