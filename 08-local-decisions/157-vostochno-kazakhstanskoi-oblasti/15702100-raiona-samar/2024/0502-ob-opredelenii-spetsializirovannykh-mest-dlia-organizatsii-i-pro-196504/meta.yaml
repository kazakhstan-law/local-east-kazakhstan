act_code: '196504'
requisite: Решение маслихата района Самар Восточно-Казахстанской области от 2 мая 2024 года № 11-3/VIII. Зарегистрировано Департаментом юстиции Восточно-Казахстанской области 4 мая 2024 года № 9015-16
title:
  rus: Об определении специализированных мест для организации и проведения мирных собраний и норм их предельной заполняемости, требований к их материально-техническому и организационному обеспечению, порядка их использования, границ прилегающих территории, в которых запрещено проведение пикетирования по району Самар
  kaz: Самар ауданы бойынша бейбіт жиналыстарды ұйымдастыру және өткізу үшін арнайы орындарды және олардың шекті толу нормаларын, оларды материалдық техникалық және ұйымдастырушылық қамтамасыз етуге қойылатын талаптарды, пайдалану тәртібін, пикеттеуді өткізуге тыйым салынған іргелес аумақтардың шекараларын айқындау туралы
