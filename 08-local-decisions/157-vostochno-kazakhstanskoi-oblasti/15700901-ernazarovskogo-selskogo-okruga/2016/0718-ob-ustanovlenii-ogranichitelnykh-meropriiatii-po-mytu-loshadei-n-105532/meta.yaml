requisite: Решение акима Ерназаровского сельского округа Бескарагайского района Восточно-Казахстанской области от 18 июля 2016 года № 2. Зарегистрировано Департаментом юстиции Восточно-Казахстанской области 5 августа 2016 года № 4628. Утратило силу - решением акима Ерназаровского сельского округа Бескарагайского района Восточно-Казахстанской области от 6 января 2017 года № 1
title:
  rus: Об установлении ограничительных мероприятий по мыту лошадей на территории крестьянского хозяйства «Мукинов» в участке Мойылды Ерназаровского сельского округа Бескарагайского района Восточно-Казахстанской области
  kaz: Шығыс Қазақстан облысы Бесқарағай ауданы Ерназар ауылдық округінің Мойылды учаскесінің «Мукинов» шаруа қожалығының аумағында жылқылардың сақау ауруы бойынша шектеу іс-шараларын белгілеу туралы
