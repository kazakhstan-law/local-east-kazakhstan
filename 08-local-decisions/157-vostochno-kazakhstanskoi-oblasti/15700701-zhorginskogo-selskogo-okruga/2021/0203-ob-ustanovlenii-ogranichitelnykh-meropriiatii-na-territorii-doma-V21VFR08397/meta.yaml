  title:
    rus: О снятии ограничительных мероприятий и признании утратившим силу решение акима Нарынского сельского округа от 3 февраля 2021 года № 4 «Об установлении ограничительных мероприятий на территории дома № 5 по улице Жана ауыл села Шынкожа Нарынского сельского округа Аягозского района»
    kaz: Шектеу іс-шараларын тоқтату және «Аягөз ауданы Нарын ауылдық округі Шынқожа ауылы Жаңа ауыл көшесі № 5 үйдің аумағына шектеу іс-шараларын белгілеу туралы» Нарын ауылдық округі әкімінің 2021 жылғы 3 ақпандағы № 4 шешімінің күші жойылды деп тану туралы
