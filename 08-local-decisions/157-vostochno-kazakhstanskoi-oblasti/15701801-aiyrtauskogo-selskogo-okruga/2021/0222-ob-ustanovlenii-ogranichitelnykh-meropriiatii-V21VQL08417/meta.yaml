  title:
    rus: О снятии ограничительных мероприятии и признании утратившим силу решения акима Бозанбайского сельского округа от 22 февраля 2021 года № 4 «Об установлении ограничительных мероприятий в связи со вспышкой заболевания эмфизематозного карбункула крупного рогатого скота крестьянского хозяйства «Куандык» Бозанбайского сельского округа Уланского района»
    kaz: Шектеу іс-шараларын алу және «Ұлан ауданы Бозанбай ауылдық округі «Куандык» шаруа қожалығының ірі қара малынан қарасан ауруы шығуына байланысты шектеу іс-шараларын белгілеу туралы» Бозанбай ауылдық округі әкімінің 2021 жылғы 22 ақпандағы № 4 шешімінің күші жойылды деп тану туралы
