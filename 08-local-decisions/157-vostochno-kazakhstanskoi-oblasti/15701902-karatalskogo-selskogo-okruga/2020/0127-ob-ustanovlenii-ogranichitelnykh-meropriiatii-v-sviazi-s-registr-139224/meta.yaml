requisite: Решение акима Маканчинского сельского округа Урджарского района Восточно-Казахстанской области от 27 января 2020 года № 8. Зарегистрировано Департаментом юстиции Восточно-Казахстанской области 30 января 2020 года № 6715. Утратило силу решением акима Маканчинского сельского округа Урджарского района Восточно-Казахстанской области от 29 мая 2020 года № 39 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об установлении ограничительных мероприятий в связи с регистрацией бруцеллеза среди крупного рогатого скота в крестьянском хозяйстве «Дина» в Маканчинском сельском округе Урджарского района
  kaz: Үржар ауданы Мақаншы ауылдық округіне қарасты «Дина» шаруа қожалғында ірі қара малдары арасында бруцеллез індеті тіркелуіне байланысты шектеу іс шараларын белгілеу туралы
