  title:
    rus: О внесении изменений в решение Уланского районного маслихата от 27 декабря 2021 года № 98 «Об определении порядка и размера возмещения затрат на обучение на дому детей с ограниченными возможностями из числа детей с инвалидностью по индивидуальному учебному плану в Уланском районе»
    kaz: Ұлан аудандық мәслихатының 2021 жылғы 27 желтоқсандағы № 98 «Ұлан ауданында мүгедектігі бар балалар қатарындағы кемтар балаларды жеке оқыту жоспары бойынша үйде оқытуға жұмсаған шығындарын өндіріп алу тәртібін және мөлшерін айқындау туралы» шешіміне өзгерістер енгізу туралы
