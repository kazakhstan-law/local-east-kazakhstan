act_code: '226829'
requisite: Решение акима Уланского района Восточно-Казахстанской области от 24 июня 2026 года № 1
title:
  rus: Об объявлении чрезвычайной ситуации природного характера объектового масштаба на территории в пределах водохранилища плотины пруда на реке Уланка в 1 километре выше села Герасимовка, Уланского районаВосточно-Казахстанской области
  kaz: Шығыс Қазақстан облысы Ұлан ауданы Герасимовка ауылынан 1 километр жоғары орналасқан Ұлан өзеніңде су қоймасы тоған бөгетінің шегіндегі аумақта объектілік ауқымдағы табиғи сипаттағы төтенше жағдай жариялау туралы
