requisite: Решение Уланского районного маслихата Восточно-Казахстанской области от 17 июня 2020 года № 386. Зарегистрировано Департаментом юстиции Восточно-Казахстанской области 8 июля 2020 года № 7276
title:
  rus: О приостановлении действия решения Уланского районного маслихата от 4 декабря 2017 года № 133 «Об утверждении правил управления бесхозяйными отходами, признанными решением суда, поступившими в коммунальную собственность Уланского района»
  kaz: Ұлан ауданы мәслихатының 2017 жылғы 4 желтоқсандағы № 133 «Сот шешімімен Ұлан ауданының коммуналдық меншігіне түскен болып танылған иесіз қалдықтарды басқару қағидаларын бекіту туралы» шешімінің қолданылуы 2021 жылдың 1 қаңтарына дейін тоқтатылу туралы
