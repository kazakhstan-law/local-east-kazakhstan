act_code: '148494'
requisite: Решение Уланского районного маслихата Восточно-Казахстанской области от 21 октября 2020 года № 404. Зарегистрировано Департаментом юстиции Восточно-Казахстанской области 11 ноября 2020 года № 7790. Утратило силу решением Уланского районного маслихата Восточно-Казахстанской области от 23 августа 2024 года № 159 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об определении специализированных мест для организации и проведения мирных собраний, порядка их использования, норм их предельной заполняемости, требований к их материально-техническому и организационному обеспечению, границ прилегающих территорий, в которых запрещено проведение пикетирования по Уланскому району
  kaz: Ұлан ауданы бойынша бейбіт жиналыстарды ұйымдастыру және өткізу үшін арнайы орындарды, оларды пайдалану тәртібін, олардың шекті толу нормаларын, олардың материалдық-техникалық және ұйымдастырушылық қамтамасыз етуге қойылатын талаптарды, пикеттеуді өткізуге тыйым салынған іргелес аумақтардың шекараларын айқындау туралы
