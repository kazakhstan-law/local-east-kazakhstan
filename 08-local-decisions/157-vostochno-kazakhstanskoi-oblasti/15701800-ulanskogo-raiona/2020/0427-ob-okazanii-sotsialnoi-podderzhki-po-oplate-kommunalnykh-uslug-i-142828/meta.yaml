act_code: '142828'
requisite: Решение Уланского районного маслихата Восточно-Казахстанской области от 27 апреля 2020 года № 376. Зарегистрировано Департаментом юстиции Восточно-Казахстанской области 15 мая 2020 года № 7063. Утратило силу решением Уланского районного маслихата Восточно-Казахстанской области от от 21 февраля 2022 года № 129 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об оказании социальной поддержки по оплате коммунальных услуг и приобретению топлива за счет бюджетных средств специалистам государственных организаций здравоохранения, социального обеспечения, образования, культуры, спорта и ветеринарии, проживающим и работающим в сельских населенных пунктах Уланского района
  kaz: Ұлан ауданының ауылдық елді мекендерінде тұратын және Ұлан ауданының ауылдық елді мекендерінде тұратын және жұмыс істейтін мемлекеттік денсаулық сақтау, әлеуметтік қамсыздандыру, білім беру, мәдениет, спорт және ветеринария ұйымдарының мамандарына бюджет қаражаты есебiнен көрсетілетін коммуналдық қызметтерге ақы төлеу және отын сатып алу бойынша әлеуметтік қолдау көрсету туралы
