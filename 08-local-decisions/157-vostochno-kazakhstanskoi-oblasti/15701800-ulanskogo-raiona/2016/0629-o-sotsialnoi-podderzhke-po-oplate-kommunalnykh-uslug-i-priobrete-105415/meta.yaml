  requisite: Решение Уланского районного маслихата Восточно-Казахстанской области от 26 декабря 2019 года № 334. Зарегистрировано Департаментом юстиции Восточно-Казахстанской области 15 января 2020 года № 6504. Утратило силу решением Уланского районного маслихата Восточно-Казахстанской области от от 21 февраля 2022 года № 129 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
  title:
    rus: О внесении изменений в решение Уланского районного маслихата от 29 июня 2016 года № 37 «О социальной поддержке по оплате коммунальных услуг и приобретению топлива за счет бюджетных средств специалистам государственных организаций здравоохранения, социального обеспечения, образования, культуры, спорта и ветеринарии, проживающим и работающим в сельских населенных пунктах Уланского района»"
    kaz: Ұлан аудандық мәслихатының 2016 жылғы 29 маусымдағы № 37 «Ұлан ауданының ауылдық елдi мекендерде тұратын және жұмыс істейтiн мемлекеттiк денсаулық сақтау, әлеуметтiк қамсыздандыру, білім беру, мәдениет, спорт және ветеринария ұйымдарының мамандарына бюджет қаражаты есебiнен коммуналдық көрсетілетін қызметтерге ақы төлеу және отын сатып алу бойынша әлеуметтік қолдау туралы» шешіміне өзгерістер енгізу туралы" шешімі
