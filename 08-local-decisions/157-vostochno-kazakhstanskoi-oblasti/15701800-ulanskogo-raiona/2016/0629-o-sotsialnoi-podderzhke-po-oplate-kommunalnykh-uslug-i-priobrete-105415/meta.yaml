act_code: '105415'
requisite: Решение Уланского районного маслихата Восточно-Казахстанской области от 29 июня 2016 года № 37. Зарегистрировано Департаментом юстиции Восточно-Казахстанской области 28 июля 2016 года № 4615. Утратило силу решением Уланского районного маслихата Восточно-Казахстанской области от 27 апреля 2020 года № 376 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: О социальной поддержке по оплате коммунальных услуг и приобретению топлива за счет бюджетных средств специалистам государственных организаций здравоохранения, социального обеспечения, образования, культуры, спорта и ветеринарии, проживающим и работающим в сельских населенных пунктах Уланского района
  kaz: Ұлан ауданының ауылдық елдi мекендерде тұратын және жұмыс істейтiн мемлекеттiк денсаулық сақтау, әлеуметтiк қамсыздандыру, білім беру, мәдениет, спорт және ветеринария ұйымдарының мамандарына бюджет қаражаты есебiнен коммуналдық көрсетілетін қызметтерге ақы төлеу және отын сатып алу бойынша әлеуметтік қолдау туралы
