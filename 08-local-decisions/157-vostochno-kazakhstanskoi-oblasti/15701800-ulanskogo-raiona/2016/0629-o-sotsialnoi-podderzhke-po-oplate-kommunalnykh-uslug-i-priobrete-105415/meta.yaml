caused_by:
  code: '125713'
  requisite: Решение Уланского районного маслихата Восточно-Казахстанской области от 11 октября 2018 года № 236. Зарегистрировано Управлением юстиции Уланского района Департамента юстиции Восточно-Казахстанской области 2 ноября 2018 года № 5-17-202. Утратило силу решением Уланского районного маслихата Восточно-Казахстанской области от от 21 февраля 2022 года № 129 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
  title:
    rus: О внесении изменений и дополнений в решение Уланского районного маслихата от 29 июня 2016 года  № 37 «Об оказании социальной помощи специалистам здравоохранения, социального обеспечения, образования, культуры, спорта и ветеринарной службы, проживающим и работающим в сельских населенных пунктах, на приобретение топлива и покрытие расходов на коммунальные услуги»
    kaz: Ұлан аудандық мәслихатының 2016 жылғы 29 маусымдағы № 37 «Ұлан ауданының ауылдық елді мекендерінде тұратын және жұмыс істейтін мемлекеттік денсаулық сақтау, әлеуметтік қамсыздандыру, білім беру, мәдениет, спорт және ветеринария ұйымдарының мамандарына отын сатып алуға және коммуналдық қызмет шығындарын жабуға әлеуметтік көмек беру туралы» шешіміне өзгерістер мен толықтырулар енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/125713/rus
