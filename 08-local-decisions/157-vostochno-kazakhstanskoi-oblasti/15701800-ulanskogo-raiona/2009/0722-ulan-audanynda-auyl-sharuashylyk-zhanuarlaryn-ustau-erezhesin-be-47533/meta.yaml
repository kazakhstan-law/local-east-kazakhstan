act_code: '47533'
requisite: Шығыс Қазақстан облысы Ұлан аудандық мәслихатының 2009 жылғы 22 шілдедегі № 137 шешімі. Шығыс Қазақстан облысы Әділет департаментінің Ұлан аудандық Әділет басқармасында 2009 жылғы 26 тамызда № 5-17-108 тіркелді. Күші жойылды - Ұлан аудандық мәслихатының 2012 жылғы 13 шілдедегі № 54 шешімімен
