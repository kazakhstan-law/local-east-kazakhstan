act_code: '49836'
requisite: Шығыс Қазақстан облысы Ұлан ауданы әкімінің 2009 жылғы 29 желтоқсандағы № 9 шешімі. Шығыс Қазақстан облысы Әділет департаментінің Ұлан аудандық әділет басқармасында 2010 жылғы 12 қаңтарда № 5-17-123 тіркелді. Шешімнің қабылдау мерзімінің өтуіне байланысты қолдану тоқтатылды - Ұлан аудандық әкімдігінің 2010 жылғы 30 маусымдағы № 05/2488 хаты
title:
