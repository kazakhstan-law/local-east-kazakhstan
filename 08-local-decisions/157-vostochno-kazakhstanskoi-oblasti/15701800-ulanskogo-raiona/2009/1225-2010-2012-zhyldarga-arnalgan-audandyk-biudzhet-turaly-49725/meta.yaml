act_code: '49725'
requisite: Шығыс Қазақстан облысы Ұлан аудандық мәслихатының 2009 жылғы 25 желтоқсандағы № 162 шешімі. Шығыс Қазақстан облысы Әділет департаментінің Ұлан аудандық Әділет басқармасында 2010 жылғы 11 қаңтарда № 5-17-122 тіркелді. Қабылданған мерзімінің бітуіне байланысты күші жойылды - Ұлан аудандық мәслихатының 2011 жылғы 13 қаңтардағы № 7 хаты
