requisite: Решение Уланского районного маслихата Восточно-Казахстанской области от 4 декабря 2017 года № 133. Зарегистрировано Департаментом юстиции Восточно-Казахстанской области 12 декабря 2017 года № 5332.  Утратило силу решением Уланского районного маслихата Восточно-Казахстанской области от 21 февраля 2022 года № 133 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования). Действие решения приостановлено до 1 января 2021 года решением Уланского районного маслихата Восточно-Казахстанской области от 17 июня 2020 года № 386 (вступает в силу со дня принятия)
