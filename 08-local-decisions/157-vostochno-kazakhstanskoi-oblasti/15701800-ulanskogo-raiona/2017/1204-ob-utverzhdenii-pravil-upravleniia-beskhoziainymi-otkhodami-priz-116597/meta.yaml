    kaz: Ұлан ауданы мәслихатының 2017 жылғы 4 желтоқсандағы № 133 «Сот шешімімен Ұлан ауданының коммуналдық меншігіне түскен болып танылған иесіз қалдықтарды басқару қағидаларын бекіту туралы» шешімінің қолданылуы 2021 жылдың 1 қаңтарына дейін тоқтатылу туралы
