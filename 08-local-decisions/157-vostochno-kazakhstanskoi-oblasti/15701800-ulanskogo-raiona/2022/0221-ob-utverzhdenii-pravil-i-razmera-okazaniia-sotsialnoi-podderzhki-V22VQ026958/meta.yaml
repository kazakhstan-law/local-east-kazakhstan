  title:
    rus: О внесении изменения в решение Уланского районного маслихата от 21 февраля 2022 года № 129 «Об утверждении Правил и размера оказания социальной поддержки по оплате коммунальных услуг и приобретению топлива за счет бюджетных средств специалистам государственных организаций здравоохранения, социального обеспечения, образования, культуры, спорта и ветеринарии, проживающим и работающим в сельских населенных пунктах Уланского района»
    kaz: Ұлан аудандық мәслихатының 2022 жылғы 21 ақпандағы № 129 «Ұлан ауданының ауылдық елді мекендерінде тұратын және жұмыс істейтін мемлекеттік денсаулық сақтау, әлеуметтік қамсыздандыру, білім беру, мәдениет, спорт және ветеринария ұйымдарының мамандарына бюджет қаражаты есебiнен коммуналдық көрсетілетін қызметтерге ақы төлеу және отын сатып алу бойынша әлеуметтік қолдау көрсету Қағидасын және мөлшерін бекіту туралы» шешіміне өзгеріс енгізу туралы
