requisite: Решение акима Уланского района Восточно-Казахстанской области от 29 декабря 2011 года № 10. Зарегистрировано управлением юстиции Уланского района Департамента юстиции Восточно-Казахстанской области 16 января 2012 года за № 5-17-161. Утратило силу (письмо аппарата акима Уланского района от 7 мая 2012 года № 04/04-20-1940)
title:
