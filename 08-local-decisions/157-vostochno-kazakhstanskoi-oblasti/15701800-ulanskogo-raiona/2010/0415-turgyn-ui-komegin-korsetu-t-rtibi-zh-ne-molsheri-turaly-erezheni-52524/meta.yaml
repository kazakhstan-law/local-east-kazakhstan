requisite: Шығыс Қазақстан облысы Ұлан аудандық мәслихатының 2010 жылғы 15 сәуірдегі № 181 шешімі. Шығыс Қазақстан облысы Әділет департаментінің Ұлан аудандық Әділет басқармасында 2010 жылғы 19 мамырда № 5-17-129 тіркелді. Күші жойылды - Ұлан аудандық мәслихатының 2014 жылғы 30 маусымдағы № 203 шешімімен
