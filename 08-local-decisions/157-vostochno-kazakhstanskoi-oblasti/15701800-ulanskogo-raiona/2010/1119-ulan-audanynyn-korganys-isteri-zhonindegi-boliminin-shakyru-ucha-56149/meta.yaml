act_code: '56149'
requisite: Шығыс Қазақстан облысы Ұлан ауданы әкімінің 2010 жылғы 19 қарашадағы № 2 шешімі. Шығыс Қазақстан облысы Әділет департаментінің Ұлан аудандық әділет басқармасында 2010 жылғы 26 желтоқсанда № 5-17-140 тіркелді. Шешім қамтылған тапсырмаларды орындауына байланысты қолданылуы тоқтатылды (Ұлан ауданы әкімінің 2011 жылғы 11 мамырдағы № 05/1623 хаты)
title:
  rus: Ұлан ауданының қорғаныс істері жөніндегі бөлімінің шақыру учаскесіне 2011  жылы он жеті жасқа толатын еркек жынысты азаматтарды тіркеуді өткізу туралы
