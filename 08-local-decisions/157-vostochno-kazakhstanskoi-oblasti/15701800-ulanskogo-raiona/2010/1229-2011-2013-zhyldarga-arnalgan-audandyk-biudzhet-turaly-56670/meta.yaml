act_code: '56670'
requisite: Шығыс Қазақстан облысы Ұлан аудандық мәслихатының 2010 жылғы 29 желтоқсандағы № 220 шешімі. Шығыс Қазақстан облысы Әділет департаментінің Ұлан аудандық әділет басқармасында 2010 жылғы 31 желтоқсанда № 5-17-143 тіркелді. Күші жойылды (ШҚО Ұлан аудандық мәслихатының 2011 жылғы 23 желтоқсандағы № 214 хаты)
