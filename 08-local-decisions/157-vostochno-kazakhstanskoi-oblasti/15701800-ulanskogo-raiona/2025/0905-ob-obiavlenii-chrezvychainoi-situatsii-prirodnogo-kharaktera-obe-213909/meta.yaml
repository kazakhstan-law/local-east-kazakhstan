title:
  rus: Об объявлении чрезвычайной ситуации природного характера объектового масштаба на территории в пределах плотины водохранилища на реке Дресвянка расположенного южнее 9 километра села Каменка, Уланского района Восточно-Казахстанской области
  kaz: Шығыс Қазақстан облысы Ұлан ауданы Каменка ауылынаң 9 километр оңтүстікке қарай орналасқан Дресвянка өзеніңде су қоймасы бөгетінің шегіндегі аумақта объектілік ауқымдағы табиғи сипаттағы төтенше жағдай жариялау туралы
