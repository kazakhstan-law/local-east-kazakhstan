title:
  rus: Об объявлении чрезвычайной ситуации природного характера объектового масштаба на территории в пределах плотины водохранилища на реке Аблакетка расположенного в 3,5 километра севернее села Мамай батыр  Уланского района Восточно-Казахстанской области
  kaz: Шығыс Қазақстан облысы Ұлан ауданы Мамай батыр ауылынан 3,5 километр солтүстікке қарай орналасқан Аблакет өзеніңде су қоймасы бөгетінің шегіндегі аумақта объектілік ауқымдағы табиғи сипаттағы төтенше жағдай жариялау туралы
