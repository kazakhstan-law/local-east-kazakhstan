requisite: Решение Уланского районного маслихата Восточно-Казахстанской области от 28 марта 2014 года № 179. Зарегистрировано Департаментом юстиции Восточно-Казахстанской области 21 апреля 2014 года № 3241. Утратило силу решением Уланского районного маслихата Восточно-Казахстанской области от от 21 февраля 2022 года № 132 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
