act_code: '43399'
requisite: Шығыс Қазақстан облысы Ұлан аудандық мәслихатының 2008 жылғы 25 желтоқсандағы № 86 шешімі. Шығыс Қазақстан облысы Әділет департаментінің Ұлан аудандық Әділет басқармасында 2009 жылғы 6 қаңтарда № 5-17-95 тіркелді. Шешімнің қабылдау мерзімінің өтуіне байланысты қолдану тоқтатылды - Ұлан аудандық мәслихаты аппаратының 2009 жылғы 31 желтоқсандағы № 220 хатымен
