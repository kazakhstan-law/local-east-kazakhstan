act_code: '155434'
requisite: Решение маслихата города Семей Восточно-Казахстанской области от 8 апреля 2021 года № 7/50-VII. Зарегистрировано Департаментом юстиции Восточно-Казахстанской области 20 апреля 2021 года № 8656
title:
  rus: О предоставлении мер социальной поддержки на 2021 год специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта, агропромышленного комплекса и государственным служащим аппаратов акимов сел, поселков, сельских округов, прибывшим для работы и проживания в сельские населенные пункты города Семей
  kaz: Семей қаласының ауылдық елдi мекендеріне жұмыс iстеу және тұру үшiн келген денсаулық сақтау, бiлiм беру, әлеуметтiк қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға, ауылдар, кенттер, ауылдық округтер әкімдері аппараттарының мемлекеттік қызметшілеріне 2021 жылға арналған әлеуметтiк қолдау шараларын ұсыну туралы
