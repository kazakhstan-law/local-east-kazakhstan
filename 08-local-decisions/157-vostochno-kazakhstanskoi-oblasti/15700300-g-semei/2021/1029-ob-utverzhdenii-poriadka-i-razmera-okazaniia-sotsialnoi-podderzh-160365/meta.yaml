act_code: '160365'
requisite: Решение маслихата города Семей Восточно-Казахстанской области от 29 октября 2021 года № 17/112-VII. Зарегистрировано в Министерстве юстиции Республики Казахстан 19 ноября 2021 года № 25226. Утратило силу решением маслихата города Семей области Абай от 13 декабря 2024 года № 36/188-VIII (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Порядка и размера оказания социальной поддержки по оплате коммунальных услуг и приобретению топлива за счет бюджетных средств специалистам государственных организаций здравоохранения, социального обеспечения, образования, культуры, спорта и ветеринарии, проживающим и работающим в сельских населенных пунктах города Семей
  kaz: Семей қаласының ауылдық елді мекендерінде тұратын және жұмыс істейтін мемлекеттік денсаулық сақтау, әлеуметтік қамсыздандыру, білім беру, мәдениет, спорт және ветеринария ұйымдарының мамандарына бюджет қаражаты есебiнен коммуналдық көрсетілетін қызметтерге ақы төлеу және отын сатып алу бойынша әлеуметтік қолдау көрсету Тәртібі мен мөлшерін бекіту туралы
