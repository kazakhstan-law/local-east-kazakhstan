  title:
    rus: О внесении изменении в решение маслихата города Семей от 29 октября 2021 года № 17/112-VII «Об утверждении Правил и размера оказания социальной поддержки по оплате коммунальных услуг и приобретению топлива за счет бюджетных средств специалистам государственных организаций здравоохранения, социального обеспечения, образования, культуры, спорта и ветеринарии, проживающим и работающим в сельских населенных пунктах города Семей»
    kaz: Семей қаласы мәслихатының 2021 жылғы 29 қазандағы № 17/112-VII «Семей қаласының ауылдық елді мекендерінде тұратын және жұмыс істейтін мемлекеттік денсаулық сақтау, әлеуметтік қамсыздандыру, білім беру, мәдениет, спорт және ветеринария ұйымдарының мамандарына бюджет қаражаты есебiнен коммуналдық көрсетілетін қызметтерге ақы төлеу және отын сатып алу бойынша әлеуметтік қолдау көрсету Қағидасы мен мөлшерін бекіту туралы» шешіміне өзгерістер енгізу туралы
