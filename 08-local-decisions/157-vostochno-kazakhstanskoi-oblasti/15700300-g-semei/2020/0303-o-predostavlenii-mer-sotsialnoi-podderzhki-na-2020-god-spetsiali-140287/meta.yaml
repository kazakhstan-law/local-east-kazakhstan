  title:
    rus: О внесении изменений в решение маслихата города Семей от 3 марта 2020 года № 49/335-VI «О предоставлении мер социальной поддержки на 2020 год специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания в сельские населенные пункты города Семей»
    kaz: «Семей қаласының ауылдық елдi мекендеріне жұмыс iстеу және тұру үшiн келген денсаулық сақтау, бiлiм беру, әлеуметтiк қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға 2020 жылға арналған әлеуметтiк қолдау шараларын ұсыну туралы» Семей қаласы мәслихатының 2020 жылғы 3 наурыздағы № 49/335-VI шешіміне өзгерістер енгізу туралы
