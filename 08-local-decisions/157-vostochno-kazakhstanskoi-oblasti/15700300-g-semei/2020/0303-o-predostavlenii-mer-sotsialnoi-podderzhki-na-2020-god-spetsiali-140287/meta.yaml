act_code: '140287'
requisite: Решение маслихата города Семей Восточно-Казахстанской области от 3 марта 2020 года № 49/335-VI. Зарегистрировано Департаментом юстиции Восточно-Казахстанской области 17 марта 2020 года № 6771
title:
  rus: О предоставлении мер социальной поддержки на 2020 год специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, государственным служащим аппаратов акимов сел, поселков, сельских округов, прибывшим для работы и проживания в сельские населенные пункты города Семей
  kaz: Семей қаласының ауылдық елдi мекендеріне жұмыс iстеу және тұру үшiн келген денсаулық сақтау, бiлiм беру, әлеуметтiк қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға, ауылдар, кенттер, ауылдық округтер әкімдері аппараттарының мемлекеттік қызметшілеріне 2020 жылға арналған әлеуметтiк қолдау шараларын ұсыну туралы
