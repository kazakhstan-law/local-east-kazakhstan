act_code: '142824'
requisite: Решение маслихата города Семей Восточно-Казахстанской области от 29 апреля 2020 года № 52/378-VI. Зарегистрировано Департаментом юстиции Восточно-Казахстанской области 15 мая 2020 года № 7062. Утратило силу решением маслихата города Семей Восточно-Казахстанской области от 29 октября 2021 года № 17/112-VII (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об оказании социальной поддержки по оплате коммунальных услуг и приобретению топлива за счет бюджетных средств специалистам государственных организаций здравоохранения, социального обеспечения, образования, культуры, спорта и ветеринарии, проживающим и работающим в сельских населенных пунктах города Семей
  kaz: Семей қаласының ауылдық елді мекендерінде тұратын және жұмыс істейтін мемлекеттік денсаулық сақтау, әлеуметтік қамсыздандыру, білім беру, мәдениет, спорт және ветеринария ұйымдарының мамандарына бюджет қаражаты есебiнен көрсетілетін коммуналдық қызметтерге ақы төлеу және отын сатып алу бойынша әлеуметтік қолдау көрсету туралы
