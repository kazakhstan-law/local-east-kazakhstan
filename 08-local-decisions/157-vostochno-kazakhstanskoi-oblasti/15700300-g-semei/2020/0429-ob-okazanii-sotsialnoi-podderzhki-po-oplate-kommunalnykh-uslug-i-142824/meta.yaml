  title:
    rus: О внесении изменения и дополнения в решение маслихата города Семей от 29 апреля 2020 года № 52/378-VI «Об оказании социальной поддержки по оплате коммунальных услуг и приобретению топлива за счет бюджетных средств специалистам государственных организаций здравоохранения, социального обеспечения, образования, культуры, спорта и ветеринарии, проживающим и работающим в сельских населенных пунктах города Семей»
    kaz: «Семей қаласының ауылдық елді мекендерінде тұратын және жұмыс істейтін мемлекеттік денсаулық сақтау, әлеуметтік қамсыздандыру, білім беру, мәдениет, спорт және ветеринария ұйымдарының мамандарына бюджет қаражаты есебiнен көрсетілетін коммуналдық қызметтерге ақы төлеу және отын сатып алу бойынша әлеуметтік қолдау көрсету туралы» Семей қаласы мәслихатының 2020 жылғы 29 сәуірдегі № 52/378-VI шешіміне өзгеріс пен толықтыру енгізу туралы
