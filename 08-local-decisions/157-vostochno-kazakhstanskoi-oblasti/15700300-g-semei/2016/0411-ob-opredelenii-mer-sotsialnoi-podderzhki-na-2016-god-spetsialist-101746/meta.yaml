act_code: '101746'
requisite: Решение маслихата города Семей Восточно-Казахстанской области от 11 апреля 2016 года № 2/18-VI. Зарегистрировано Департаментом юстиции Восточно-Казахстанской области 25 апреля 2016 года № 4522. Утратило силу - решением маслихата города Семей Восточно-Казахстанской области от 6 апреля 2017 года № 13/91-VI
title:
  rus: Об определении мер социальной поддержки на 2016 год специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания в сельские населенные пункты города Семей
  kaz: Семей қаласының ауылдық елдi мекендеріне жұмыс iстеу және тұру үшiн келген денсаулық сақтау, бiлiм беру, әлеуметтiк қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға 2016 жылға арналған әлеуметтiк қолдау шараларын айқындау туралы
