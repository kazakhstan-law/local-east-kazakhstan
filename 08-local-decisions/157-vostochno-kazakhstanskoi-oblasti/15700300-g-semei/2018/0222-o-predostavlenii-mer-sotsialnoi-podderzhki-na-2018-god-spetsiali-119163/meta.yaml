act_code: '119163'
requisite: Решение маслихата города Семей Восточно-Казахстанской области от 22 февраля 2018 года № 23/144-VI. Зарегистрировано Департаментом юстиции Восточно-Казахстанской области 5 марта 2018 года № 5506
title:
  rus: О предоставлении мер социальной поддержки на 2018 год специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания в сельские населенные пункты города Семей
  kaz: Семей қаласының ауылдық елдi мекендеріне жұмыс iстеу және тұру үшiн келген денсаулық сақтау, бiлiм беру, әлеуметтiк қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға 2018 жылға арналған әлеуметтiк қолдау шараларын ұсыну туралы
