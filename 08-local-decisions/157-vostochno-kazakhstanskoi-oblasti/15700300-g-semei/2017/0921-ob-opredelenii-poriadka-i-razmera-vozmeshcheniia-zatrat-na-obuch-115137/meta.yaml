    kaz: Семей қаласы мәслихатының 2017 жылғы 21 қыркүйектегі № 18/115-VI «Мүгедектер қатарындағы кемтар балаларды жеке оқыту жоспары бойынша үйде оқытуға жұмсаған шығындарын өтеу туралы» шешіміне өзгеріс енгізу туралы
