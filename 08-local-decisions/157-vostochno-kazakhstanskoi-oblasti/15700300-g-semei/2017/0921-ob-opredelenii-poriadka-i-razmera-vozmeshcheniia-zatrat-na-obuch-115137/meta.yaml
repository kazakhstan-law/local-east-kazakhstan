  title:
    rus: О внесении изменений в решение маслихата города Семей от 21 сентября 2017 года № 18/115-VI «Об определении порядка и размера возмещения затрат на обучение на дому детей с ограниченными возможностями из числа детей с инвалидностью по индивидуальному учебному плану в городе Семей»
