act_code: '40929'
requisite: Решение маслихата города Семей Восточно-Казахстанской области от 20 июня 2008 года № 8/73-IV. Зарегистрировано Управлением юстиции города Семей Департамента юстиции Восточно-Казахстанской области 28 июля 2008 года за № 5-2-90. Утратило силу решением маслихата города Семей Восточно- Казахстанской области от 20 февраля 2009 года № 15/112-IV
title:
  rus: О ставках платы за размещение наружной (визуальной) рекламы, размещаемой в полосе отвода автомобильных дорог общего пользования местного значения в городе Семей и административно-подчиненных городу населенных пунктах
  kaz: Семей қаласының жергілікті маңызды ортақ пайдаланылатын автомобиль жолдарының бөлінген белдеуінде және қалаға әкімшілік-бағынышты елді мекендерде сыртқы (көрнекі) жарнаманы орналастырғаны үшін төлемақы ставкалары туралы
