  title:
    rus: О внесении изменения в решение маслихата города Семей от 6 марта 2019 года № 35/234-VI «О предоставлении мер социальной поддержки на 2019 год специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания в сельские населенные пункты города Семей»
    kaz: «Семей қаласының ауылдық елдi мекендеріне жұмыс iстеу және тұру үшiн келген денсаулық сақтау, бiлiм беру, әлеуметтiк қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға 2019 жылға арналған әлеуметтiк қолдау шараларын ұсыну туралы» Семей қаласы мәслихатының 2019 жылғы 6 наурыздағы № 35/234-VI шешіміне өзгеріс енгізу туралы
