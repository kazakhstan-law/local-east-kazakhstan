requisite: Решение маслихата города Семей Восточно-Казахстанской области от 22 апреля 2019 года № 37/257-VI. Зарегистрировано Департаментом юстиции Восточно-Казахстанской области 8 мая 2019 года № 5931. Утратило силу решением маслихата города Семей области Абай от 28 июня 2024 года № 28/153-VIII (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об установлении категории автостоянок (паркингов) и увеличении базовых ставок налога на земли, выделенные под автостоянки (паркинги) по городу Семей
  kaz: Семей қаласы бойынша автотұрақтардың (паркингтердің) санаттарын белгілеу және автотұрақтарға (паркингтерге) бөлінген жерлерге базалық салықтық мөлшерлемелерін ұлғайту туралы
