  title:
    rus: О внесении изменения в решение маслихата города Семей от 18 июня 2019 года № 39/272-VI «Об оказании социальной поддержки специалистам государственных организаций, проживающим и работающим в сельских населенных пунктах города Семей по оплате коммунальных услуг и приобритению топлива»
    kaz: «Семей қаласының ауылдық елді мекендерінде тұратын және жұмыс істейтін мемлекеттік ұйымдардың мамандарына коммуналдық көрсетілетін қызметтерге ақы төлеу және отын сатып алу бойынша әлеуметтік қолдау көрсету туралы» Семей қаласы мәслихатының 2019 жылғы 18 маусымдағы № 39/272-VI шешіміне өзгерістер енгізу туралы
