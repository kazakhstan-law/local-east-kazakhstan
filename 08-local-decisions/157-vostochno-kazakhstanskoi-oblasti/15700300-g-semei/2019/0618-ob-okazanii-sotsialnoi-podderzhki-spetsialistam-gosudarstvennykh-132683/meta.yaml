requisite: Решение маслихата города Семей Восточно-Казахстанской области от 18 июня 2019 года № 39/272-VI. Зарегистрировано Департаментом юстиции Восточно-Казахстанской области 24 июня 2019 года № 6033. Утратило силу решением маслихата города Семей Восточно-Казахстанской области от 29 апреля 2020 года № 52/378-VI (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об оказании социальной поддержки специалистам государственных организаций, проживающим и работающим в сельских населенных пунктах города Семей по оплате коммунальных услуг и приобретению топлива
  kaz: Семей қаласының ауылдық елді мекендерінде тұратын және жұмыс істейтін мемлекеттік ұйымдардың мамандарына коммуналдық көрсетілетін қызметтерге ақы төлеу және отын сатып алу бойынша әлеуметтік қолдау көрсету туралы
