title:
  rus: Об оказании социальной поддержки специалистам государственных организаций, проживающим и работающим в сельских населенных пунктах города Семей по оплате коммунальных услуг и приобретению топлива
  kaz: Семей қаласының ауылдық елді мекендерінде тұратын және жұмыс істейтін мемлекеттік ұйымдардың мамандарына коммуналдық көрсетілетін қызметтерге ақы төлеу және отын сатып алу бойынша әлеуметтік қолдау көрсету туралы
