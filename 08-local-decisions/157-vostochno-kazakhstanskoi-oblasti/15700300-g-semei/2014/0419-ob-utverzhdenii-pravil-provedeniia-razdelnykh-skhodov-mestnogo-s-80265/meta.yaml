requisite: Решение маслихата города Семей Восточно-Казахстанской области от 19 апреля 2014 года № 29/153-V. Зарегистрировано Департаментом юстиции Восточно-Казахстанской области 20 мая 2014 года № 3347. Утратило силу решением маслихата города Семей области Абай от 10 ноября 2023 года № 12/74-VIII (вводится в действие по истечении десяти календарных дней после дня его первого официального публикования)
title:
  rus: Об утверждении Правил проведения раздельных сходов местного сообщества и определения количества представителей жителей села, улицы, многоквартирного жилого дома для участия в сходе местного сообщества в поселках и сельских округах города Семей
  kaz: Семей қаласының кент және ауылдық округтерінде бөлек жергілікті   қоғамдастық жиындарын өткізу және жергілікті қоғамдастық жиынына қатысу үшін ауыл, көше, көппәтерлі тұрғын үй тұрғындары өкілдерінің санын айқындау қағидасын бекіту туралы
