requisite: Решение акима Каратобинского сельского округа Жарминского района Восточно-Казахстанской области от 2 ноября 2018 года № 1. Зарегистрировано Управлением юстиции Жарминского района Департамента юстиции Восточно-Казахстанской области 6 ноября 2018 года № 5-10-158. Утратило силу решением акима Каратобинского сельского округа Жарминского района Восточно-Казахстанской области от 23 августа 2019 года № 1
title:
  rus: Об установлении ограничительных мероприятий в товариществе с ограниченной ответственностью «Карадонгал», в крестьянском хозяйстве «Ержан», в селах Каратобе, Кентарлау, Ади Каратобинского сельского округа Жарминского района
  kaz: Жарма ауданы Қаратөбе ауылдық округінің Қаратөбе, Кеңтарлау, Әди ауылдарына, «Қарадонғал» жауапкершілігі шектеулі серіктестігіне, «Ержан» шаруа қожалығына шектеу іс-шараларын белгілеу туралы
