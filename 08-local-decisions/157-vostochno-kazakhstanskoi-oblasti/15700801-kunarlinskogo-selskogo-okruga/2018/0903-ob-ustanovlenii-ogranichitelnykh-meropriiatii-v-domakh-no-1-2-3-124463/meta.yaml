requisite: Решение акима Подборного сельского округа Бородулихинского района Восточно-Казахстанской области от 3 сентября 2018 года № 1. Зарегистрировано Управлением юстиции Бородулихинского района Департамента юстиции Восточно-Казахстанской области 5 сентября 2018 года № 5-8-169. Утратило силу решением акима Подборного сельского округа Бородулихинского района Восточно-Казахстанской области от 13 декабря 2018 года № 3
