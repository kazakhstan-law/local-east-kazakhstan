act_code: '44514'
requisite: Шығыс Қазақстан облысы Тарбағатай аудандық мәслихатының 2009 жылғы 13 ақпандағы № 12-4 шешімі. Шығыс Қазақстан облысы Әділет департаментінің Тарбағатай аудандық Әділет басқармасында 2009 жылғы 26 ақпанда № 5-16-71 тіркелді. Күші жойылды - Шығыс Қазақстан облысы Тарбағатай аудандық мәслихатының 2015 жылғы 28 қаңтардағы № 24-3 шешімімен
