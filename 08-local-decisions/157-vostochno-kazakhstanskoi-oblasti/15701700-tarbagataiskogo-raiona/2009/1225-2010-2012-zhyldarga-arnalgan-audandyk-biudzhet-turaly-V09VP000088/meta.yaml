requisite: Шығыс Қазақстан облысы Тарбағатай аудандық мәслихатының 2009 жылғы 25 желтоқсандағы № 18-2 шешімі. Шығыс Қазақстан облысы Әділет департаментінің Тарбағатай аудандық әділет басқармасында 2009 жылғы 29 желтоқсанда № 5-16-88 тіркелді. Күші жойылды - қабылданған мерзімінің бітуіне байланысты (Тарбағатай аудандық мәслихатының 2011 жылғы 14 қаңтардағы № 1 хаты)
