requisite: Шығыс Қазақстан облысы Тарбағатай аудандық мәслихатының 2009 жылғы 24 сәуірдегі № 13-7 шешімі. Шығыс Қазақстан облысы Әділет департаментінің Тарбағатай аудандық Әділет басқармасында 2009 жылғы 8 мамырда № 5-16-75 тіркелді. Күші жойылды - Тарбағатай аудандық мәслихатының 2010 жылғы 27 шілдедегі № 23-9 шешімімен
