act_code: '44513'
requisite: Шығыс Қазақстан облысы Тарбағатай аудандық мәслихатының 2009 жылғы 13 ақпандағы № 12-5 шешімі. Шығыс Қазақстан облысы Әділет департаментінің Тарбағатай аудандық Әділет басқармасында 2009 жылғы 26 ақпанда № 5-16-70 тіркелді. Күші жойылды - Тарбағатай аудандық мәслихатының 2010 жылғы 27 шілдедегі № 23-9 шешімімен
