act_code: '209287'
requisite: Решение Тарбагатайского районного маслихата Восточно-Казахстанской области от 11 апреля 2025 года № 27/13-VIII. Зарегистрировано Департаментом юстиции Восточно-Казахстанской области 18 апреля 2025 года № 9186-16
title:
  rus: Об определении специализированных мест для организации и проведения мирных собраний и норм их предельной заполняемости, требований к их материально- техническому и организационному обеспечению, порядка их использования, границ прилегающих территории, в которых запрещено проведение пикетирования по Тарбагатайскому району
  kaz: Тарбағатай ауданы бойынша бейбіт жиналыстарды ұйымдастыру және өткізу үшін арнайы орындарды және олардың шекті толу нормаларын, оларды материалдық техникалық және ұйымдастырушылық қамтамасыз етуге қойылатын талаптарды, пайдалану тәртібін, пикеттеуді өткізуге тиым салынған іргелес аумақтардың шекараларын айқындау туралы
