requisite: Решение Тарбагатайского районного маслихата Восточно-Казахстанской области от 25 ноября 2025 года № 33/4-VIII
title:
  rus: Об отмене решения Тарбагатайского районного маслихата Восточно – Казахстанской области от 28 апреля 2023 года № 2/3-VIII «Об утверждении методики оценки деятельности административных государственных служащих корпуса «Б» государственного учреждения «Аппарат Тарбагатайского районного маслихата ВКО»
  kaz: «ШҚО Тарбағатай аудандық мәслихатының аппараты» мемлекеттік мекемесінің «Б» корпусы мемлекеттік әкімшілік қызметшілерінің қызметін бағалау әдістемесін бекіту туралы» Шығыс Қазақстан облысы Тарбағатай аудандық мәслихатының 2023 жылғы 28 сәуірдегі № 2/3-VIII шешімінің күшін жою туралы
