act_code: '43477'
requisite: Шығыс Қазақстан облысы Тарбағатай аудандық мәслихатының 2008 жылғы 25 желтоқсандағы № 10-2 шешімі. Шығыс Қазақстан облысы Әділет департаментінің Тарбағатай аудандық әділет басқармасында 2008 жылғы 26 желтоқсанда № 5-16-65 тіркелді. Күші жойылды - Тарбағатай аудандық мәслихатының 2010 жылғы 21 сәуірдегі № 46 хаты
