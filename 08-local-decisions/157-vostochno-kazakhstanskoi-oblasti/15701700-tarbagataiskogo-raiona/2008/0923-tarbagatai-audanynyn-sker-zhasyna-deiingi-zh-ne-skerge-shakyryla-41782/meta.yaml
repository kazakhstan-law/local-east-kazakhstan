act_code: '41782'
requisite: Шығыс Қазақстан облысы Тарбағатай ауданы әкімінің 2008 жылғы 23 қыркүйектегі № 15 шешімі. Шығыс Қазақстан облысы Әділет департаментінің Тарбағатай аудандық Әділет басқармасында 2008 жылғы 2 қазанда № 5-16-59 тіркелді. Күші жойылды - 2009.06.05 № 1240 Тарбағатай ауданы әкімінің аппаратының хаты негізінде, қабылданған мерзімінің бітуіне байланысты
title:
