act_code: '43476'
requisite: Шығыс Қазақстан облысы Тарбағатай ауданы әкімінің 2008 жылғы 20 желтоқсандағы № 24 шешімі. Шығыс Қазақстан облысы Әділет департаментінің Тарбағатай аудандық Әділет басқармасында 2008 жылғы 22 желтоқсанда № 5-16-64 тіркелді. Күші жойылды - 2009.06.05 № 1240 Тарбағатай ауданы әкімінің аппаратының хаты негізінде, қабылданған мерзімінің бітуіне байланысты
