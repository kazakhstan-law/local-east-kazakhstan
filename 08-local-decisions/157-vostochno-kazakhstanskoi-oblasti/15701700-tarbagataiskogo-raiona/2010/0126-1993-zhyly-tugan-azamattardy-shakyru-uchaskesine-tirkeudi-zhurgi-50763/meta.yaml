act_code: '50763'
requisite: Шығыс Қазақстан облысы Тарбағатай ауданы әкімінің 2010 жылғы 26 қаңтардағы № 1 шешімі. Шығыс Қазақстан облысы Әділет департаментінің Тарбағатай аудандық әділет басқармасында 2010 жылғы 23 ақпанда № 5-16-91 тіркелді. Шешімнің қабылдау мерзімінің өтуіне байланысты күші жойылды - Тарбағатай ауданы әкімінің 2010 жылғы 12 сәуірдегі № 05 шешімімен
