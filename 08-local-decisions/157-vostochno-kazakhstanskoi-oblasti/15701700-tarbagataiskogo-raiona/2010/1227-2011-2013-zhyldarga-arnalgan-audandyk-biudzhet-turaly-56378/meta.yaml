act_code: '56378'
requisite: Шығыс Қазақстан облысы Тарбағатай аудандық мәслихатының 2010 жылғы 27 желтоқсандағы № 26-2 шешімі. Шығыс Қазақстан облысы Әділет департаментінің Тарбағатай аудандық әділет басқармасында 2010 жылғы 30 желтоқсанда № 5-16-105 тіркелді. Шешімнің қабылдау мерзімінің өтуіне байланысты қолдану тоқтатылды (Тарбағатай аудандық мәслихатының 2011 жылғы 30 желтоқсандағы № 104 хаты)
