requisite: Шығыс Қазақстан облысы Тарбағатай аудандық мәслихатының 2010 жылғы 27 шілдедегі № 23-8 шешімі. Шығыс Қазақстан облысы Әділет департаментінің Тарбағатай аудандық әділет басқармасында 2010 жылғы 7 қыркүйекте № 5-16-100 тіркелді. Күші жойылды - Тарбағатай аудандық мәслихатының 2012 жылғы 11 сәуірдегі № 3-6 шешімімен
