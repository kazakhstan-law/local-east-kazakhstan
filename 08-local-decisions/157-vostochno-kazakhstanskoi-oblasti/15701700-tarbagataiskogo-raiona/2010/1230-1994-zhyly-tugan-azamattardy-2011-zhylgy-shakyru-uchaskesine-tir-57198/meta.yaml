act_code: '57198'
requisite: Шығыс Қазақстан облысы Тарбағатай ауданы әкімінің 2010 жылғы 30 желтоқсандағы № 15 шешімі. Шығыс Қазақстан облысы Әділет департаментінің Тарбағатай аудандық әділет басқармасында 2011 жылғы 1 ақпанда № 5-16-108 тіркелді. Күші жойылды - Тарбағатай ауданы әкімінің 2011 жылғы 23 мамырдағы № 12 шешімімен
