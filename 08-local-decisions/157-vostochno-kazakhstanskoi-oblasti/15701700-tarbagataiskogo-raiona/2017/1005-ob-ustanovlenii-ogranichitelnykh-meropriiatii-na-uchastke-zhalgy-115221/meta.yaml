requisite: Постановление акимата Тарбагатайского района Восточно-Казахстанской области от 5 октября 2017 года № 440. Зарегистрировано Департаментом юстиции Восточно-Казахстанской области 11 октября 2017 года № 5231. Утратило силу - постановлением акимата Тарбагатайского района Восточно-Казахстанской области от 16 мая 2018 года № 264
title:
  rus: Об установлении ограничительных мероприятий на участке «Жалғызтал» Сатпаевского сельского округа, участке «Берлібай» Екпинского сельского округа и в селе Кызыл кесик, Кызыл кесикского сельского округа Тарбагатайского района
  kaz: Тарбағатай ауданының Сәтпаев ауылдық округiнiң «Жалғызтал» учаскесінде, Екпін ауылдық округiнiң «Берлібай» учаскесінде және Қызыл кесік ауылдық округiнің Қызыл кесік ауылына шектеу iс-шараларын белгiлеу туралы
