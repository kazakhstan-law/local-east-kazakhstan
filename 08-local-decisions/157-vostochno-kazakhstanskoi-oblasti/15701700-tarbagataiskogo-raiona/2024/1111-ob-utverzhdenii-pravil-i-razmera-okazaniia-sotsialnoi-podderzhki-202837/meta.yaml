act_code: '202837'
requisite: Решение Тарбагатайского районного маслихата Восточно-Казахстанской области от 11 ноября 2024 года № 20/9-VIII. Зарегистрировано Департаментом юстиции Восточно-Казахстанской области 18 ноября 2024 года № 9104-16
title:
  rus: Об утверждении Правил и размера оказания социальной поддержки по оплате коммунальных услуг и приобретению топлива за счет бюджетных средств специалистам государственных организаций здравоохранения, социального обеспечения, образования, культуры, спорта и ветеринарии, проживающим и работающим в сельских населенных пунктах Тарбагатайского района
  kaz: Тарбағатай ауданының ауылдық елді мекендерінде тұратын және жұмыс істейтін мемлекеттік денсаулық сақтау, әлеуметтік қамсыздандыру, білім беру, мәдениет, спорт және ветеринария ұйымдарының мамандарына бюджет қаражаты есебінен коммуналдық көрсетілетін қызметтерге ақы төлеу және отын сатып алу бойынша әлеуметтік қолдау көрсету Қағидасын және мөлшерін бекіту туралы
