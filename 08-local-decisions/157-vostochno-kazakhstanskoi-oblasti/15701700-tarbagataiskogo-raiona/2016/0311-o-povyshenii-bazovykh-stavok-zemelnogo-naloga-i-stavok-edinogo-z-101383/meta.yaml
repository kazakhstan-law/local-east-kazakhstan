requisite: Решение Тарбагатайского районного маслихата Восточно-Казахстанской области от 11 марта 2016 года № 34-3. Зарегистрировано Департаментом юстиции Восточно-Казахстанской области 4 апреля 2016 года № 4464. Утратило силу решением Тарбагатайского районного маслихата Восточно-Казахстанской области от 3 января 2019 года № 33-10
title:
  rus: О повышении базовых ставок земельного налога и ставок единого земельного налога на не используемые в соответствии с земельным законодательством Республики Казахстан земли сельскохозяйственного назначения Тарбагатайского района
  kaz: Қазақстан Республикасының жер заңнамасына сәйкес пайдаланылмайтын Тарбағатай ауданының ауыл шаруашылығы мақсатындағы  жерлерге жер салығының базалық  мөлшерлемелерін  және бірыңғай  жер салығының  мөлшерлемелерін жоғарылату туралы
