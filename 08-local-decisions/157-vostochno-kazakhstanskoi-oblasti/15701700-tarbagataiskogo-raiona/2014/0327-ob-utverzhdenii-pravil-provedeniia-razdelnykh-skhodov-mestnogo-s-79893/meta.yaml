requisite: Решение Тарбагатайского районного маслихата Восточно-Казахстанской области от 27 марта 2014 года № 19-10. Зарегистрировано Департаментом юстиции Восточно-Казахстанской области 6 мая 2014 года № 3292. Утратило силу решением Тарбагатайского районного маслихата Восточно-Казахстанской области от 11 декабря 2023 года № 8/10-VIII (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Правил проведения раздельных сходов местного сообщества и определения количества представителей жителей сел, улиц, многоквартирных жилых домов для участия в сходах местного сообщества на территории Тарбагатайского района
  kaz: Тарбағатай ауданының аумағында бөлек жергілікті қоғамдастық жиындарын өткізу Қағидасын бекіту және жергілікті қоғамдастық жиынына қатысу үшін ауыл, көше, көппәтерлі тұрғын үй тұрғындары өкілдерінің санын айқындау туралы
