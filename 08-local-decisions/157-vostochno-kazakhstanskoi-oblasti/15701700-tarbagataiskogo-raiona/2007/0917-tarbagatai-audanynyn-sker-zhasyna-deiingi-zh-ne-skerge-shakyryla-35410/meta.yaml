act_code: '35410'
requisite: Шығыс Қазақстан облысы Тарбағатай ауданы әкімінің 2007 жылғы 17 қыркүйектегі № 10 шешімі. Шығыс Қазақстан облысы Әділет департаментінің Тарбағатай аудандық Әділет басқармасында 2007 жылғы 19 қазанда № 5-16-41 тіркелді
