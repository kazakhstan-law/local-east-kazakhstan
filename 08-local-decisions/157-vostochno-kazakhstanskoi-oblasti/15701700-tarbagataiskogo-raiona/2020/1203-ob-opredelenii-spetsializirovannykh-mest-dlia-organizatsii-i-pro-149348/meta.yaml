act_code: '149348'
requisite: Решение Тарбагатайского районного маслихата Восточно-Казахстанской области от 3 декабря 2020 года № 65-4. Зарегистрировано Департаментом юстиции Восточно-Казахстанской области 4 декабря 2020 года № 7916. Утратило силу решением Тарбагатайского районного маслихата Восточно-Казахстанской области от 11 апреля 2025 года № 27/13-VIII (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об определении специализированных мест для организации и проведения мирных собраний, порядка их использования, норм их предельной заполняемости, требований к их материально-техническому и организационному обеспечению, границ прилегающих территорий, в которых запрещено проведение пикетирования в Тарбагатайском районе
  kaz: Тарбағатай ауданында бейбіт жиналыстарды ұйымдастыру және өткізу үшін арнайы орындарды, оларды пайдалану тәртібін, олардың шекті толу нормаларын, оларды материалдық-техникалық және ұйымдастырушылық қамтамасыз етуге қойылатын талаптарды, пикеттеуді өткізуге тыйым салынған іргелес аумақтардың шекараларын айқындау туралы
