  title:
    rus: О внесений изменения в решение Тарбагатайского районного маслихата от 3 декабря 2020 года № 65-4 «Об определении специализированных мест для организации и проведения мирных собраний, порядка их использования, норм их предельной заполняемости, требований к их материально-техническому и организационному обеспечению, границ прилегающих территорий, в которых запрещено проведение пикетирования в Тарбагатайском районе»
    kaz: Тарбағатай аудандық мәслихатының 2020 жылғы 3 желтоқсандағы № 65-4 «Тарбағатай ауданында бейбіт жиналыстарды ұйымдастыру және өткізу үшін арнайы орындарды, оларды пайдалану тәртібін, олардың шекті толу нормаларын, оларды материалдық-техникалық және ұйымдастырушылық қамтамасыз етуге қойылатын талаптарды, пикеттеуді өткізуге тыйым салынған іргелес аумақтардың шекараларын айқындау туралы» шешіміне өзгеріс енгізу туралы
