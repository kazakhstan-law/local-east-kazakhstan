requisite: Решение Тарбагатайского районного маслихата Восточно-Казахстанской области от 3 января 2019 года № 33-10. Зарегистрировано Управлением юстиции Тарбагатайского района Департамента юстиции Восточно-Казахстанской области 18 января 2019 года № 5-16-185. Утратило силу решением Тарбагатайского районного маслихата Восточно-Казахстанской области от 28 апреля 2023 года № 2/10-VIII (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: О повышении базовых ставок земельного налога и ставок единого земельного налога на не используемые в соответствии с земельным законодательством Республики Казахстан земли сельскохозяйственного назначения Тарбагатайского района
