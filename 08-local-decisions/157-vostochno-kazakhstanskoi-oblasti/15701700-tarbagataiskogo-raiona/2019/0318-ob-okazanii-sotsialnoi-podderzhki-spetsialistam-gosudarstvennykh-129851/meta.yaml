requisite: Решение Тарбагатайского районного маслихата Восточно-Казахстанской области от 18 марта 2019 года № 35-3. Зарегистрировано Департаментом юстиции Восточно-Казахстанской области 27 марта 2019 года № 5803. Утратило силу решением Тарбагатайского районного маслихата Восточно-Казахстанской области от 22 октября 2020 года № 62-3 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования). Действие решения приостановлено до 1 сентября 2020 года решением Тарбагатайского районного маслихата Восточно-Казахстанской области от 7 апреля 2020 года № 53-20 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
