act_code: '168087'
requisite: Решение Тарбагатайского районного маслихата Восточно-Казахстанской области от 20 мая 2022 года № 17/5-VII. Зарегистрировано в Министерстве юстиции Республики Казахстан 24 мая 2022 года № 28179. Утратило силу решением Тарбагатайского районного маслихата Восточно-Казахстанской области от 11 ноября 2024 года № 20/9-VIII (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Правил и размера оказания социальной поддержки по оплате коммунальных услуг и приобретению топлива за счет бюджетных средств специалистам государственных организаций здравоохранения, социального обеспечения, образования, культуры, спорта и ветеринарии, проживающим и работающим в сельских населенных пунктах Тарбагатайского района
  kaz: Тарбағатай ауданының ауылдық елді мекендерінде тұратын және жұмыс істейтін мемлекеттік денсаулық сақтау, әлеуметтік қамсыздандыру, білім беру, мәдениет, спорт және ветеринария ұйымдарының мамандарына бюджет қаражаты есебiнен коммуналдық көрсетілетін қызметтерге ақы төлеу және отын сатып алу бойынша әлеуметтік қолдау көрсету Қағидасы мен мөлшерін бекіту туралы
