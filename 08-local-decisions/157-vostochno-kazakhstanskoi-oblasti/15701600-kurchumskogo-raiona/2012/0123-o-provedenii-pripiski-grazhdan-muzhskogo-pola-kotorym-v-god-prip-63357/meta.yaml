requisite: Решение акима Курчумского района Восточно-Казахстанской области от 23 января 2012 года № 56. Зарегистрировано управлением юстиции Курчумского района Департамента юстиции Восточно-Казахстанской области 13 февраля 2012 года за № 5-14-147. Прекращено действие по истечении срока, на который решение было принято (письмо аппарата акима Курчумского района от 11 мая 2012 года № 01-04/1688)
