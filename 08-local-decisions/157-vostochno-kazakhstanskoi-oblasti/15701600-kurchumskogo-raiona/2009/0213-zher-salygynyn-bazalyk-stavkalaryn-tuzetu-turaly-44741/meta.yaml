act_code: '44741'
requisite: Шығыс Қазақстан облысы Күршім аудандық мәслихатының 2009 жылғы 13 ақпандағы № 12-4 шешімі. Шығыс Қазақстан облысы Әділет департаментінің Күршім аудандық Әділет басқармасында 2009 жылғы 26 ақпанда № 5-14-79 тіркелді. Күші жойылды - Шығыс Қазақстан облысы Күршім аудандық мәслихатының 2015 жылғы 16 наурыздағы № 22-10 шешімімен
