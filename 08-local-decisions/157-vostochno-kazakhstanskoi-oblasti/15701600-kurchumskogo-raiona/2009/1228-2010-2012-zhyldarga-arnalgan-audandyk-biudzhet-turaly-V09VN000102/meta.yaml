requisite: Шығыс Қазақстан облысы Күршім аудандық мәслихатының 2009 жылғы 28 желтоқсандағы № 18-3 шешімі. Шығыс Қазақстан облысы Әділет департаментінің Күршім аудандық әділет басқармасында 2010 жылғы 6 қаңтарда № 5-14-102 тіркелді. Қолданылу мерзімінің өтуіне байланысты күші жойылды (Күршім аудандық мәслихатының 2010 жылғы 31 желтоқсандағы № 164 хаты)
