requisite: Шығыс Қазақстан облысы Күршім аудандық мәслихатының 2008 жылғы 26 желтоқсандағы № 10-3 шешімі. Шығыс Қазақстан облысы Әділет департаментінің Күршім аудандық әділет басқармасында 2009 жылғы 8 қаңтарда № 5-14-76 тіркелді. Қабылданған мерзімінің бітуіне байланысты күші жойылды - Күршім аудандық мәслихатының 2010 жылғы 11 қаңтардағы № 5 хаты
