act_code: '39934'
requisite: Шығыс Қазақстан облысы Күршім аудандық мәслихатының 2008 жылғы 18 сәуірдегі № 5-4 шешімі. Шығыс Қазақстан облысы Әділет департаментінің Күршім аудандық Әділет басқармасында 2008 жылғы 7 мамырда №-14-67 тіркелді. Күші жойылды - ШҚО Күршім аудандық мәслихатының 2011 жылғы 20 маусымдағы № 28-8 шешімімен
title:
