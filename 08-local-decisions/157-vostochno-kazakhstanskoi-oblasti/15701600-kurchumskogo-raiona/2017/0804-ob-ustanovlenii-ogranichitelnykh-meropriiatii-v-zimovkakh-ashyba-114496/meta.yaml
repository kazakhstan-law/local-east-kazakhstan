requisite: Решение акима Калгутинского сельского округа Курчумского района Восточно-Казахстанской области от 4 августа 2017 года № 1. Зарегистрировано Департаментом юстиции Восточно-Казахстанской области 5 сентября 2017 года № 5192. Утратило силу решением акима Калгутинского сельского округа Курчумского района Восточно-Казахстанской области от 20 декабря 2018 года № 1
