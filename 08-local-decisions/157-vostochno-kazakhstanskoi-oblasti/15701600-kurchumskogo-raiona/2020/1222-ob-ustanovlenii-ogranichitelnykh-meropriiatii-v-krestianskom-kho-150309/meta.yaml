requisite: Решение акима Калгутинского сельского округа Курчумского района Восточно-Казахстанской области от 22 декабря 2020 года № 3. Зарегистрировано Департаментом юстиции Восточно-Казахстанской области 23 декабря 2020 года № 8003. Утратило силу решением акима Калгутинского сельского округа Курчумского района Восточно-Казахстанской области от 27 апреля 2021 года № 1 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
