act_code: '144765'
requisite: Решение Курчумского районного маслихата Восточно-Казахстанской области от 24 июня 2020 года № 50/4-VI. Зарегистрировано Департаментом юстиции Восточно-Казахстанской области 9 июля 2020 года № 7320. Утратило силу решением Курчумского районного маслихата Восточно-Казахстанской области от 22 октября 2024 года № 28/3-VIII (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об оказании социальной поддержки по оплате коммунальных услуг и приобретению топлива за счет бюджетных средств специалистам государственных организаций здравоохранения, социального обеспечения, образования, культуры, спорта и ветеринарии, проживающим и работающим в сельских населенных пунктах Курчумского района
  kaz: Күршім ауданының ауылдық елді мекендерінде тұратын және жұмыс істейтін мемлекеттік денсаулық сақтау, әлеуметтік қамсыздандыру, білім беру, мәдениет, спорт және ветеринария ұйымдарының мамандарына коммуналдық көрсетілетін қызметтер және отын сатып алу бойынша әлеуметтік қолдау көрсету туралы
