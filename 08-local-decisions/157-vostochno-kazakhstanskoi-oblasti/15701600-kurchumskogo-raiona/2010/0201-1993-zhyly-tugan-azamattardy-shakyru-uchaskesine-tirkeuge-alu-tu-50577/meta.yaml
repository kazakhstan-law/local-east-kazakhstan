act_code: '50577'
requisite: Шығыс Қазақстан облысы Күршім ауданы әкімінің 2010 жылғы 1 ақпандағы № 32 шешімі. Шығыс Қазақстан облысы Әділет департаментінің Күршім аудандық әділет басқармасында 2010 жылғы 9 ақпанда № 5-14-105 тіркелді. Күші жойылды - ШҚО Күршім ауданы әкімінің 2010 жылғы 19 сәуірдегі № 36 шешімімен
