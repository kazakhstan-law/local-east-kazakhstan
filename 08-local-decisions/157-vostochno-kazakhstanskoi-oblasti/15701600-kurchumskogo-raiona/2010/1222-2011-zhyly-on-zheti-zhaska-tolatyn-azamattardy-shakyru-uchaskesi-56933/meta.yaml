act_code: '56933'
requisite: Шығыс Қазақстан облысы Күршім ауданы әкімінің 2010 жылғы 22 желтоқсандағы № 46 шешімі. Шығыс Қазақстан облысы Әділет департаментінің Күршім аудандық әділет басқармасында 2010 жылғы 19 қантарда № 5-14-121 тіркелді. Қолданылу мерзімінің өтуіне байланысты күші жойылды (Күршім ауданы әкімдігінің 2011 жылғы 8 шілдедегі № 01-05/1492 хаты)
