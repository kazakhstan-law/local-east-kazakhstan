requisite: Решение акима Калжырского сельского округа Курчумского района Восточно-Казахстанской области от 25 июля 2018 года № 4. Зарегистрировано Управлением юстиции Курчумского района Департамента юстиции Восточно-Казахстанской области 30 июля 2018 года № 5-14-170. Утратило силу решением акима Калжырского сельского округа Курчумского района Восточно-Казахстанской области от 16 марта 2020 года № 1 (вводится в действие по истечении десяти календарных дней после его первого официального опубликования)
title:
  rus: Об установлении ограничительных мероприятий в селе Калжыр Калжырского сельского округа Курчумского района по отношению табунам организуемыми жителями села Ақатай Қайырбек, Бекжанов Нурбек, Қахарман Тоқан
  kaz: Күршім ауданы Қалжыр ауылдық округі Қалжыр ауылына, оның ішінде ауыл тұрғындары Ақатай Қайырбек, Бекжанов Нурбек, Қахарман Тоқан ұйымдастырған табындарға шектеу іс-шарасын белгілеу туралы
