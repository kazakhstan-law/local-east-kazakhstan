act_code: '202063'
requisite: Решение Курчумского районного маслихата Восточно-Казахстанской области от 22 октября 2024 года № 28/3-VIII. Зарегистрировано Департаментом юстиции Восточно-Казахстанской области 29 октября 2024 года № 9097-16
title:
  rus: Об утверждении Правил и размера оказания социальной поддержки по оплате коммунальных услуги приобретению топлива за счет бюджетных средств специалистам государственных организаций здравоохранения, социального обеспечения, образования, культуры, спорта и ветеринарии, проживающим и работающим в сельских населенных пунктах Курчумского района
  kaz: Күршім ауданының ауылдық елді мекендерінде тұратын және жұмыс істейтін мемлекеттік денсаулық сақтау, әлеуметтік қамсыздандыру, білім беру, мәдениет, спорт және ветеринария ұйымдарының мамандарына бюджет қаражаты есебінен коммуналдық көрсетілетін қызметтерге ақы төлеу және отын  сатып алу бойынша әлеуметтік қолдау көрсету Қағидасын және мөлшерін бекіту туралы
