act_code: '157504'
requisite: Решение акима Калжырского сельского округа Курчумского района Восточно-Казахстанской области от 30 апреля 2021 года № 1. Зарегистрировано Департаментом юстиции Восточно-Казахстанской области 4 мая 2021 года № 8725. Утратило силу решением акима Калжырского сельского округа Курчумского района Восточно-Казахстанской области от 11 октября 2021 года № 2 (вводится в действие по истечении десяти календарных дней после его первого официального опубликования)
title:
  rus: Об установлении ограничительных мероприятий в связи с возникновением заболевания бруцеллеза среди  крупного рогатого скота, принадлежащего крестьянскому хозяйству Ж. Азимбаева «Жаз» расположенному на участке № 2 «Жырғалаң» Калжырского сельского округа Курчумского района
  kaz: Күршім ауданы Қалжыр ауылдық округіне қарасты № 2 «Жырғалаң» телімінде орналасқан Ж. Азимбаевтың «Жаз» шаруа қожалығының иелігіндегі ірі қара мүйізді малдары арасында бруцеллез ауруы шығуына байланысты шектеу іс-шарасын белгілеу туралы
