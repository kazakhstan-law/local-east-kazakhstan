  title:
    rus: О внесении изменения в решение Курчумского районного маслихата от 14 октября 2021 года № 9/7-VII «Об определении порядка и размера возмещения затрат на обучение на дому детей с ограниченными возможностями из числа инвалидов по индивидуальному учебному плану в Курчумском районе»
    kaz: Күршім аудандық мәслихатының 2021 жылғы 14 қазандағы № 9/7-VII «Күршім ауданында мүгедектер қатарындағы кемтар балаларды жеке оқыту жоспары бойынша үйде оқытуға жұмсаған шығындарын өндіріп алу тәртібі мен мөлшерін айқындау туралы» шешіміне өзгеріс енгізу туралы
