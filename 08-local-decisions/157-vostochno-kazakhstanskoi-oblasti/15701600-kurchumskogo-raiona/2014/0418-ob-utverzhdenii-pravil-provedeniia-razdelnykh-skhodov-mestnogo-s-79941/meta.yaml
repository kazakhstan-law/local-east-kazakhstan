requisite: Решение Курчумского районного маслихата Восточно-Казахстанской области от 18 апреля 2014 года № 17-20. Зарегистрировано Департаментом юстиции Восточно-Казахстанской области 29 мая 2014 года № 3368. Утратило силу решением Курчумского районного маслихата Восточно-Казахстанской области от 26 декабря 2023 года № 14/19-VIII (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
