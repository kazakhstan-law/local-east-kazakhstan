act_code: '200090'
requisite: Решение Усть-Каменогорского городского маслихата Восточно-Казахстанской области от 23 августа 2024 года № 24/2-VIII. Зарегистрировано Департаментом юстиции Восточно-Казахстанской области 27 августа 2024 года № 9064-16
title:
  rus: Об утверждении Правил и размера оказания социальной поддержки по оплате коммунальных услуг и приобретению топлива за счет бюджетных средств специалистам государственных организаций здравоохранения, образования, социального обеспечения, культуры, спорта и ветеринарии, проживающим и работающим в сельских населенных пунктах города Усть-Каменогорска
  kaz: Өскемен қаласының ауылдық елді мекендерінде тұратын және жұмыс істейтін мемлекеттік денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және ветеринария ұйымдарының мамандарына бюджет қаражаты есебiнен коммуналдық көрсетілетін қызметтерге ақы төлеу және отын сатып алу бойынша әлеуметтік қолдау көрсету қағидалары мен мөлшерін бекіту туралы
