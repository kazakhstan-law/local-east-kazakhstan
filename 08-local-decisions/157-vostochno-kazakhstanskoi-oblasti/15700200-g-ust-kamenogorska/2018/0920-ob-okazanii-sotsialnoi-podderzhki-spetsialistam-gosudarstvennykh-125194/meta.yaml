act_code: '125194'
requisite: Решение Усть-Каменогорского городского маслихата Восточно-Казахстанской области от 20 сентября 2018 года № 35/7-VI. Зарегистрировано Управлением юстиции города Усть-Каменогорска Восточно-Казахстанской области 16 октября 2018 года № 5-1-200. Действие решения приостановлено до 1 октября 2020 года решением Усть-Каменогорского городского маслихата Восточно-Казахстанской области от 30 апреля 2020 года № 55/3-VI (вводится в действие со дня принятия). Утратило силу решением Усть-Каменогорского городского маслихата Восточно-Казахстанской области от 28 августа 2020 года № 60/5-VI (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
