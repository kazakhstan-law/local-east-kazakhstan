  title:
    rus: О внесении изменений в решение Усть-Каменогорского городского маслихата от 20 сентября 2018 года № 35/7-VI «Об оказании социальной поддержки специалистам государственных организаций, проживающим и работающим в сельских населенных пунктах города Усть-Каменогорска»
    kaz: Өскемен қалалық мәслихатының 2018 жылғы 20 қыркүйектегі № 35/7-VІ «Өскемен қаласының ауылдық елді мекендерінде тұратын және жұмыс істейтін мемлекеттік ұйымдардың мамандарына әлеуметтік қолдау көрсету туралы» шешіміне өзгерістер енгізу туралы
