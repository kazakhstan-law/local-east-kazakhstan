title:
  rus: О предоставлении в 2023 году мер социальной поддержки специалистам в области здравоохранения, образования и ветеринарии, прибывшим для работы и проживания в сельские населенные пункты города Усть-Каменогорска
  kaz: 2023 жылы Өскемен қаласының ауылдық елді мекендеріне жұмыс істеуге және тұруға келген денсаулық сақтау, білім беру және ветеринария саласындағы мамандарға әлеуметтік қолдау шараларын ұсыну туралы
