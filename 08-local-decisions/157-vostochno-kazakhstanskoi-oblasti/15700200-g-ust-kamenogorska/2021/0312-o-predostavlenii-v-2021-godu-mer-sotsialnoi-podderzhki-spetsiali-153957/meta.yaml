requisite: Решение Усть-Каменогорского городского маслихата Восточно-Казахстанской области от 12 марта 2021 года № 3/3-VII. Зарегистрировано Департаментом юстиции Восточно-Казахстанской области 30 марта 2021 года № 8482
title:
  rus: О предоставлении в 2021 году мер социальной поддержки специалистам в области здравоохранения, образования и ветеринарии, прибывшим для работы и проживания в сельские населенные пункты города Усть-Каменогорска
  kaz: 2021 жылы Өскемен қаласының ауылдық елді мекендеріне жұмыс істеуге және тұруға келген денсаулық сақтау, білім беру және ветеринария саласындағы мамандарға әлеуметтік қолдау шараларын ұсыну туралы
