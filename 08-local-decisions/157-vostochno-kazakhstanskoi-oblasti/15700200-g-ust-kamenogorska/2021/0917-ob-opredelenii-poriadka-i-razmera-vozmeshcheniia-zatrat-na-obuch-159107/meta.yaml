  title:
    rus: О внесении изменения в решение Усть-Каменогорского городского маслихата от 17 сентября 2021 года № 10/8 –VII «Об определении порядка и размера возмещения затрат на обучение на дому детей с ограниченными возможностями из числа детей с инвалидностью по индивидуальному учебному плану в городе Усть-Каменогорске»
    kaz: Өскемен қалалық мәслихатының 2021 жылғы 17 қыркүйектегі № 10/8-VII «Өскемен қаласында мүгедектігі бар  балалар қатарындағы кемтар балаларды жеке оқыту жоспары бойынша үйде оқытуға жұмсаған шығындарын өндіріп алу тәртібі мен мөлшерін айқындау туралы» шешіміне өзгеріс енгізу туралы
