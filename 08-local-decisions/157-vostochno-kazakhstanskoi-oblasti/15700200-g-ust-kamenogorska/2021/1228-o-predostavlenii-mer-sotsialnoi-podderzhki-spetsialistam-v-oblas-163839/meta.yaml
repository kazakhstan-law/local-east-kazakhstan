title:
  rus: О предоставлении мер социальной поддержки специалистам в области здравоохранения, образования и ветеринарии, прибывшим для работы и проживания в сельские населенные пункты города Усть-Каменогорска на 2022 год
  kaz: 2022 жылға Өскемен қаласының ауылдық елді мекендеріне жұмыс істеуге және тұруға келген денсаулық сақтау, білім беру және ветеринария саласындағы мамандарға әлеуметтік қолдау шараларын ұсыну туралы
