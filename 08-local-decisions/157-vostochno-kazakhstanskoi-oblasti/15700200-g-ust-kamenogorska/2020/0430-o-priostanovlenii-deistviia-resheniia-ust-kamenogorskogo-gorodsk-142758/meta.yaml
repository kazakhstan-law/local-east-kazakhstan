requisite: Решение Усть-Каменогорского городского маслихата Восточно-Казахстанской области от 30 апреля 2020 года № 55/3-VI. Зарегистрировано Департаментом юстиции Восточно-Казахстанской области 13 мая 2020 года № 7060. Утратило силу решением Усть-Каменогорского городского маслихата Восточно-Казахстанской области от 28 августа 2020 года № 60/5-VI (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: О приостановлении действия решения Усть-Каменогорского городского маслихата от 20 сентября 2018 года № 35/7-VI «Об оказании социальной поддержки специалистам государственных организаций, проживающим и работающим в сельских населенных пунктах города Усть-Каменогорска»
  kaz: Өскемен қалалық мәслихатының 2018 жылғы 20 қыркүйектегі № 35/7-VI «Өскемен қаласының ауылдық елді мекендерінде тұратын және жұмыс істейтін мемлекеттік ұйымдардың мамандарына әлеуметтік қолдау көрсету туралы» шешімінің қолданылуын тоқтата тұру туралы
