  title:
    rus: О внесении изменений в решение Курчатовского городского маслихата от 29 декабря 2021 года № 12/87-VII «Об определении порядка и размера возмещения затрат на обучение на дому детей с ограниченными возможностями из числа детей с инвалидностью по индивидуальному учебному плану в городе Курчатов»
    kaz: Курчатов қалалық мәслихатының 2021 жылғы 29 желтоқсандағы № 12/87-VII «Курчатов қаласында мүгедектігі бар балалар қатарындағы кемтар балаларды жеке оқыту жоспары бойынша үйде оқытуға жұмсаған шығындарын өндіріп алу тәртібі мен мөлшерін айқындау туралы» шешіміне өзгерістер енгізу туралы
