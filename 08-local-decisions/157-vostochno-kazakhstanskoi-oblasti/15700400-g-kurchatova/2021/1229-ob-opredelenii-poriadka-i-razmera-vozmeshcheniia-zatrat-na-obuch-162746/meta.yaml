requisite: Решение Курчатовского городского маслихата Восточно-Казахстанской области от 29 декабря 2021 года № 12/87-VII. Зарегистрировано в Министерстве юстиции Республики Казахстан 29 декабря 2021 года № 26182. Утратило силу решением Курчатовского городского маслихата области Абай от 21 февраля 2024 года № 15/88-VIII (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об определении порядка и размера возмещения затрат на обучение на дому детей с ограниченными возможностями из числа детей с инвалидностью по индивидуальному учебному плану в городе Курчатов
  kaz: Курчатов қаласында мүгедектігі бар балалар қатарындағы кемтар балаларды жеке оқыту жоспары бойынша үйде оқытуға жұмсаған шығындарын өндіріп алу тәртібі мен мөлшерін айқындау туралы
