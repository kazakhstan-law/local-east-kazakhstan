act_code: '145765'
requisite: Решение Курчатовского городского маслихата Восточно-Казахстанской области от 1 июля 2020 года № 43/333-VI. Зарегистрировано Департаментом юстиции Восточно-Казахстанской области 25 августа 2020 года № 7490
title:
  rus: Об определении специализированных мест для организации и проведения мирных собраний, порядка их использования, норм их предельной заполняемости, требований к их материально-техническому и организационному обеспечению, границ прилегающих территорий, в которых запрещено проведение пикетирования по городу Курчатов
  kaz: Курчатов қаласы бойынша бейбіт жиналыстарды ұйымдастыру және өткізу үшін арнайы орындарды, оларды пайдалану тәртібін, олардың шекті толу нормаларын, оларды материалдық-техникалық және ұйымдастырушылық қамтамасыз етуге қойылатын талаптарды, пикеттеуді өткізуге тыйым салынған іргелес аумақтардың шекараларын айқындау туралы
