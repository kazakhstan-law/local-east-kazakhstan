act_code: '44215'
requisite: Решение акима города Курчатова Восточно-Казахстанской области от 9 февраля 2009 года № 13. Зарегистрировано Управлением юстиции города Курчатова Департамента юстиции Восточно-Казахстанской области 13 февраля 2009 года за № 5-3-66. Утратило силу решением акима города Курчатова Восточно-Казахстанской области от 8 июня 2009 года № 2
title:
  rus: О проведении приписки граждан мужского пола Республики Казахстан, которым в год приписки исполняется семнадцать лет, а также юношей старших возрастов,  не прошедших ранее приписку, к призывному участку отдела по делам обороны города Курчатова в 2009 году
  kaz: 2009 жылы Курчатов қаласының қорғаныс істері жөніндегі бөлімінің шақыру учаскесіне тіркеу жылы он жеті жасқа толатын, сондай-ақ шақыру учаскесіне бұрын тіркелмеген Қазақстан Республикасының еркек жынысты азаматтарын тіркеуді өткізу туралы
