requisite: Решение акима города Курчатова Восточно-Казахстанской области от 22 декабря 2009 года № 6. Зарегистрировано в Управлении Юстиции города Курчатова Департамента юстиции Восточно-Казахстанской области 20 января 2010 года за № 5-3-87. Утратило силу решением акима города Курчатова Восточно-Казахстанской области от 29 июня 2010 года № 9
title:
  rus: О проведении приписки граждан мужского пола Республики Казахстан, которым в год приписки исполняется семнадцать лет, а также юношей старших возрастов, не прошедших ранее приписку, к призывному участку отдела по делам обороны города Курчатова в 2010 году
  kaz: 2010 жылы Курчатов қаласының қорғаныс істері жөніндегі бөлімінің шақыру учаскесіне тіркеу жылы он жеті жасқа толатын, сондай-ақ шақыру учаскесіне бұрын тіркелмеген Қазақстан Республикасының еркек жынысты азаматтарын тіркеуді өткізу туралы
