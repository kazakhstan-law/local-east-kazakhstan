act_code: '55875'
requisite: Решение акима города Курчатова Восточно-Казахстанской области от 29 ноября 2010 года № 12. Зарегистрировано Управлением юстиции города Курчатова Департамента юстиции Восточно-Казахстанской области 14 декабря 2010 года за № 5-3-97. Утратило силу решением акима города Курчатова Восточно-Казахстанской области от 19 мая 2011 года № 14
title:
  rus: О проведении приписки граждан мужского пола Республики Казахстан, которым в год приписки исполняется семнадцать лет, а также юношей старших возрастов, не прошедших ранее приписку, к призывному участку отдела по делам обороны города Курчатова в 2011 году
  kaz: 2011 жылы Курчатов қаласының қорғаныс істері жөніндегі бөлімінің шақыру учаскесіне тіркеу жылы он жеті жасқа толатын, сондай-ақ шақыру учаскесіне бұрын тіркелмеген Қазақстан Республикасының еркек жынысты азаматтарын тіркеуді өткізу туралы
