requisite: Решение Курчатовского городского маслихата Восточно-Казахстанской области от 14 сентября 2018 года № 24/191-VI. Зарегистрировано Управлением юстиции города Курчатова Департамента юстиции Восточно-Казахстанской области 12 октября 2018 года № 5-3-130. Утратило силу решением Курчатовского городского маслихата области Абай от 30 ноября 2023 года № 12/72-VIII (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
