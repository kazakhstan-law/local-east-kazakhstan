act_code: '222340'
requisite: Решение Шемонаихинского районного маслихата Восточно-Казахстанской области от 20 февраля 2026 года № 44/4-VIII
title:
  rus: О предоставлении мер социальной поддержки специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, государственным служащим аппаратов акимов сел, поселков, сельских округов, прибывшим для работы и проживания в сельские населенные пункты Шемонаихинского района на 2026 год
  kaz: Шемонаиха ауданының ауылдық елдi мекендеріне жұмыс iстеуге және тұруға келген денсаулық сақтау, бiлiм беру, әлеуметтiк қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға, ауылдар, кенттер, ауылдық округтер әкімдері аппараттарының мемлекеттік қызметшілеріне 2026 жылы әлеуметтiк қолдау шараларын ұсыну туралы
