requisite: Решение Шемонаихинского районного маслихата Восточно-Казахстанской области от 21 апреля 2014 года № 20/3-V. Зарегистрировано Департаментом юстиции Восточно-Казахстанской области 20 мая 2014 года № 3339. Утратило силу решением Шемонаихинского районного маслихата Восточно-Казахстанской области от 13 апреля 2022 года № 17/3-VII (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
