act_code: '141752'
requisite: Решение Шемонаихинского районного маслихата Восточно-Казахстанской области от 6 апреля 2020 года № 50/6-VI. Зарегистрировано Департаментом юстиции Восточно-Казахстанской области 13 апреля 2020 года № 6881. Утратило силу решением Шемонаихинского районного маслихата Восточно-Казахстанской области от 3 сентября 2020 года № 56/7-VI (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: О приостановлении действия решения Шемонаихинского районного маслихата от 25 октября 2018 года № 29/10-VI «Об оказании социальной поддержки специалистам государственных организаций, проживающим и работающим в сельских населенных пунктах Шемонаихинского района»
  kaz: Шемонаиха аудандық мәслихатының 2018 жылғы 25 қазандағы № 29/10-VI «Шемонаиха ауданының ауылдық елді мекендерінде тұратын және жұмыс істейтін мемлекеттік ұйымдардың мамандарына әлеуметтік қолдау көрсету туралы» шешімінің қолданылуын тоқтату туралы
