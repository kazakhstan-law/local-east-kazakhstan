    kaz: Шемонаиха аудандық мәслихатының 2020 жылғы 3 қыркүйектегі № 56/6-VI «Әлеуметтік көмек көрсетудің, оның мөлшерлерін белгілеудің және мұқтаж азаматтардың жекелеген санаттарының тізбесін айқындаудың қағидаларын бекіту туралы» шешіміне өзгерістер мен толықтырулар енгізу туралы
