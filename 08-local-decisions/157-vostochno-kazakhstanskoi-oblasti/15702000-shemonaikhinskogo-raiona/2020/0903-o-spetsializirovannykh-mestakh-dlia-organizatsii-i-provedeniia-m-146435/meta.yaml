  title:
    rus: О внесении изменений и дополнения в решение Шемонаихинского районного маслихата от 3 сентября 2020 года № 56/5-VI «О специализированных местах для организации и проведения мирных собраний, порядке их использования, нормах их предельной заполняемости, требованиях к их материально-техническому и организационному обеспечению, границах прилегающих территорий, в которых запрещено проведение пикетирования»
    kaz: Шемонаиха аудандық мәслихатының 2020 жылғы 3 қыркүйектегі № 56/5-VІ «Бейбіт жиналыстарды ұйымдастыру және өткізу үшін арнайы орындар, оларды пайдалану тәртібі, олардың шекті толу нормалары, олардың материалдық-техникалық және ұйымдастырушылық қамтамасыз етуге қойылатын талаптары, пикеттеуді өткізуге тыйым салынған іргелес аумақтардың шекараларын айқындау туралы» шешіміне өзгерістер мен толықтыру енгізу туралы
