requisite: Решение акима Шемонаихинского района Восточно-Казахстанской области от 9 января 2009 года № 2. Зарегистрировано Управлением юстиции Шемонаихинского района Департамента юстиции Восточно-Казахстанской области 19 января 2009 года за № 5-19-90. Утратило силу в связи с истечением срока действия - письмо акимата Шемонаихинского района от 15 января 2010 года № 2/83
title:
  rus: О проведении приписки граждан мужского пола, которым в год приписки исполняется семнадцать лет к призывному участку отдела по делам обороны Шемонаихинского района в 2009 году
  kaz: Шемонаиха ауданы қорғаныс істері жөніндегі бөлімінің шақыру учаскесіне тіркелетін жылы он жеті жасқа толатын еркек жынысты азаматтарды 2009 жылы тіркеуге алуды жүргізу туралы
