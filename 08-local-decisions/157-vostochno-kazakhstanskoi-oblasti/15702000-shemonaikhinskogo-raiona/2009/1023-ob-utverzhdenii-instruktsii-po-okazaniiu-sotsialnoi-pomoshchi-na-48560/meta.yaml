act_code: '48560'
requisite: Решение Шемонаихинского районного маслихата Восточно-Казахстанской области от 23 октября 2009 года № 21/6-IV. Зарегистрировано Управлением юстиции Шемонаихинского района Департамента юстиции Восточно-Казахстанской области 11 ноября 2009 года за № 5-19-107. Утратило силу - решением Шемонаихинского районного маслихата от 21 ноября 2012 года № 6/3-V
title:
  rus: Об утверждении Инструкции по оказанию социальной помощи на приобретение топлива специалистам государственных организаций здравоохранения, образования, социального обеспечения, культуры и спорта, проживающим и работающим в сельских населенных пунктах
  kaz: '"Ауылдық елді мекендерде тұратын және жұмыс істейтін мемлекеттік денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет және спорт ұйымдарының мамандарына отын сатып алуға әлеуметтік көмек көрсету жөніндегі нұсқаулығын" бекіту туралы'
