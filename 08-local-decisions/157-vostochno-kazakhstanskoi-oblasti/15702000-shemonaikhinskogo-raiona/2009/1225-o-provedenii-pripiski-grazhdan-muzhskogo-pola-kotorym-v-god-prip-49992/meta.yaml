requisite: Решение акима Шемонаихинского района Восточно-Казахстанской области от 25 декабря 2009 года № 04. Зарегистрировано Управлением юстиции Шемонаихинского района Департамента юстиции Восточно-Казахстанской области 14 января 2010 года за № 5-19-112. Прекращено действие по истечении срока, на который решение было принято (письмо акима Шемонаихинского района от 15 апреля 2011 года № 1/1205)
title:
  rus: О проведении приписки граждан мужского пола, которым в год приписки исполняется семнадцать лет к призывному участку отдела по делам обороны Шемонаихинского района в 2010 году
  kaz: Шемонаиха ауданы қорғаныс істері жөніндегі бөлімінің шақыру учаскесіне тіркелетін жылы он жеті жасқа толатын еркек жынысты азаматтарды 2010 жылы тіркеуге алуды жүргізу туралы
