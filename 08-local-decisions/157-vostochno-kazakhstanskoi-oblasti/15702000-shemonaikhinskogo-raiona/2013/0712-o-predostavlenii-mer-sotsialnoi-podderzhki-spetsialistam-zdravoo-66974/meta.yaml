requisite: Решение Шемонаихинского районного маслихата Восточно-Казахстанской области от 12 июля 2012 года № 4/6-V. Зарегистрировано Департаментом юстиции Восточно-Казахстанской области 6 августа 2012 года за № 2632. Прекращено действие по истечении срока, на который решение было принято (письмо Шемонаихинского районного маслихата от 14 января 2013 года № 14)
title:
  rus: О предоставлении мер социальной поддержки специалистам здравоохранения, образования, социального обеспечения, культуры, спорта и ветеринарии, прибывшим для работы и проживания в сельские населенные пункты на 2012 год
  kaz: 2012 жылға арналған ауылдық елді мекендерге жұмыс істеу және тұру үшін келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және ветеринария мамандарына әлеуметтік қолдау шараларын ұсыну туралы
