requisite: Решение Шемонаихинского районного маслихата Восточно-Казахстанской области от 16 июля 2013 года № 14/7-V. Зарегистрировано Департаментом юстиции Восточно-Казахстанской области 6 августа 2013 года № 3027. Прекращено действие по истечении срока, на который решение было принято (письмо Шемонаихинского районного маслихата от 27 декабря 2013 года № 253)
title:
