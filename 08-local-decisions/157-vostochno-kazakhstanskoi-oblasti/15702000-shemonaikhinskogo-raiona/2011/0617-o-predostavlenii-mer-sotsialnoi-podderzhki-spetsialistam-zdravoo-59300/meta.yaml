requisite: Решение Шемонаихинского районного маслихата Восточно-Казахстанской области от 17 июня 2011 года № 37/8-IV. Зарегистрировано Управлением юстиции Шемонаихинского района Департамента юстиции Восточно-Казахстанской области 22 июня 2011 года за № 5-19-151. Прекращено действие по истечении срока действия (письмо Шемонаихинского районного маслихата от 30 декабря 2011 года № 245)
title:
  rus: О предоставлении мер социальной поддержки специалистам здравоохранения, образования, социального обеспечения, культуры и спорта, прибывшим для работы и проживания в сельские населенные пункты, на 2011 год
  kaz: Ауылдық елді мекендерге жұмыс істеу және тұру үшін 2011 жылы келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет және спорт ұйымдарының мамандарына әлеуметтік қолдау шараларын ұсыну туралы
