requisite: Решение акима Шемонаихинского района Восточно-Казахстанской области от 18 ноября 2011 года № 01. Зарегистрировано Управлением юстиции Шемонаихинского района Департамента юстиции Восточно-Казахстанской области 9 декабря 2011 года за № 5-19-158. Прекращено действие по истечении срока, на который решение было принято (письмо аппарата акима Шемонаихинского района от 12 ноября 2012 года № 5/4072)
title:
  rus: О проведении приписки граждан мужского пола, которым в год приписки исполняется семнадцать лет, к призывному участку отдела по делам обороны Шемонаихинского района в 2012 году
  kaz: Шемонаиха ауданы қорғаныс істері жөніндегі бөлімнің шақыру учаскесіне тіркелетін жылы он жеті жасқа толатын еркек жынысты азаматтарды 2012 жылы тіркеуге алуды жүргізу туралы
