title:
  rus: Об отмене решения Шемонаихинского районного маслихата от 25 апреля 2023 года № 2/5-VIII«Об утверждении методики оценки деятельности административных государственных служащих корпуса «Б» государственного учреждения «Аппарат Шемонаихинского районного маслихата»
