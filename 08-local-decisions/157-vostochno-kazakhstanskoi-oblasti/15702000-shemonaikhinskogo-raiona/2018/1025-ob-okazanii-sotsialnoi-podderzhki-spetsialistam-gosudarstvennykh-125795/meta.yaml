act_code: '125795'
requisite: Решение Шемонаихинского районного маслихата Восточно-Казахстанской области от 25 октября 2018 года № 29/10-VI. Зарегистрировано Управлением юстиции Шемонаихинского района Департамента юстиции Восточно-Казахстанской области 2 ноября 2018 года № 5-19-192. Действие решения приостановлено до 1 октября 2020 года решением Шемонаихинского районного маслихата Восточно-Казахстанской области от 6 апреля 2020 года № 50/6-VI (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования). Утратило силу решением Шемонаихинского районного маслихата Восточно-Казахстанской области от 3 сентября 2020 года № 56/7-VI (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
