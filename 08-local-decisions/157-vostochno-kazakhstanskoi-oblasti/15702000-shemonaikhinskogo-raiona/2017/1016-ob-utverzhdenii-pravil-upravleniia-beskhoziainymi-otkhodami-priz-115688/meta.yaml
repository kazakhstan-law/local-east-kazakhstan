requisite: Решение Шемонаихинского районного маслихата Восточно-Казахстанской области от 16 октября 2017 года № 17/8-VI. Зарегистрировано Департаментом юстиции Восточно-Казахстанской области 1 ноября 2017 года № 5270. Утратило силу решением Шемонаихинского районного маслихата Восточно-Казахстанской области от 3 августа 2021 года № 6/7-VII (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования).   Действие решения приостановлено до 1 января 2021 года решением Шемонаихинского районного маслихата Восточно-Казахстанской области от 12 июня 2020 года № 53/6-VI (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
