  title:
    rus: О внесении изменения в решение Шемонаихинского районного маслихата от 25 сентября 2024 года № 21/6–VIII  «Об утверждении Правил и размера оказания социальной поддержки по оплате коммунальных услуг и приобретению топлива за счет бюджетных средств специалистам государственных организаций здравоохранения, социального обеспечения, образования, культуры, спорта и ветеринарии, проживающим и работающим в сельских населенных пунктах Шемонаихинского района»
    kaz: Шемонаиха аудандық мәслихатының 2024 жылғы 25 қыркүйектегі № 21/6–VIII «Шемонаиха ауданының ауылдық елді мекендерінде тұратын және жұмыс істейтін мемлекеттік денсаулық сақтау, әлеуметтік қамсыздандыру, білім беру, мәдениет, спорт және ветеринария ұйымдарының мамандарына бюджет қаражаты есебінен коммуналдық көрсетілетін қызметтерге ақы төлеу және отын сатып алу бойынша әлеуметтік қолдау көрсету қағидалары мен мөлшерін бекіту туралы» шешіміне өзгеріс енгізу туралы
