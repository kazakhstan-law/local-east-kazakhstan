act_code: '193332'
requisite: Решение Шемонаихинского районного маслихата Восточно-Казахстанской области от 9 февраля 2024 года № 13/5-VIII. Зарегистрировано Департаментом юстиции Восточно-Казахстанской области 15 февраля 2024 года № 8956-16
title:
  rus: Об определении специализированных мест для организации и проведения мирных собраний и норм их предельной заполняемости, требований к их материально- техническому и организационному обеспечению, порядка их использования, границ прилегающих территории, в которых запрещено проведение пикетирования по Шемонаихинскому району
  kaz: Шемонаиха ауданы бойынша бейбіт жиналыстарды ұйымдастыру және өткізу үшін арнайы орындарды және олардың шекті толу нормаларын, оларды материалдық техникалық және ұйымдастырушылық қамтамасыз етуге қойылатын талаптарды, пайдалану тәртібін, пикеттеуді өткізуге тиым салынған іргелес аумақтардың шекараларын айқындау туралы
