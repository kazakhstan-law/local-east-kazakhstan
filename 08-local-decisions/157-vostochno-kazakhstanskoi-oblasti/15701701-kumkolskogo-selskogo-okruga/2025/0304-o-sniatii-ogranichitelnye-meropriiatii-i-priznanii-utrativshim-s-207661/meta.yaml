act_code: '207661'
requisite: Решение акима Жетиаральского сельского округа Тарбагатайского района Восточно-Казахстанской области от 4 марта 2025 года № 3
title:
  rus: О снятии ограничительные мероприятий и признании утратившим силу решения акима Жетиаральского сельского округа Тарбагатайского района Восточно-Казахстанской области от 24 декабря 2024 года № 13 " Об установлении ограничений во дворе  жителя села Камысты Жетиаральского сельского округа Тарбагатайского района С.Камитжанова
  kaz: Шығыс Қазақстан облысы Тарбағатай ауданы Жетіарал ауылдық округі әкімінің 2024 жылғы 24 желтоқсандағы «Тарбағатай ауданының Жетіарал ауылдық округіне қарасты Қамысты ауылының тұрғыны С.Камитжановтың ауласына шектеу шараларын белгілеу туралы» № 13 шешімінің күшін жою және шектеуді алып тастау туралы
