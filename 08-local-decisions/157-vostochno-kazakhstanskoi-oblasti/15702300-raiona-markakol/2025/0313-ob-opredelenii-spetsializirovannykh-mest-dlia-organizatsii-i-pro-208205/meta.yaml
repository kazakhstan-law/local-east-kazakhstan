act_code: '208205'
requisite: Решение маслихата района Марқакөл Восточно-Казахстанской области от 13 марта 2025 года № 20/2-VIII. Зарегистрировано Департаментом юстиции Восточно-Казахстанской области 18 марта 2025 года № 9152-16
title:
  rus: Об определении специализированных мест для организации и проведения мирных собраний, и норм их предельной заполняемости, требований к их материально-техническому и организационному обеспечению, порядка их использования, границ прилегающих территорий, в которых запрещено проведение пикетирования по району Марқакөл
  kaz: Марқакөл ауданы бойынша бейбіт жиналыстарды ұйымдастыру және өткізу үшін арнайы орындарды және олардың шекті толу нормаларын, оларды материалдық-техникалық және ұйымдастырушылық қамтамасыз етуге қойылатын талаптарды, пайдалану тәртібін, пикеттеуді өткізуге тыйым салынған іргелес аумақтардың шекараларын айқындау туралы
