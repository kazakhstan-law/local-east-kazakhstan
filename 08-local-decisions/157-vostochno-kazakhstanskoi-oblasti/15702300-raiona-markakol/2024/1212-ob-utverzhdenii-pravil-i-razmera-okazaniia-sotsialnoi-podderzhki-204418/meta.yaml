  title:
    rus: О внесении изменения в решение маслихата района Марқакөл от 12 декабря 2024 года № 15/2-VIII «Об утверждении Правил и размера оказания социальной поддержки по оплате коммунальных услуг и приобретению топлива за счет бюджетных средств специалистам государственных организаций здравоохранения, образования, социального обеспечения, культуры, спорта и ветеринарии, проживающим и работающим в сельских населенных пунктах района Марқакөл»
    kaz: Марқакөл аудандық мәслихатының 2024 жылғы 12 желтоқсандағы № 15/2-VIII «Марқакөл ауданының ауылдық елді мекендерінде тұратын және жұмыс істейтін мемлекеттік денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және ветеринария ұйымдарының мамандарына бюджет қаражаты есебiнен коммуналдық көрсетілетін қызметтерге ақы төлеу және отын сатып алу бойынша әлеуметтік қолдау көрсету қағидалары мен мөлшерін бекіту туралы» шешіміне өзгеріс енгізу туралы
