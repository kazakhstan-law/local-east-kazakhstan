act_code: '130897'
requisite: Решение Урджарского районного маслихата Восточно-Казахстанской области от 16 апреля 2019 года № 40-435/VI. Зарегистрировано Департаментом юстиции Восточно-Казахстанской области 24 апреля 2019 года № 5880. Утратило силу решением Урджарского районного маслихата Восточно-Казахстанской области от 15 ноября 2019 года № 46-509/VI (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: О продлении срока действия решения Урджарского районного маслихата от 19 февраля 2019 года № 38-415/VI «О приостановлении действия решения Урджарского районного маслихата от 05 сентября 2018 года № 31-322/VI «Об утверждении норм образования и накопления коммунальных отходов в селе Кабанбай и на побережье озера Алаколь Урджарского района Восточно-Казахстанской области»
  kaz: Үржар аудандық мәслихатының 2019 жылғы 19 ақпандағы № 38-415/VI «Үржар аудандық мәслихатының 2018 жылғы 05 қыркүйектегі № 31-322/VI «Шығыс Қазақстан облысы Үржар ауданының Қабанбай ауылында және Алакөл көлінің жағалауында коммуналдық қалдықтардың түзілу және жинақталу нормаларын бекіту туралы» шешімінің қолданылуын тоқтата тұру туралы» шешімінің қолданылу мерзімін ұзарту туралы
