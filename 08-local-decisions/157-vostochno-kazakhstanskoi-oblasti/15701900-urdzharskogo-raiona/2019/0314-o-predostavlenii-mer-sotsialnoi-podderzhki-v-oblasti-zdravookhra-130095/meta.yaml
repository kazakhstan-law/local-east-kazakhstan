act_code: '130095'
requisite: Решение Урджарского районного маслихата Восточно-Казахстанской области от 14 марта 2019 года № 39-426/VI. Зарегистрировано Департаментом юстиции Восточно-Казахстанской области 29 марта 2019 года № 5809. Утратило силу решением Урджарского районного маслихата Восточно-Казахстанской области от 10 января 2020 года № 48-568/VI (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: О предоставлении мер социальной поддержки в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания в сельские населенные пункты Урджарского района на 2019 год
  kaz: Үржар ауданның ауылдық елді мекендеріне жұмыс істеу және тұру үшін келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға 2019 жылға әлеуметтік қолдау шараларын көрсету туралы
