  requisite: Решение Урджарского районного маслихата Восточно-Казахстанской области от 4 июля 2019 года № 43-481/VI. Зарегистрировано Департаментом юстиции Восточно-Казахстанской области 5 июля 2019 года № 6058. Утратило силу решением Урджарского районного маслихата Восточно-Казахстанской области от 11 ноября 2021 года № 10-137/VII (вводится в действие со дня его принятия)
  title:
    rus: О внесении изменения в решение Урджарского районного маслихата от 14 марта 2019 года № 39-426/VI «О предоставлении мер социальной поддержки специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания в сельские населенные пункты Урджарского района на 2019 год»
    kaz: Үржар аудандық мәслихатының 2019 жылғы 14 наурыздағы № 39-426/VI «Үржар ауданның ауылдық елді мекендеріне жұмыс істеу және тұру үшін келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға 2019 жылға әлеуметтік қолдау шараларын көрсету туралы» шешіміне өзгеріс енгізу туралы
