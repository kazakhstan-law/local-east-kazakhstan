act_code: '129342'
requisite: Решение Урджарского районного маслихата Восточно-Казахстанской области от 19 февраля 2019 года № 38-416/VI. Зарегистрировано Департаментом юстиции Восточно-Казахстанской области 26 февраля 2019 года № 5739. Утратило силу решением Урджарского районного маслихата Восточно-Казахстанской области от 15 ноября 2019 года № 46-509/VI (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: О приостановлении действия решения Урджарского районного маслихата от 05 сентября 2018 года № 31-323/VI «Об утверждении тарифов на сбор, вывоз, утилизацию, переработку и захоронение твердых бытовых отходов в селе Кабанбай и на побережье озера Алаколь Урджарского района Восточно-Казахстанской области»
  kaz: Үржар аудандық мәслихатының 2018 жылғы 05 қыркүйектегі № 31-323/VI «Шығыс Қазақстан облысы Үржар ауданының Қабанбай ауылында және Алакөл көлінің жағалауында тұрмыстық қатты қалдықтарды жинауға, әкетуге, кәдеге жаратуға, қайта өңдеуге және көмуге арналған тарифтерді бекіту туралы» шешімінің қолданылуын тоқтата тұру туралы
