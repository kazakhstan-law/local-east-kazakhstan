act_code: '150777'
requisite: Решение Урджарского районного маслихата Восточно-Казахстанской области от 22 декабря 2020 года № 57-747/VI. Зарегистрировано Департаментом юстиции Восточно-Казахстанской области 28 декабря 2020 года № 8061. Утратило силу решением Урджарского районного маслихата Восточно-Казахстанской области от 30 декабря 2021 года № 12-198/VII (вводится в действие с 01.01.2022)
title:
  rus: О предоставлении мер социальной поддержки специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, государственным служащим аппаратов акимов сельских округов, прибывшим для работы и проживания в сельские населенные пункты Урджарского района на 2021 год
  kaz: Үржар ауданның ауылдық елді мекендеріне жұмыс істеу және тұру үшін келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға, ауылдық округтер әкімдері аппараттарының мемлекеттік қызметшілеріне 2021 жылға әлеуметтік қолдау шараларын ұсыну туралы
