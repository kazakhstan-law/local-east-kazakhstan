act_code: '145019'
requisite: Решение Урджарского районного маслихата Восточно-Казахстанской области от 24 июня 2020 года № 53-657/VI. Зарегистрировано Департаментом юстиции Восточно-Казахстанской области 22 июля 2020 года № 7387. Утратило силу решением Урджарского районного маслихата области Абай от 20 января 2024 года № 11-230/VIII (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об определении специализированных мест для организации и проведения мирных собраний в Урджарском районе, порядке их использования, нормах их предельной заполняемости, требованиях к их материально-техническому и организационному обеспечению, границах прилегающих территорий, в которых запрещено проведение пикетирования
  kaz: Үржар ауданында бейбіт жиналыстарды ұйымдастыру және өткізу үшін арнайы орындарды, оларды пайдалану тәртібін, олардың шекті толу нормаларын, олардың материалдық-техникалық және ұйымдастырушылық қамтамасыз етуге қойылатын талаптарды, пикеттеуді өткізуге тыйым салынған іргелес аумақтардың шекараларын айқындау туралы
