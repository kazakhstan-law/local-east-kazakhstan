act_code: '140281'
requisite: Решение Урджарского районного маслихата Восточно-Казахстанской области от 26 февраля 2020 года № 50-582/VI. Зарегистрировано Департаментом юстиции Восточно-Казахстанской области 13 марта 2020 года № 6764. Утратило силу решением Урджарского районного маслихата Восточно-Казахстанской области от 22 декабря 2020 года № 57-747/VI (вводится в действие с 01.01.2021)
title:
  rus: О предоставлении мер социальной поддержки специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, государственным служащим аппаратов акимов сельских округов, прибывшим для работы и проживания в сельские населенные пункты Урджарского района на 2020 год
  kaz: 2020 жылға Үржар ауданының ауылдық елді мекендеріне жұмыс істеуге және тұруға келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға, ауылдық округтер әкімдері аппараттарының мемлекеттік қызметшілеріне әлеуметтік қолдау шараларын ұсыну туралы
