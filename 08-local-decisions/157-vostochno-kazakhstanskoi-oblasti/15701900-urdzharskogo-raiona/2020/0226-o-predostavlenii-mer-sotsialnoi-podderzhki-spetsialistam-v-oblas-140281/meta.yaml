  title:
    rus: О внесении изменений в решение Урджарского районного маслихата от 26 февраля 2020 года № 50-582/VI «О предоставлении мер социальной поддержки специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания в сельские населенные пункты Урджарского района на 2020 год
    kaz: Үржар аудандық мәслихатының 2020 жылғы 26 ақпандағы № 50-582/VI «Үржар ауданның ауылдық елді мекендеріне жұмыс істеу және тұру үшін келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға 2020 жылға әлеуметтік қолдау шараларын көрсету туралы» шешіміне өзгерістер енгізу туралы
