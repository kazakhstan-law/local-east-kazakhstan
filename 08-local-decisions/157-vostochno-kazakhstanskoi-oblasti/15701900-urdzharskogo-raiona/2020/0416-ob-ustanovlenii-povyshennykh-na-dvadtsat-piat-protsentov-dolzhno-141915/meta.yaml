  title:
    rus: О внесении изменений в решение Урджарского районного маслихата от 16 апреля 2020 года № 51-626/VI «Об установлении повышения не менее чем на двадцать пять процентов должностных окладов и тарифных ставок специалистам в области социального обеспечения, образования, культуры и спорта являющимся гражданскими служащими и работающими в сельской местности»
    kaz: Үржар аудандық мәслихатының 2020 жылғы 16 сәуірдегі № 51-626/VI «Азаматтық қызметшілер болып табылатын және ауылдық жерде жұмыс істейтін әлеуметтік қамсыздандыру, білім беру, мәдениет және спорт саласындағы мамандарға кемінде жиырма бес пайызға жоғарылатылған лауазымдық айлықақылар мен тарифтік мөлшерлемелерге белгілеу туралы» шешіміне өзгерістер енгізу туралы
