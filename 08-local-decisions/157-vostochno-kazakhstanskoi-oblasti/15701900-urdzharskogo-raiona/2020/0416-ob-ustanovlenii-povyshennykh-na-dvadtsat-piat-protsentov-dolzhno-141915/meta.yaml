act_code: '141915'
requisite: Решение Урджарского районного маслихата Восточно-Казахстанской области от 16 апреля 2020 года № 51-626/VI. Зарегистрировано Департаментом юстиции Восточно-Казахстанской области 16 апреля 2020 года № 6928
title:
  rus: Об установлении повышенных на двадцать пять процентов должностных окладов и тарифных ставок специалистам в области социального обеспечения и культуры являющимся гражданскими служащими и работающим в сельской местности по сравнению с окладами и ставками гражданских служащих, занимающихся этими видами деятельности в городских условиях
  kaz: Азаматтық қызметшілер болып табылатын және ауылдық жерде жұмыс істейтін әлеуметтік қамсыздандыру және мәдениет саласындағы мамандарға қызметтің осы түрлерімен қалалық жағдайда айналысатын азаматтық қызметшілердің айлықақыларымен және мөлшерлемелерімен салыстырғанда жиырма бес пайызға жоғарылатылған лауазымдық айлықақылар мен тарифтік  мөлшерлемелерді белгілеу туралы
