  title:
    rus: О признании утратившим силу решения Урджарского районного маслихата № 24-249/VI от 12 марта 2018 года «Об определении размеров предоставления мер социальной поддержки специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания в сельские населенные пункты Урджарского района на 2018 год»
    kaz: Үржар аудандық мәслихатының 2018 жылғы 12 наурыздағы № 24-249/VI шешімнің «2018 жылға арналған Үржар ауданының ауылдық елді мекендеріне жұмыс істеу және тұру үшін келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға әлеуметтік қолдау шараларын ұсыну мөлшерлерін айқындау туралы» күші жойылды деп тану туралы
