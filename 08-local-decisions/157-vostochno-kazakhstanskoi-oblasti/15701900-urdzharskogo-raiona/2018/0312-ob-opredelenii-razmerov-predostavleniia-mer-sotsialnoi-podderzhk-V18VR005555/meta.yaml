requisite: Решение Урджарского районного маслихата Восточно-Казахстанской области от 12 марта 2018 года № 24-249/VI. Зарегистрировано Департаментом юстиции Восточно-Казахстанской области 26 марта 2018 года № 5555. Утратило силу решением Урджарского районного маслихата Восточно-Казахстанской области от 28 декабря 2018 года № 36-403/VI
title:
  rus: Об определении размеров предоставления мер социальной поддержки специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания в сельские населенные пункты Урджарского района на 2018 год
  kaz: 2018 жылға арналған Үржар ауданының ауылдық елді мекендеріне жұмыс істеу және тұру үшін келген денсаулық сақтау, білім  беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға әлеуметтік қолдау шараларын ұсыну мөлшерлерін айқындау туралы
