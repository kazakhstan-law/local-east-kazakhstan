requisite: Решение Урджарского районного маслихата Восточно-Казахстанской области от 5 сентября 2018 года № 31-322/VI. Зарегистрировано Управлением юстиции Урджарского района Департамента юстиции Восточно-Казахстанской области 27 сентября 2018 года № 5-18-164. Действие решения приостановлено решением Урджарского районного маслихата от 19 февраля 2019 года № 38-415/VI. Утратило силу решением Урджарского районного маслихата Восточно-Казахстанской области от 15 ноября 2019 года № 46-509/VI (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении норм образования и накопления коммунальных отходов в селе Кабанбай и на побережье озера Алаколь Урджарского района Восточно-Казахстанской области
