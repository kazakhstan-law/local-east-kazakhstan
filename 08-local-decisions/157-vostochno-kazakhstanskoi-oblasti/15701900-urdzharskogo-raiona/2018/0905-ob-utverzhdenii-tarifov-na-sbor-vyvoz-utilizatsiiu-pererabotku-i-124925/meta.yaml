    kaz: Үржар аудандық мәслихатының 2018 жылғы 05 қыркүйектегі № 31-323/VI «Шығыс Қазақстан облысы Үржар ауданының Қабанбай ауылында және Алакөл көлінің жағалауында тұрмыстық қатты қалдықтарды жинауға, әкетуге, кәдеге жаратуға, қайта өңдеуге және көмуге арналған тарифтерді бекіту туралы» шешімінің қолданылуын тоқтата тұру туралы
