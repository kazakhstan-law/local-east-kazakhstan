act_code: '67959'
requisite: Решение маслихата Урджарского района Восточно-Казахстанской области от 25 сентября 2012 года № 6-52/V. Зарегистрировано Департаментом юстиции Восточно-Казахстанской области 10 октября 2012 года за № 2701. Прекращено действие по истечении срока действия (письмо Урджарского районного маслихата от 21 декабря 2012 года № 187-03/12)
title:
  rus: Об определении размеров мер социальной поддержки на 2012 год специалистам здравоохранения, образования, социального обеспечения, культуры, спорта и ветеринарии, прибывшим для работы и проживания в сельские населенные пункты района
  kaz: Ауылдық елді мекендеріне жұмыс істеу және тұру үшін келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және ветеринария мамандарына 2012 жылға әлеуметтік қолдау шараларының мөлшерін белгілеу туралы
