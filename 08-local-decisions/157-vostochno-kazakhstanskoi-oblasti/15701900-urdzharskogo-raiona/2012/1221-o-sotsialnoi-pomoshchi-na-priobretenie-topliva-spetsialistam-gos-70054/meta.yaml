requisite: Решение маслихата Урджарского района Восточно-Казахстанской области от 21 декабря 2012 года № 9-78/V. Зарегистрировано Департаментом юстиции Восточно-Казахстанской области 11 января 2013 года № 2816. Утратило силу решением Урджарского районного маслихата Восточно-Казахстанской области от 16 ноября 2018 года № 34-353/VI
title:
  rus: О социальной помощи на приобретение топлива специалистам государственных организаций здравоохранения, социального обеспечения, образования, культуры, спорта и ветеринарии, проживающим и работающим в сельских населенных пунктах
  kaz: Ауылдық елді мекендерде тұратын және жұмыс істейтін мемлекеттік денсаулық сақтау, әлеуметтік қамсыздандыру, білім беру, мәдениет, спорт және ветеринария ұйымдарының мамандарына отын сатып алуға әлеуметтік көмек туралы
