requisite: Шығыс Қазақстан облысы Үржар аудандық мәслихатының 2005 жылғы 8 ақпандағы № 11-90-3 шешімі. Шығыс Қазақстан облысының Әділет департаментінде 2005 жылғы 23 ақпанда № 2193 тіркелді. Күші жойылды - Үржар аудандық мәслихатының 2009 жылғы 21 сәуірдегі № 5-60-IV шешімімен
