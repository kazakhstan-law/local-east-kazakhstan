act_code: '164835'
requisite: Решение Урджарского районного маслихата Восточно-Казахстанской области от 17 февраля 2022 года № 13-211/VII. Утратило силу решением Урджарского районного маслихата области Абай от 22 декабря 2022 года № 22-366/VII (вводится в действие с 01.01.2023)
title:
  rus: О предоставлении мер социальной поддержки специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, государственным служащим аппаратов акимов сельских округов, прибывшим для работы и проживания  в сельские населенные пункты Урджарского района на 2022 год
  kaz: Үржар ауданының ауылдық елді мекендеріне жұмыс істеу және тұру үшін келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға, ауылдық округтер әкімдері аппараттарының мемлекеттік қызметшілеріне 2022 жылға әлеуметтік қолдау шараларын ұсыну туралы
