act_code: '60924'
requisite: Решение Урджарского районного маслихата Восточно-Казахстанской области от 10 октября 2011 года № 31-336-IV. Зарегистрировано Управлением юстиции Урджарского района Департамента юстиции Восточно-Казахстанской области 25 октября 2011 года за № 5-18-131. Прекращено действие по истечении срока действия (письмо Урджарского районного маслихата от 26 декабря 2011 года № 163-03/11)
title:
  rus: Об определении мер социальной поддержки на 2011 год специалистам  здравоохранения, образования, социального обеспечения, культуры и спорта, прибывшим для работы и проживания в сельские населенные пункты района
  kaz: Ауданның ауылдық елді мекендеріне жұмыс істеуге және тұруға келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет және спорт мамандарына 2011 жылға әлеуметтік қолдау шараларын айқындау туралы
