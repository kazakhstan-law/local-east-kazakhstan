requisite: Решение Урджарского районного маслихата Восточно-Казахстанской области от 4 марта 2016 года № 41-485/V. Зарегистрировано Департаментом юстиции Восточно-Казахстанской области 30 марта 2016 года № 4456. Утратило силу - решением Урджарского районного маслихата Восточно-Казахстанской области от 24 апреля 2018 года № 27-282/VI
title:
  rus: О повышении базовых ставок земельного налога и ставок единого земельного налога на не используемые в соответствии с земельным законодательством Республики Казахстан земли сельскохозяйственного назначения Урджарского района
  kaz: Қазақстан Республикасының жер заңнамасына сәйкес пайдаланылмайтын Үржар ауданының ауыл шаруашылығы мақсатындағы жерлерге жер салығының базалық мөлшерлемелерін және бірыңғай жер салығының  мөлшерлемелерін жоғарылату туралы
