requisite: Шығыс Қазақстан облысы Үржар аудандық мәслихатынын 2008 жылғы 24 желтоқсандағы № 3-31-IV шешімі. Шығыс Қазақстан облысы Әділет департаментінің Үржар аудандық Әділет басқармасында 2008 жылғы 8 қаңтарында № 5-18-53 тіркелді. Күші жойылды - Үржар аудандық мәслихатының 2009 жылғы 21 сәуірдегі № 5-60-IV шешімімен
