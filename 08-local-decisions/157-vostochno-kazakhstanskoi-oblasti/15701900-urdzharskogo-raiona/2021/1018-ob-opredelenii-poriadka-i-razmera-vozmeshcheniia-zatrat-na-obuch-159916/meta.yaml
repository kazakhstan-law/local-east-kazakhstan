  title:
    rus: О внесении изменений в решение Урджарского районного маслихата от 18 октября 2021 года № 9-133/VII «Об определении порядка и размера возмещения затрат на обучение на дому детей с ограниченными возможностями из числа  инвалидов по индивидуальному учебному  плану в Урджарском районе»
    kaz: Үржар аудандық мәслихатының 2021 жылғы 18 қазандағы № 9-133/VII «Үржар ауданында мүгедектер қатарындағы кемтар балаларды жеке оқыту жоспары бойынша үйде оқытуға жұмсаған шығындарын өндіріп алу тәртібін мен мөлшерін айқындау туралы» шешіміне өзгерістер енгізу туралы
