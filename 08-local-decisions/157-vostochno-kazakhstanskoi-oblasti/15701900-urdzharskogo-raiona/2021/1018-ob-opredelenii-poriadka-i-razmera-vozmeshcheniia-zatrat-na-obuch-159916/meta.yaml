  title:
    rus: О внесении изменения в решение Урджарского районного маслихата от 18 октября 2021 года № 9-133/VII «Об определении порядка и размера возмещения затрат на обучение на дому детей с ограниченными возможностями из числа детей с инвалидностью по индивидуальному учебному плану в Урджарском районе»
    kaz: Үржар аудандық мәслихатының 2021 жылғы 18 қазандағы № 9-133/VII «Үржар ауданында мүгедектігі бар балалар қатарындағы кемтар балаларды жеке оқыту жоспары бойынша үйде оқытуға жұмсаған шығындарын өндіріп алу тәртібі мен мөлшерін айқындау туралы» шешіміне өзгеріс енгізу туралы
