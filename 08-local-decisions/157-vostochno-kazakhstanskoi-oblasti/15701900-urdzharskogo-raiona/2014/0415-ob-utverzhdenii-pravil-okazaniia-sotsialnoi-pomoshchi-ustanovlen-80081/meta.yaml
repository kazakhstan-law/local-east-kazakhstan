    kaz: Үржар аудандық мәслихатының 2014 жылғы 15 сәуірдегі № 24-253/V «Әлеуметтік көмек көрсетудің, мөлшерлерін белгілеудің және мұқтаж азаматтардың жекелеген санаттарының тізбесін айқындаудың Қағидаларын бекіту туралы» шешіміне өзгерістер енгізу туралы
