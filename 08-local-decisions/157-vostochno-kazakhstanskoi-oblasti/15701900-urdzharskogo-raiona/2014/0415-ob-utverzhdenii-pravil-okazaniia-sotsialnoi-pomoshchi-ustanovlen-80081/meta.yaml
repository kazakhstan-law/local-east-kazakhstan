  title:
    rus: О внесении изменений и дополнений в решение Урджарского районного маслихата от 15 апреля 2014 года № 24-253/V «Об утверждении Правил оказания социальной помощи, установления размеров и определения перечня отдельных категорий нуждающихся граждан»
    kaz: Үржар аудандық мәслихатының 2014 жылғы 15 сәуірдегі «Әлеуметтік көмек көрсетудің, мөлшерлерін белгілеудің және мұқтаж азаматтардың жекелеген санаттарының тізбесін айқындаудың Қағидаларын бекіту туралы» № 24-253/V шешіміне өзгерістер мен толықтырулар енгізу туралы
