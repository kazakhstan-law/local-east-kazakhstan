  title:
    rus: О внесении изменений в решение Урджарскогорайонного маслихата от 15 апреля 2014 года № 24-253/V "Об утверждении Правил оказания социальной помощи, установления  размеров и определения перечня  отдельных категорий нуждающихся граждан"
    kaz: Үржар аудандық  мәслихатының 2014 жылғы 15  сәүірдегі  № 24-253/V «Әлеуметтік көмек көрсетудің, мөлшерлерін белгілеудің   және  мұқтаж  азаматтардың жекелеген  санаттарының тізбесін  айқындаудың  Қағидаларын бекіту туралы»   шешіміне өзгерістер  енгізу туралы айқындаудың  Қағидаларын бекіту туралы»   шешіміне өзгерістер  енгізу туралы
