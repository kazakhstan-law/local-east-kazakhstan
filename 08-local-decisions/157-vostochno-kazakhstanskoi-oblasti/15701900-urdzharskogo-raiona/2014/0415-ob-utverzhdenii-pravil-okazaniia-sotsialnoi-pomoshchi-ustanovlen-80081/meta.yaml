  title:
    rus: О внесении изменений и дополнений в решение Урджарского районного маслихата от 15 апреля 2014 года № 24-253/V «Об утверждении правил оказания социальной помощи, установления размеров и определения перечня отдельных категорий нуждающихся граждан»
    kaz: Үржар аудандық мәслихатының 2014 жылдың 15 сәуіріндегі № 24-253/V «Әлеуметтік көмек көрсетудің, оның мөлшерлерін белгілеудің және мұқтаж азаматтардың жекелеген санаттарының тізбесін айқындаудың қағидаларын бекіту туралы» шешіміне өзгерістер мен толықтырулар енгізу туралы
