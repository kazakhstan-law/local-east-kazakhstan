requisite: Решение Урджарского районного маслихата Восточно-Казахстанской области от 15 апреля 2014 года № 24-250/V. Зарегистрировано Департаментом юстиции Восточно-Казахстанской области 14 мая 2014 года № 3323. Прекращено действие по истечении срока, на который решение было принято - (письмо аппарата Урджарского районного маслихата Восточно-Казахстанской области от 15 декабря 2014 года № 220-03/14)
title:
  rus: О предоставлении мер социальной поддержки специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания в сельские населенные пункты на 2014 год
  kaz: 2014 жылға арналған ауылдық елді мекендерге жұмыс істеуге және тұруға келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға әлеуметтік қолдау шараларын ұсыну туралы
