act_code: '50162'
requisite: Шығыс Қазақстан облысы Үржар ауданы әкімінің 2010 жылғы 15 қаңтардағы № 2 шешімі. Шығыс Қазақстан облысы Әділет департаментінің Үржар аудандық әділет басқармасында 2010 жылғы 25 қаңтарда № 5-18-90 тіркелді. Күші жойылды - ШҚО Үржар ауданы әкімінің 2010 жылғы 23 сәуірдегі № 16 шешімімен
title:
