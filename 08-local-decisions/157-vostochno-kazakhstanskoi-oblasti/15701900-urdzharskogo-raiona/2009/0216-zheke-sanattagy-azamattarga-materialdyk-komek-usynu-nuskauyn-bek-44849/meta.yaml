requisite: Шығыс Қазақстан облысы Үржар аудандық мәслихатының 2009 жылғы 16 ақпандағы № 11-116-IV шешімі. Шығыс Қазақстан облысы Әділет департаментінің Үржар аудандық Әділет басқармасында 2009 жылғы 6 наурызда № 5-18-76 тіркелді. Күші жойылды - Үржар аудандық мәслихатының 2012 жылғы 9 шілдедегі № 4-41-V шешімімен
