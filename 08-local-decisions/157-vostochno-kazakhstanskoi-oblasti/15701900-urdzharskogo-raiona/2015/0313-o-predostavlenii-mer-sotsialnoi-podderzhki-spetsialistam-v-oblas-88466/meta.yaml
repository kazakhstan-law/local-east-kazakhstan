requisite: Решение Урджарского районного маслихата Восточно-Казахстанской области от 13 марта 2015 года № 31-352/V. Зарегистрировано Департаментом юстиции Восточно-Казахстанской области 06 апреля 2015 года № 3836. Утратило силу - решением Урджарского районного маслихата Восточно-Казахстанской области от 04 марта 2016 года № 41-486/V
title:
  rus: О предоставлении мер социальной поддержки  специалистам в области здравоохранения,  образования, социального обеспечения,  культуры, спорта и агропромышленного  комплекса, прибывшим для работы и проживания  в сельские населенные пункты  на 2015 год
  kaz: 2015 жылға арналған ауылдық елді мекендерге жұмыс істеуге және тұруға келген денсаулық сақтау,  білім беру, әлеуметтік қамсыздандыру,  мәдениет, спорт және агроөнеркәсіптік  кешен  саласындағы мамандарға  әлеуметтік қолдау шараларын ұсыну   туралы
