act_code: '43480'
requisite: Шығыс Қазақстан облысы Үржар ауданы әкімінің 2008 жылғы 24 желтоқсандағы № 28 шешімі. Шығыс Қазақстан облысы Әділет департаментінің Үржар аудандық Әділет басқармасында 2009 жылғы 12 қаңтарда № 5-18-72 тіркелді. Мерзімінің өтуіне байланысты күші жойылды - Үржар ауданы әкімінің аппаратының 2009 жылғы 17 маусымдағы № 393 хатымен
title:
  rus: Шығыс Қазақстан облысы Үржар аудандық қорғаныс істері жөніндегі бөлімнің әскерге шақыру учаскесіне 1992 жылы туған жасөспірімдерді тізімге алынуын өткізу туралы
