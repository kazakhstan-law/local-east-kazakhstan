requisite: Шығыс Қазақстан облысы Үржар аудандық мәслихатының 2008 жылғы 8 шілдедегі № 6-69-IV шешімі. Шығыс Қазақстан облысы Әділет департаментінің Үржар аудандық Әділет басқармасында 2008 жылғы 12 тамызда № 5-18-67 тіркелді. Күші жойылды - Үржар аудандық мәслихатының 2012 жылғы 9 шілдедегі № 4-41/V шешімімен
title:
