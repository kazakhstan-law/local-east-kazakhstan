act_code: '40071'
requisite: Шығыс Қазақстан облысы Үржар аудандық мәслихатының 2008 жылғы 21 сәуірдегі № 5-50-IV шешімі. Шығыс Қазақстан облысы Әділет департаментінің Үржар аудандық Әділет басқармасында 2008 жылғы 21 мамырда № 5-18-65 тіркелді. Күші жойылды - ШҚО Үржар аудандық мәслихатының 2010 жылғы 19 сәуірдегі № 19-192 шешімімен
