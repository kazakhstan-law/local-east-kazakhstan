requisite: Шығыс Қазақстан облысы Үржар аудандық мәслихатының 2008 жылғы 26 желтоқсандағы № 9-93-IV шешімі. Шығыс Қазақстан облысы Әділет департаментінің Үржар аудандық әділет басқармасында 2009 жылғы 9 қаңтарда № 5-18-71 тіркелді. Күші жойылды - қабылданған мерзімінің бітуіне байланысты (Үржар аудандық әділет басқармасының 2010 жылғы 11 қаңтардағы № 152 хаты)
