title:
  rus: Об установлении публичного сервитута на земельный участок для складирования грунта при проведении дноуглубительных, берегоукрепительных работ на реке Иртыш в районе села Прапорщиково товариществу с ограниченной ответственностью «AKKY Ltd»
  kaz: «KKY Ltd» жауапкершілігі шектеулі серіктестігіне Прапорщиково ауылы маңында Ертіс өзенінің түбін тереңдету, жағалауын нығайту жұмыстарын жүргізу кезінде топырақты сақтауға арналған жер учаскесіне қауымдық сервитут белгілеу туралы
