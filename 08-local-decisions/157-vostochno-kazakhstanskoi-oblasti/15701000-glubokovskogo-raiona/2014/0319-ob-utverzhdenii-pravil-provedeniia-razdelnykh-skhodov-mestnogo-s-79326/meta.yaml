act_code: '79326'
requisite: Решение Глубоковского районного маслихата Восточно-Казахстанской области от 19 марта 2014 года № 24/4-V. Зарегистрировано Департаментом юстиции Восточно-Казахстанской области 24 апреля 2014 года № 3253. Утратило силу решением Глубоковского районного маслихата Восточно-Казахстанской области от 29 сентября 2020 года № 50/9-VI (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Правил проведения раздельных сходов местного сообщества и определения количества представителей жителей сел, улиц, многоквартирных жилых домов для участия в сходах местного сообщества на территории Глубоковского района
  kaz: Глубокое ауданының аумағында бөлек жергілікті қоғамдастық жиындарын өткізу Қағидасын бекіту және жергілікті қоғамдастық жиынына қатысу үшін ауыл, көше, көппәтерлі тұрғын үй тұрғындары өкілдерінің санын айқындау туралы
