  title:
    rus: О внесении изменений и дополнения в решение Глубоковского районного маслихата от 28 октября 2020 года № 51/3-VI «Об определении порядка организации и проведения мирных собраний на территории Глубоковского района»
    kaz: Глубокое аудандық мәслихатының 2020 жылғы 28 қазандағы № 51/3-VI «Глубокое ауданы аумағында бейбіт жиналыстарды ұйымдастыру және өткізу тәртібін белгілеу туралы» шешіміне өзгерістер мен толықтыру енгізу туралы
