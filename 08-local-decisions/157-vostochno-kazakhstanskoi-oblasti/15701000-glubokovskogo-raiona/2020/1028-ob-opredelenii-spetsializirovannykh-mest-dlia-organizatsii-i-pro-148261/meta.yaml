act_code: '148261'
requisite: Решение Глубоковского районного маслихата Восточно-Казахстанской области от 28 октября 2020 года № 51/3-VI. Зарегистрировано Департаментом юстиции Восточно-Казахстанской области 6 ноября 2020 года № 7776
title:
  rus: Об определении специализированных мест для организации и проведения мирных собраний и норм их предельной заполняемости, требований к их материально-техническому и организационному обеспечению, порядка их использования, границ прилегающих территорий, в которых запрещено проведение пикетирования по Глубоковскому району
  kaz: Глубокое ауданы бойынша бейбіт жиналыстарды ұйымдастыру және өткізу үшін арнайы орындарды және олардың шекті толу нормаларын, оларды материалдық-техникалық және ұйымдастырушылық қамтамасыз етуге қойылатын талаптарды, пайдалану тәртібін, пикеттеуді өткізуге тыйым салынған іргелес аумақтардың шекараларын айқындау туралы
