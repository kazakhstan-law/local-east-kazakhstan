act_code: '147447'
requisite: Решение Глубоковского районного маслихата Восточно-Казахстанской области от 29 сентября 2020 года № 50/9-VI. Зарегистрировано Департаментом юстиции Восточно-Казахстанской области 13 октября 2020 года № 7643. Утратило силу решением Глубоковского районного маслихата Восточно-Казахстанской области от 5 октября 2023 года № 5/6-VIII (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Правил проведения раздельных сходов местного сообщества и определения количества представителей жителей сел, улиц, многоквартирных жилых домов для участия в сходах местного сообщества на территории Глубоковского района
  kaz: Глубокое ауданының аумағында бөлек жергілікті қоғамдастық жиындарын өткізу және жергілікті қоғамдастық жиындарына қатысу үшін ауылдар, көшелер, көппәтерлі тұрғын үйлер тұрғындары өкілдерінің санын айқындау қағидаларын бекіту туралы
