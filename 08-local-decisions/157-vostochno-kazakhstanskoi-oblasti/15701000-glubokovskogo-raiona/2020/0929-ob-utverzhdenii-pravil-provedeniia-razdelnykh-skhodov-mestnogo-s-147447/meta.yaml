  title:
    rus: О внесении изменения в решение Глубоковского районного маслихата от 29 сентября 2020 года № 50/9-VI «Об утверждении Правил проведения раздельных сходов местного сообщества и определения количества представителей жителей сел, улиц, многоквартирных жилых домов для участия в сходах местного сообщества на территории Глубоковского района»
    kaz: Глубокое аудандық мәслихатының 2020 жылғы 29 қыркүйектегі № 50/9-VI «Глубокое ауданының аумағында бөлек жергілікті қоғамдастық жиындарын өткізу және жергілікті қоғамдастық жиындарына қатысу үшін ауылдар, көшелер, көппәтерлі тұрғын үйлер тұрғындары өкілдерінің санын айқындау қағидаларын бекіту туралы» шешіміне өзгеріс енгізу туралы
