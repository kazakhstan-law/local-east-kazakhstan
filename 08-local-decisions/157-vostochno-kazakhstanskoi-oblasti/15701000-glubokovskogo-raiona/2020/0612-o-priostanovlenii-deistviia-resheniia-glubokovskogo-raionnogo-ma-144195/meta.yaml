act_code: '144195'
requisite: Решение Глубоковского районного маслихата Восточно-Казахстанской области от 12 июня 2020 года № 44/4-VI. Зарегистрировано Департаментом юстиции Восточно-Казахстанской области 25 июня 2020 года № 7217. Утратило силу решением Глубоковского районного маслихата Восточно-Казахстанской области от 19 марта 2021 года № 3/15-VII (вводится в действие с 01.01.2021)
title:
  rus: О приостановлении действия решения Глубоковского районного маслихата от 27 сентября 2017 года № 15/5-VI «Об утверждении правил управления бесхозяйными отходами, признанными решением суда поступившими в коммунальную собственность Глубоковского района»
  kaz: Глубокое аудандық мәслихатының 2017 жылғы 27 қыркүйектегі № 15/5-VI «Сот шешімімен Глубокое ауданының коммуналдық меншігіне түскен иесіз болып танылған қалдықтарды басқару қағидаларын бекіту туралы» шешімінің күшін тоқтата тұру туралы
