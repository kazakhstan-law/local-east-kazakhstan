act_code: '223220'
requisite: Решение акима Бобровского сельского округа Глубоковского района Восточно-Казахстанской области от 17 марта 2026 года № 1
title:
  rus: Об установлении публичного сервитута на земельный участок для реконструкции гидротехнического сооружения «Плотина пруда-накопителя на реке Маховка в селе Солнечное» коммунальному государственному предприятию «Шығыс су қоймалары» управления природных ресурсов и регулирования природопользования ВосточноөКазахстанского областного акимата
  kaz: Шығыс Қазақстан облысы әкімдігінің Табиғи ресурстар және табиғат пайдалануды реттеу басқармасының «Шығыс су қоймалары» коммуналдық мемлекеттік кәсіпорнына «Солнечное ауылындағы Маховка өзеніндегі жинақтаушы тоған бөгеті» гидротехникалық құрылысын қайта жаңарту үшін жер учаскесіне қауымдық сервитут белгілеу туралы
