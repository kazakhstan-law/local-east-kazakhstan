requisite: Решение акима Глубоковского района Восточно-Казахстанской области от 28 декабря 2010 года № 14. Зарегистрировано управлением юстиции Глубоковского района Департамента юстиции Восточно-Казахстанской области 30 января 2011 года за № 5-9-144. Утратило силу в связи с истечением срока действия (письмо аппарата акима Глубоковского района от 12 мая 2011 года № 1730-02-10)
title:
