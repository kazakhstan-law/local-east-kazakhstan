  title:
    rus: О приостановлении действия решения Глубоковского районного маслихата от 5 сентября 2018 года № 24/8-VI «Об оказании социальной поддержки специалистам государственных организаций, проживающим и работающим в сельских населенных пунктах Глубоковского района»
    kaz: Глубокое аудандық мәслихатының 2018 жылғы 5 қыркүйектегі № 24/8-VI «Глубокое ауданының ауылдық елді мекендерінде тұратын және жұмыс істейтін мемлекеттік ұйымдардың мамандарына әлеуметтік қолдау көрсету туралы» шешімінің күшін уақытша тоқтату туралы
