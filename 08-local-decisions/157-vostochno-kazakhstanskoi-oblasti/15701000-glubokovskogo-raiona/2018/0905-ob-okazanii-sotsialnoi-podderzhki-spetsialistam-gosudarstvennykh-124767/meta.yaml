act_code: '124767'
requisite: Решение Глубоковского районного маслихата Восточно-Казахстанской области от 5 сентября 2018 года № 24/8-VI. Зарегистрировано Управлением юстиции Глубоковского района Департамента юстиции Восточно-Казахстанской области 28 сентября 2018 года № 5-9-180. Действие решения приостановлено до 1 октября 2020 года решением Глубоковского районного маслихата Восточно-Казахстанской области от 27 марта 2020 года № 39/8-VI (решение вводится в действие со дня принятия). Утратило силу решением Глубоковского районного маслихата Восточно-Казахстанской области от 29 сентября 2020 года № 50/7-VI (вводится в действие с 01.10.2020)
title:
  rus: Об оказании социальной поддержки специалистам государственных организаций, проживающим и работающим в сельских населенных пунктах Глубоковского района
