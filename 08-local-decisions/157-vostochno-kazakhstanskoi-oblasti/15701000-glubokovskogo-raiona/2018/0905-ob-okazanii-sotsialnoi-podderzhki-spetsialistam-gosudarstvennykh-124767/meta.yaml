  requisite: Решение Глубоковского районного маслихата Восточно-Казахстанской области от 22 ноября 2019 года № 36/7-VI. Зарегистрировано Департаментом юстиции Восточно-Казахстанской области 5 декабря 2019 года № 6350. Утратило силу решением Глубоковского районного маслихата Восточно-Казахстанской области от 5 октября 2023 года № 5/6-VIII (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
  title:
    rus: О внесении изменения в решение Глубоковского районного маслихата от 5 сентября 2018 года № 24/8-VI «Об оказании социальной поддержки специалистам государственных организаций, проживающим и работающим в сельских населенных пунктах Глубоковского района»
    kaz: Глубокое аудандық мәслихатының 2018 жылғы 5 қыркүйектегі № 24/8-VI «Глубокое ауданының ауылдық елді мекендерінде тұратын және жұмыс істейтін мемлекеттік ұйымдардың мамандарына әлеуметтік қолдау көрсету туралы» шешіміне өзгеріс енгізу туралы
