requisite: Решение Глубоковского районного маслихата Восточно-Казахстанской области от 15 марта 2018 года № 20/8-VI. Зарегистрировано Департаментом юстиции Восточно-Казахстанской области 9 апреля 2018 года № 5593. Утратило силу решением Глубоковского районного маслихата Восточно-Казахстанской области от 23 августа 2022 года № 23/3-VII (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении методики оценки деятельности административных государственных служащих корпуса «Б» государственного учреждения «Аппарат Глубоковского районного маслихата»
