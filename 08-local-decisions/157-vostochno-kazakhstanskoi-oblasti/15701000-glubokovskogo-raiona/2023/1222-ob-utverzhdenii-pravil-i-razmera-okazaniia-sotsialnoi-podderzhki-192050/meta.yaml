  title:
    rus: О внесении изменений в решение Глубоковского районного маслихата от 22 декабря 2023 года № 8/9-VIII «Об утверждении порядка и размера оказания социальной поддержки по оплате коммунальных услуг и приобретению топлива за счет бюджетных средств специалистам государственных организаций здравоохранения, социального обеспечения, образования, культуры, спорта и ветеринарии, проживающим и работающим в сельских населенных пунктах Глубоковского района»
    kaz: Глубокое аудандық мәслихатының 2023 жылғы 22 желтоқсандағы № 8/9-VIII «Глубокое ауданының ауылдық елді мекендерінде тұратын және жұмыс істейтін мемлекеттік денсаулық сақтау, әлеуметтік қамсыздандыру, білім беру, мәдениет, спорт және ветеринария ұйымдарының мамандарына коммуналдық қызметтерге ақы төлеу және бюджет қаражаты есебінен отын сатып алу бойынша әлеуметтік қолдау көрсету тәртібі мен мөлшерін бекіту туралы» шешіміне өзгерістер енгізу туралы
