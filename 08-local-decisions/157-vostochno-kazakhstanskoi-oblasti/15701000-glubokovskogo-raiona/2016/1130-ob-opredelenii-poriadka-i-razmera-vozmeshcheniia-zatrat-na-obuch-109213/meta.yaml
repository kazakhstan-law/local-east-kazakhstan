    kaz: Глубокое аудандық мәслихатының 2016 жылғы 30 қарашадағы № 7/4-VI «Мүгедектер қатарындағы кемтар балаларды жеке оқыту жоспары бойынша үйде оқытуға жұмсаған шығындарын өндіріп алулар туралы» шешіміне өзгеріс енгізу туралы
