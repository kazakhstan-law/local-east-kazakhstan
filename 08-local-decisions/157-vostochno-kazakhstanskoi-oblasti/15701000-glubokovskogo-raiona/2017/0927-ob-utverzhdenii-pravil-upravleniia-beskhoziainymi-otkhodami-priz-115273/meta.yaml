requisite: Решение Глубоковского районного маслихата Восточно-Казахстанской области от 27 сентября 2017 года № 15/5-VI. Зарегистрировано Департаментом юстиции Восточно-Казахстанской области 16 октября 2017 года № 5234. Действие решения приостановлено до 1 января 2021 года решением Глубоковского районного маслихата Восточно-Казахстанской области от 12 июня 2020 года № 44/4-VI (вводится в действие со дня принятия). Утратило силу решением Глубоковского районного маслихата Восточно-Казахстанской области от 19 марта 2021 года № 3/15-VII (вводится в действие с 01.01.2021)
