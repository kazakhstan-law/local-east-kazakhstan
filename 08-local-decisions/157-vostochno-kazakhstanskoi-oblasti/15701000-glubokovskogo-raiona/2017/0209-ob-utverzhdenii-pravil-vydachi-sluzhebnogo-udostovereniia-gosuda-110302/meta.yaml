    kaz: Глубокое аудандық мәслихатының 2017 жылғы 9 ақпандағы № 9/3-VI ««Глубокое аудандық мәслихатының аппараты» мемлекеттік мекемесі мемлекеттік қызметшілерінің қызметтік куәлігін беру және оның сипаттамасы қағидаларын бекіту туралы» шешімінің күші жойылды деп тану туралы
